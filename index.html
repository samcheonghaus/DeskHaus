<title>DeskHaus — 하나로 쓰는 사무 도구</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hyperformula/dist/hyperformula.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.11.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/occt-import-js.js"></script>
<style>
  :root{
    --bg:#EDEFF2; --panel:#FFFFFF; --ink:#22262B; --muted:#6B7482;
    --line:#D9DDE3; --accent:#1F4E8C; --accent-soft:#E8EEF7; --danger:#B4402F;
    --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px;
    display:flex; flex-direction:column; overflow:hidden;
  }
  /* ── 상단 바 ── */
  header{
    display:flex; align-items:flex-end; gap:24px;
    padding:14px 20px 0; background:var(--panel); border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .brand{display:flex; align-items:center; gap:8px; padding-bottom:12px;}
  .brand .mark{
    width:26px; height:26px; border-radius:7px; background:var(--accent);
    color:#fff; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center;
  }
  .brand b{font-size:15px; letter-spacing:.2px;}
  .brand span{font-size:12px; color:var(--muted);}
  .tabs{display:flex; gap:4px;}
  .tab{
    border:1px solid var(--line); border-bottom:none; background:#F3F5F8;
    padding:9px 22px 11px; border-radius:10px 10px 0 0; cursor:pointer;
    font-size:14px; color:var(--muted); position:relative; top:1px;
  }
  .tab.active{background:var(--bg); color:var(--ink); font-weight:600; border-color:var(--line);}
  .tab .dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:7px; background:#C3C9D2;}
  .tab.active .dot{background:var(--accent);}

  /* ── 공통 툴바 ── */
  .toolbar{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .toolbar .sep{width:1px; height:22px; background:var(--line); margin:0 4px;}
  button, select, input[type=color]{
    font-family:inherit; font-size:13px; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:7px;
    padding:5px 10px; cursor:pointer;
  }
  button:hover{border-color:var(--accent); color:var(--accent);}
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  button.primary:hover{background:#173D70; color:#fff;}
  button.newbtn{background:#B22234; color:#fff; border-color:#B22234; font-weight:600;}
  button.newbtn:hover{background:#8E1B29; color:#fff; border-color:#8E1B29;}
  button.icon{min-width:32px; font-weight:600;}
  button.danger:hover{border-color:var(--danger); color:var(--danger);}
  select{padding:5px 6px;}
  input[type=color]{padding:1px 2px; width:34px; height:29px;}
  label.small{font-size:12px; color:var(--muted);}

  main{flex:1; display:flex; overflow:hidden;}
  .mode{flex:1; display:none; overflow:hidden;}
  .mode.active{display:flex;}

  /* 표(스프레드시트) 모드 */
  #sheetWrap{ flex:1; display:flex; flex-direction:column; overflow:hidden; background:#fff; }
  #formulaBar{
    display:flex; align-items:center; gap:0; border-bottom:1px solid var(--line);
    background:var(--panel); flex-shrink:0;
  }
  #cellRef{
    width:70px; text-align:center; font-weight:600; font-size:13px; color:var(--accent);
    padding:7px 0; border-right:1px solid var(--line); flex-shrink:0;
  }
  #formulaInput{
    flex:1; border:none; outline:none; padding:7px 12px; font-size:14px;
    font-family:'Segoe UI','Malgun Gothic',sans-serif; background:transparent;
  }
  #sheetScroll{ flex:1; overflow:auto; }
  #sheetTable{ border-collapse:collapse; table-layout:fixed; }
  #sheetTable th, #sheetTable td{
    border:1px solid #D5DAE1; padding:0; height:26px; overflow:hidden;
  }
  #sheetTable thead th, #sheetTable tbody th{
    background:#F0F3F7; color:var(--muted); font-weight:600; font-size:12px;
    text-align:center; user-select:none; position:sticky; z-index:1;
  }
  #sheetTable thead th{ top:0; min-width:90px; }
  #sheetTable tbody th{ left:0; width:44px; min-width:44px; }
  #sheetTable thead th:first-child{ left:0; z-index:2; width:44px; min-width:44px; }
  #sheetTable td{
    background:#fff; font-size:13px; cursor:cell; padding:2px 6px;
    white-space:nowrap; color:var(--ink);
  }
  #sheetTable td.rsel{ background:#E9F0FA; }
  #sheetTable td.sel{ outline:2px solid var(--accent); outline-offset:-2px; background:#fff; }
  #sheetTable td.fsel{ outline:1.5px dashed var(--accent); outline-offset:-2px; }
  #sheetTable td.editing{ background:#fff; outline:2px solid var(--accent); outline-offset:-2px; }
  #sheetTable th.hsel{ background:#DCE6F5; color:var(--accent); }
  #sheetScroll{ position:relative; }
  #shFillHandle{
    display:none; position:absolute; width:8px; height:8px; z-index:3;
    background:var(--accent); border:1.5px solid #fff; cursor:crosshair;
  }
  #shStats{
    padding:0 14px; font-size:12.5px; color:var(--accent); white-space:pre;
    border-left:1px solid var(--line); align-self:stretch; display:flex; align-items:center;
    flex-shrink:0;
  }

  /* 3D(STEP) 모드 */
  #d3Area{ flex:1; position:relative; overflow:hidden; background:var(--bg); }
  #d3Area canvas{ display:block; }
  #d3Empty{
    position:absolute; left:0; right:0; top:80px; text-align:center;
    color:var(--muted); font-size:14px; pointer-events:none;
  }
  /* 찾기/바꾸기 (비모달) */
  #dlgFind{ position:fixed; top:108px; right:26px; left:auto; margin:0; z-index:50; }
  #dlgFind .frow input{ flex:1; }

  /* PDF 모드 */
  #pdfArea{ flex:1; overflow:auto; display:flex; align-items:flex-start; justify-content:center; padding:26px; background:var(--bg); }
  #pdfCanvas{ background:#fff; box-shadow:0 2px 14px rgba(30,40,60,.12); }
  #pdfEmpty{ color:var(--muted); font-size:14px; margin-top:80px; }

  /* ── 글 모드 ── */
  #docScroll{flex:1; overflow:auto; padding:28px 0 60px;}
  .page{
    width:210mm; min-height:297mm; margin:0 auto; background:#fff;
    border:1px solid var(--line); box-shadow:0 2px 14px rgba(30,40,60,.08);
    padding:25mm 20mm; outline:none; line-height:1.7;
    box-sizing:border-box;
  }
  /* 레터헤드 */
  #letterhead{
    display:flex; align-items:center; gap:20px;
    padding-bottom:18px; margin-bottom:26px; border-bottom:2px solid var(--accent);
    position:relative;
  }
  #letterhead.collapsed{ display:none; }
  #lhLogoBox{
    width:88px; height:88px; flex-shrink:0; border:1px dashed var(--line);
    border-radius:8px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; overflow:hidden; background:#FAFBFC; transition:border-color .15s;
  }
  #lhLogoBox:hover{ border-color:var(--accent); }
  #lhLogoBox img{ width:100%; height:100%; object-fit:contain; }
  #lhLogoPlaceholder{ font-size:12px; color:var(--muted); text-align:center; }
  #lhInfo{ flex:1; min-width:0; }
  #lhName{
    font-size:22px; font-weight:700; color:var(--ink); outline:none;
    padding:2px 4px; border-radius:4px; margin-bottom:4px;
  }
  #lhContact{ display:flex; flex-wrap:wrap; gap:4px 18px; font-size:13px; color:var(--muted); }
  #lhContact span{ outline:none; padding:1px 4px; border-radius:4px; }
  #lhName:focus, #lhContact span:focus{ background:var(--accent-soft); }
  /* 빈 편집영역 placeholder */
  [contenteditable][data-ph]:empty:before{
    content:attr(data-ph); color:#AEB6C2; cursor:text;
  }
  #lhToggle{
    position:absolute; top:-6px; right:-6px; width:24px; height:24px; min-width:0;
    padding:0; border-radius:50%; font-size:14px; line-height:1; color:var(--muted);
  }
  #lhShow{
    display:block; margin-bottom:20px; font-size:12px; color:var(--muted);
    padding:5px 12px; border:1px dashed var(--line); background:#FAFBFC;
  }
  #lhShow:hover{ border-color:var(--accent); color:var(--accent); }
  .page h1{font-size:26px; margin:14px 0 8px;}
  .page h2{font-size:20px; margin:12px 0 6px;}
  .page p{margin:4px 0;}
  .page ul,.page ol{margin:6px 0 6px 24px;}
  .page table{border-collapse:collapse; margin:10px 0; width:100%;}
  .page td,.page th{border:1px solid #B9C0CA; padding:6px 9px; min-width:40px; text-align:center; vertical-align:middle;}
  .page th{background:#F0F3F7; font-weight:600;}
  .page img{max-width:100%; cursor:pointer; border-radius:2px;}
  .page img.sized{max-width:none;}
  .page img:hover{outline:2px solid var(--accent); outline-offset:2px;}

  /* 상태 바 */
  footer{
    display:flex; align-items:center; gap:18px; padding:6px 16px;
    background:var(--panel); border-top:1px solid var(--line);
    font-size:12px; color:var(--muted); flex-shrink:0; min-height:30px;
  }
  footer .calc{color:var(--accent); font-weight:600;}
  footer .hint{margin-left:auto;}

  /* ── 그림 모드 ── */
  #imgWrap{flex:1; display:flex; overflow:hidden;}
  #canvasArea{flex:1; overflow:auto; display:flex; align-items:flex-start; justify-content:center; padding:26px;}
  #canvasBox{position:relative; box-shadow:0 2px 14px rgba(30,40,60,.12); flex-shrink:0;}
  #cv{display:block; background:transparent;}
  #cropLayer{position:absolute; inset:0; cursor:crosshair; display:none;}

  /* 레이어 패널 */
  aside{
    width:250px; background:var(--panel); border-left:1px solid var(--line);
    display:flex; flex-direction:column; flex-shrink:0;
  }
  aside h3{
    font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.6px;
    padding:12px 14px 8px; border-bottom:1px solid var(--line);
  }
  #layerList{flex:1; overflow:auto; padding:8px;}
  .layer{
    display:flex; align-items:center; gap:8px; padding:8px 9px; margin-bottom:5px;
    border:1px solid var(--line); border-radius:8px; cursor:pointer; background:#fff;
  }
  .layer.sel{border-color:var(--accent); background:var(--accent-soft);}
  .layer .thumb{
    width:34px; height:26px; border:1px solid var(--line); border-radius:4px;
    background:#fff center/cover no-repeat; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted); overflow:hidden;
  }
  .layer .nm{flex:1; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .layer .eye{border:none; background:none; padding:2px 4px; font-size:14px;}
  #layerCtrl{padding:10px 12px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px;}
  #layerCtrl .row{display:flex; gap:6px; align-items:center;}
  #layerCtrl input[type=range]{flex:1;}
  #layerCtrl .row button{flex:1; padding:4px 0;}

  /* ── PPT(프레젠테이션) 모드 ── */
  #ppWrap{flex:1; display:flex; overflow:hidden;}
  #ppList{width:172px; background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:10px; flex-shrink:0;}
  .ppThumb{position:relative; margin-bottom:10px; cursor:pointer; border:2px solid var(--line); border-radius:6px; overflow:hidden; background:#fff;}
  .ppThumb:hover{border-color:#AEB6C2;}
  .ppThumb.sel{border-color:var(--accent);}
  .ppThumbNum{position:absolute; top:2px; left:4px; z-index:2; font-size:11px; color:var(--muted); background:rgba(255,255,255,.8); padding:0 4px; border-radius:4px;}
  .ppMiniBox{width:144px; height:81px; position:relative; overflow:hidden; pointer-events:none;}
  .ppMini{width:960px; height:540px; position:absolute; top:0; left:0; transform-origin:top left; overflow:hidden;}
  #ppMain{flex:1; display:flex; flex-direction:column; overflow:hidden;}
  #ppStageArea{flex:1; overflow:auto; display:flex; padding:24px; background:var(--bg);}
  #ppStageBox{position:relative; flex-shrink:0; margin:auto; box-shadow:0 2px 14px rgba(30,40,60,.14);}
  #ppStage{width:960px; height:540px; position:absolute; top:0; left:0; transform-origin:top left; background:#fff; overflow:hidden;}
  .ppEl{cursor:move; user-select:none;}
  #ppStage .ppEl.sel{outline:2px solid var(--accent); outline-offset:0;}
  #ppStage .ppEl[contenteditable="true"]{cursor:text; user-select:text; outline:2px dashed var(--accent);}
  .pph{position:absolute; right:-8px; bottom:-8px; width:15px; height:15px; background:var(--accent); border:2px solid #fff; border-radius:3px; cursor:nwse-resize;}
  #ppNotes{height:64px; resize:none; border:none; border-top:1px solid var(--line); padding:8px 14px; font-family:inherit; font-size:13px; color:var(--ink); background:var(--panel); outline:none; flex-shrink:0;}
  #ppShow{position:fixed; inset:0; background:#000; z-index:1000; display:none; align-items:center; justify-content:center;}
  #ppShowSlide{position:relative; overflow:hidden; cursor:pointer;}
  #ppShowSlide>div{position:absolute; top:0; left:0;}
  #ppShowSlide .ppEl{cursor:pointer;}
  #ppShowBar{position:fixed; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:8px; align-items:center; background:rgba(30,34,40,.88); border-radius:10px; padding:6px 10px; opacity:.35; transition:opacity .2s; z-index:1001;}
  #ppShowBar:hover{opacity:1;}
  #ppShowBar button{background:#333A46; color:#fff; border:none;}
  #ppShowBar button:hover{background:#4A5160; color:#fff;}
  #ppShowNum{color:#D5DAE1; font-size:13px; min-width:60px; text-align:center;}

  /* 다이얼로그 */
  dialog{
    border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px;
    box-shadow:0 8px 30px rgba(20,30,50,.2); min-width:300px;
  }
  dialog::backdrop{background:rgba(30,38,50,.35);}
  dialog h4{font-size:15px; margin-bottom:14px;}
  dialog .frow{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  dialog .frow label{width:64px; font-size:13px; color:var(--muted);}
  dialog input[type=number], dialog input[type=text]{
    flex:1; border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:13px; font-family:inherit;
  }
  dialog .btns{display:flex; justify-content:flex-end; gap:8px; margin-top:14px;}

  @media print{
    @page { size: A4 portrait; margin: 20mm; }
    header,.toolbar,footer,aside{display:none !important;}
    #docScroll{overflow:visible; padding:0;}
    .page{border:none; box-shadow:none; width:auto; min-height:auto; padding:0; margin:0;}
    body{overflow:visible;}
    #modeImg,#modeSheet,#modePdf,#modePpt,#ppShow{display:none !important;}
    #modeDoc{display:block !important;}
    #lhToggle{display:none !important;}
    #lhLogoBox{border:none !important;}
    #imgSizeBar{display:none !important;}
  }
</style>
</head>

let LANG = 'ko';
const T = k => (I18N[LANG][k] !== undefined ? I18N[LANG][k] : k);
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n'); if(I18N[LANG][k]!==undefined) el.textContent = I18N[LANG][k];
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{
    const k = el.getAttribute('data-i18n-title'); if(I18N[LANG][k]!==undefined) el.title = I18N[LANG][k];
  });
  /* 상태바 모드/힌트는 현재 모드에 맞게 */
  const mmAll = {doc:'modeDoc', img:'modeImg', sheet:'modeSheet', pdf:'modePdf', ppt:'modePpt', d3:'mode3d'};
  let curMode = 'doc';
  for(const k in mmAll){ const el = document.getElementById(mmAll[k]); if(el && el.classList.contains('active')) curMode = k; }
  const lbAll = {doc:'statModeDoc', img:'statModeImg', sheet:'statModeSheet', pdf:'statModePdf', ppt:'statModePpt', d3:'statMode3d'};
  const htAll = {doc:'statHintDoc', img:'statHintImg', sheet:'statHintSheet', pdf:'statHintPdf', ppt:'statHintPpt', d3:'statHint3d'};
  document.getElementById('statMode').textContent = T(lbAll[curMode]);
  document.getElementById('statHint').textContent = T(htAll[curMode]);
  const pn = document.getElementById('ppNotes'); if(pn) pn.placeholder = T('ppNotesPh');
  /* 편집영역 placeholder */
  document.querySelectorAll('[data-ph-key]').forEach(el=>{
    const k = el.getAttribute('data-ph-key'); el.setAttribute('data-ph', T(k));
  });
  document.getElementById('langBtn').textContent = LANG==='ko' ? 'EN' : '한국어';
}

const msg = t => { $('statMsg').textContent = t; setTimeout(()=>{ if($('statMsg').textContent===t) $('statMsg').textContent=''; }, 4000); };
async function download(blob, name){
  /* 1) 데스크톱(exe) 버전: 네이티브 저장 대화상자 */
  if(typeof Neutralino !== 'undefined' && window.NL_TOKEN !== undefined){
    try{
      const path = await Neutralino.os.showSaveDialog('저장', {defaultPath: name});
      if(!path) return;
      await Neutralino.filesystem.writeBinaryFile(path, await blob.arrayBuffer());
      msg(T('mSaved') + path);
      return;
    }catch(e){ /* 실패 시 다음 방식으로 */ }
  }
  /* 2) 지원 브라우저(크롬·엣지 등): "다른 이름으로 저장" 창 */
  if(window.showSaveFilePicker){
    try{
      const ext = '.' + name.split('.').pop();
      const h = await showSaveFilePicker({
        suggestedName: name,
        types: [{ description: ext.slice(1).toUpperCase() + ' 파일', accept: { [blob.type || 'application/octet-stream']: [ext] } }]
      });
      const w = await h.createWritable();
      await w.write(blob); await w.close();
      msg(T('mSavedShort'));
      return;
    }catch(e){
      if(e.name === 'AbortError') return;  /* 사용자가 취소 */
      /* 그 외 오류는 다음 방식으로 */
    }
  }
  /* 3) 그 외: 이름 입력창 → 다운로드 폴더로 저장 */
  const finalName = await askName(name);
  if(finalName === null) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = finalName; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
/* 파일 이름 입력 대화상자 */
function askName(def){
  return new Promise(res=>{
    const d = $('dlgSave'), inp = $('saveName');
    inp.value = def;
    const ext = '.' + def.split('.').pop();
    const finish = v=>{
      $('svOk').onclick = $('svCancel').onclick = inp.onkeydown = d.oncancel = null;
      d.close(); res(v);
    };
    $('svOk').onclick = ()=>{
      let n = inp.value.trim() || def;
      if(!n.toLowerCase().endsWith(ext.toLowerCase())) n += ext;
      finish(n);
    };
    $('svCancel').onclick = ()=> finish(null);
    d.oncancel = ()=> finish(null);
    inp.onkeydown = e=>{ if(e.key === 'Enter'){ e.preventDefault(); $('svOk').onclick(); } };
    d.showModal();
    /* 확장자 앞부분만 선택해 두어 바로 타이핑 가능 */
    inp.setSelectionRange(0, def.length - ext.length);
    inp.focus();
  });
}

/* 확인 대화상자 */
function askConfirm(text){
  return new Promise(res=>{
    const d = $('dlgConfirm');
    $('cfMsg').textContent = text;
    const finish = v=>{ $('cfYes').onclick = $('cfNo').onclick = d.oncancel = null; d.close(); res(v); };
    $('cfYes').onclick = ()=> finish(true);
    $('cfNo').onclick = ()=> finish(false);
    d.oncancel = ()=> finish(false);
    d.showModal();
  });
}

/* Σ 아래 합계: 각 열의 숫자를 더한 행을 표 맨 아래에 추가 (재클릭 시 재계산) */
$('tSumRow').onclick = ()=>{
  const c = curCell(); if(!c){ msg(T('mClickTable')); return; }
  const tb = c.closest('table');
  tb.querySelectorAll('tr[data-sum]').forEach(r=>r.remove());
  const rows = [...tb.rows];
  const cols = Math.max(...rows.map(r=>r.cells.length));
  const tr = document.createElement('tr'); tr.dataset.sum = '1';
  for(let i=0;i<cols;i++){
    let sum = 0, found = false;
    rows.forEach(r=>{
      const cell = r.cells[i];
      if(cell && cell.tagName === 'TD' && !cell.dataset.sum && isNum(cell.textContent)){ sum += numOf(cell.textContent); found = true; }
    });
    const td = document.createElement('td');
    td.style.background = '#EDF2FA'; td.style.fontWeight = '600';
    td.innerHTML = found ? (+sum.toFixed(4)).toLocaleString() : (i===0 ? T('sumLabel') : '<br>');
    tr.appendChild(td);
  }
  tb.appendChild(tr);
  msg(T('mSumRowDone'));
};
/* Σ 우측 합계: 각 행의 숫자를 더한 열을 표 오른쪽에 추가 (재클릭 시 재계산) */
$('tSumCol').onclick = ()=>{

  const tb = c.closest('table');
  tb.querySelectorAll('td[data-sum], th[data-sum]').forEach(x=>x.remove());
  [...tb.rows].forEach(r=>{
    const isHead = r.cells[0] && r.cells[0].tagName === 'TH';
    const el = document.createElement(isHead ? 'th' : 'td');
    el.dataset.sum = '1'; el.style.background = '#EDF2FA';
    if(isHead) el.textContent = T('sumLabel');
    else {
      /* 아래 합계 행이면 그 행의 열 합계들을 다 더해 전체 총계로 */
      let sum = 0, found = false;
      [...r.cells].forEach(cell=>{ if(!cell.dataset.sum && isNum(cell.textContent)){ sum += numOf(cell.textContent); found = true; } });
      el.style.fontWeight = '600';
      if(r.dataset.sum) el.style.background = '#DCE6F5';  /* 총계 칸 강조 */
      el.innerHTML = found ? (+sum.toFixed(4)).toLocaleString() : '<br>';
    }
    r.appendChild(el);
  });
  msg(T('mSumColDone'));
};

/* ── 표 → 엑셀(.xlsx) 저장 ── */
function tableToAOA(tb){
  const aoa = [];
  [...tb.rows].forEach(r=>{
    const row = [];
    [...r.cells].forEach(c=>{
      const t = c.textContent.trim();
      row.push(isNum(t) ? numOf(t) : t);   /* 숫자는 숫자로 저장 */
    });
    aoa.push(row);
  });
  return aoa;
}

      const cols = Math.max(...aoa.map(r=>r.length));

        html += '<tr>';
        for(let ci=0; ci<cols; ci++){
          const v = r[ci] === undefined ? '' : String(r[ci]);
          const tag = ri === 0 ? 'th' : 'td';
          html += `<${tag}>${v ? esc(v) : '<br>'}</${tag}>`;

        html += '</tr>';
      });

      editor.focus();

      if(!s.rangeCount || !editor.contains(s.anchorNode)){
        editor.appendChild(document.createRange().createContextualFragment(html));
      } else {
        document.execCommand('insertHTML', false, html);
      }
      msg(f.name + T('mXlsxImported'));
    }catch(err){ msg(T('mImportFail') + err.message); }
  };
  rd.readAsArrayBuffer(f); e.target.value='';
};

/* 에디터 HTML → docx 문서 조립 */
async function buildDocx(){
  const D = docx;
  const children = [];

  /* dataURL/일반 URL → {data, w, h} (docx ImageRun용) */
  async function imgToRun(imgEl, opts){
    opts = opts || {};
    try{
      let src = imgEl.getAttribute('src'); if(!src) return null;
      let bytes;
      if(src.startsWith('data:')){
        const b64 = src.split(',')[1];
        const bin = atob(b64); const arr = new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
        bytes = arr;
      } else {
        const resp = await fetch(src); bytes = new Uint8Array(await resp.arrayBuffer());
      }
      let w = imgEl.naturalWidth || imgEl.width || 300;
      let h = imgEl.naturalHeight || imgEl.height || 200;
      const ratio = h / w;
      /* 사용자가 문서에서 크기를 조절했으면(style.width) 그 값을 우선 */
      const styleW = parseFloat(imgEl.style && imgEl.style.width);
      if(!opts.fixedWidth && styleW && styleW > 0){
        w = styleW; h = Math.round(styleW * ratio);
      }
      if(opts.fixedWidth){
        /* 원본 크기와 무관하게 지정 너비로 강제 (로고용) */
        w = opts.fixedWidth; h = Math.round(opts.fixedWidth * ratio);
      } else {
        const maxW = opts.maxWidth || 600;
        if(w > maxW){ w = maxW; h = Math.round(maxW * ratio); }
      }
      const m = /^data:image\/(\w+)/.exec(src);
      let type = m ? m[1].toLowerCase() : (/\.png/i.test(src)?'png':/\.gif/i.test(src)?'gif':'jpg');
      if(type==='jpeg') type='jpg';
      if(!['png','jpg','gif','bmp'].includes(type)) type='png';  /* webp 등은 png로 표기(대부분 브라우저가 관대하게 처리) */
      return new D.ImageRun({ data:bytes, transformation:{ width:Math.round(w), height:Math.round(h) }, type });
    }catch(e){ return null; }
  }

  /* 인라인 노드 → TextRun/ImageRun 배열 (이미지 포함) */
  async function runsFrom(node, inherit){
    inherit = inherit || {};
    const runs = [];
    for(const n of node.childNodes){
      if(n.nodeType === 3){
        if(n.textContent) runs.push(new D.TextRun({ text:n.textContent, bold:inherit.bold, italics:inherit.italic, underline:inherit.underline?{}:undefined, color:inherit.color }));
      } else if(n.nodeType === 1){
        const tag = n.tagName.toLowerCase();
        if(tag==='img'){ const ir = await imgToRun(n); if(ir) runs.push(ir); continue; }
        if(tag==='br'){ runs.push(new D.TextRun({ break:1 })); continue; }
        const inh = Object.assign({}, inherit);
        if(tag==='b'||tag==='strong') inh.bold=true;
        if(tag==='i'||tag==='em') inh.italic=true;
        if(tag==='u') inh.underline=true;
        if(n.style && n.style.color) inh.color = rgbToHex(n.style.color);
        runs.push(...await runsFrom(n, inh));
      }
    }
    return runs;
  }
  /* 표 → docx Table */
  async function tableFrom(tb){
    const rows = [];
    for(const tr of [...tb.rows]){
      const cells = [];
      for(const c of [...tr.cells]){
        const isHead = c.tagName==='TH';
        cells.push(new D.TableCell({
          children:[ new D.Paragraph({ alignment:D.AlignmentType.CENTER, children: await runsFrom(c, {bold:isHead}) }) ],
          shading: isHead ? { fill:'F0F3F7' } : (c.dataset && c.dataset.sum ? { fill:'EDF2FA' } : undefined),
        }));
      }
      rows.push(new D.TableRow({ children:cells }));
    }
    return new D.Table({ rows, width:{ size:100, type:D.WidthType.PERCENTAGE } });
  }
  /* 레터헤드 (로고 이미지 포함) */
  const lhName = $('lhName').textContent.trim();
  const lhEmail = $('lhEmail').textContent.trim();
  const lhPhone = $('lhPhone').textContent.trim();
  const lhVisible = !$('letterhead').classList.contains('collapsed');
  const lhLogoEl = $('lhLogo');
  const hasLogo = lhLogoEl && lhLogoEl.style.display!=='none' && lhLogoEl.getAttribute('src');
  if(lhVisible && (lhName || lhEmail || lhPhone || hasLogo)){
    /* 정보 칸(오른쪽): 회사명 + 연락처 */
    const infoParas = [];
    if(lhName) infoParas.push(new D.Paragraph({ children:[new D.TextRun({ text:lhName, bold:true, size:36 })] }));
    const cinfo = [lhEmail, lhPhone].filter(Boolean).join('   ');
    if(cinfo) infoParas.push(new D.Paragraph({ children:[new D.TextRun({ text:cinfo, size:20, color:'6B7482' })] }));
    if(!infoParas.length) infoParas.push(new D.Paragraph({ children:[] }));

    if(hasLogo){
      /* 로고가 있으면: 테두리 없는 2칸 표 (로고 | 정보) */
      const logoRun = await imgToRun(lhLogoEl, {fixedWidth:80});
      const logoCell = new D.TableCell({
        width:{ size:1730, type:D.WidthType.DXA },
        margins:{ right:180 },
        verticalAlign:D.VerticalAlign.CENTER,
        children:[ new D.Paragraph({ children: logoRun ? [logoRun] : [] }) ],
      });
      const infoCell = new D.TableCell({
        width:{ size:7908, type:D.WidthType.DXA },
        verticalAlign:D.VerticalAlign.CENTER,
        children: infoParas,
      });
      const noBorder = { style:D.BorderStyle.NONE, size:0, color:'FFFFFF' };
      children.push(new D.Table({
        width:{ size:100, type:D.WidthType.PERCENTAGE },
        columnWidths:[1730, 7908],   /* twip: A4 본문폭 9638 = 로고칸 + 정보칸 */
        borders:{ top:noBorder, bottom:noBorder, left:noBorder, right:noBorder, insideHorizontal:noBorder, insideVertical:noBorder },
        rows:[ new D.TableRow({ children:[logoCell, infoCell] }) ],
      }));
    } else {
      /* 로고 없으면 정보만 */
      infoParas.forEach(p=> children.push(p));
    }
    /* 파란 밑줄 구분선 */
    children.push(new D.Paragraph({ border:{ bottom:{ color:'1F4E8C', size:12, style:D.BorderStyle.SINGLE } }, children:[] }));
    children.push(new D.Paragraph({ children:[] }));
  }
  /* 본문 블록 순회 */
  for(const node of [...editor.childNodes]){
    if(node.nodeType === 3){
      if(node.textContent.trim()) children.push(new D.Paragraph({ children:[new D.TextRun(node.textContent)] }));
      continue;
    }
    if(node.nodeType !== 1) continue;
    const tag = node.tagName.toLowerCase();
    if(tag==='table'){ children.push(await tableFrom(node)); children.push(new D.Paragraph({children:[]})); continue; }
    if(tag==='img'){
      const ir=await imgToRun(node);
      if(ir){
        /* 이미지 정렬 판단: margin-left auto + margin-right auto=가운데, ml auto만=오른쪽 */
        const ml = node.style.marginLeft, mr = node.style.marginRight;
        let al;
        if(ml==='auto' && mr==='auto') al = D.AlignmentType.CENTER;
        else if(ml==='auto') al = D.AlignmentType.RIGHT;
        children.push(new D.Paragraph({ alignment:al, children:[ir] }));
      }
      continue;
    }
    if(tag==='ul'||tag==='ol'){
      for(const li of [...node.children])
        children.push(new D.Paragraph({ children:await runsFrom(li), bullet: tag==='ul'?{level:0}:undefined, numbering: tag==='ol'?{reference:'num',level:0}:undefined }));
      continue;
    }
    let heading;
    if(tag==='h1') heading = D.HeadingLevel.HEADING_1;
    else if(tag==='h2') heading = D.HeadingLevel.HEADING_2;
    else if(tag==='h3') heading = D.HeadingLevel.HEADING_3;
    const align = node.style && node.style.textAlign;
    const alignment = align==='center'?D.AlignmentType.CENTER : align==='right'?D.AlignmentType.RIGHT : undefined;
    children.push(new D.Paragraph({ heading, alignment, children: await runsFrom(node) }));
  }
  if(!children.length) children.push(new D.Paragraph({children:[]}));

  const doc = new D.Document({
    numbering:{ config:[{ reference:'num', levels:[{ level:0, format:D.LevelFormat.DECIMAL, text:'%1.', alignment:D.AlignmentType.START }] }] },
    sections:[{
      properties:{ page:{ size:{ width:11906, height:16838, orientation:D.PageOrientation.PORTRAIT }, margin:{ top:1134, bottom:1134, left:1134, right:1134 } } },
      children
    }],
  });
  return await D.Packer.toBlob(doc);
}
function rgbToHex(rgb){
  const m = (rgb||'').match(/\d+/g); if(!m || m.length<3) return undefined;
  return ((1<<24) + (+m[0]<<16) + (+m[1]<<8) + (+m[2])).toString(16).slice(1).toUpperCase();
}

/* ── 한글 .hwpx 열기 (JSZip으로 직접 해석 — 문단·표·이미지) ── */
async function importHwpx(buf){
  if(typeof JSZip === 'undefined') throw new Error(T('mDocxNoMod'));
  const zip = await JSZip.loadAsync(buf);
  const parser = new DOMParser();
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const MIME = {png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', bmp:'image/bmp', webp:'image/webp'};

  /* 매니페스트(content.hpf): 이미지 id → 파일 경로·형식 */
  const items = {};
  const hpf = zip.file('Contents/content.hpf');
  if(hpf){
    const mx = parser.parseFromString(await hpf.async('string'), 'application/xml');
    [...mx.getElementsByTagName('*')].filter(n => n.localName === 'item').forEach(it => {
      const id = it.getAttribute('id');
      if(id) items[id] = { href: it.getAttribute('href'), type: it.getAttribute('media-type') };
    });
  }

  /* pic 노드 → <img> (BinData의 이미지를 dataURL로) */
  async function imgTag(node){
    const img = [...node.getElementsByTagName('*')].find(n => n.localName === 'img');
    const rid = img && img.getAttribute('binaryItemIDRef');
    if(!rid) return '';
    let path = items[rid] && items[rid].href;
    if(path) path = path.replace(/^\.\//, '');
    if(!path || !zip.file(path)){
      const low = rid.toLowerCase();
      path = Object.keys(zip.files).find(k => /^BinData\//i.test(k) && k.toLowerCase().includes(low));
    }
    if(!path || !zip.file(path)) return '';
    const ext = path.split('.').pop().toLowerCase();
    const mime = MIME[ext] || (items[rid] && items[rid].type);
    if(!mime || !mime.startsWith('image/')) return '';
    const b64 = await zip.file(path).async('base64');
    return `<img src="data:${mime};base64,${b64}">`;
  }

  /* 표 → HTML table (셀 병합 포함, 중첩 표는 생략) */
  function nearestUp(n, names){
    let a = n.parentNode;
    while(a && !names.includes(a.localName)) a = a.parentNode;
    return a;
  }
  async function tblHtml(tbl){
    let h = '<table>';
    const rows = [...tbl.getElementsByTagName('*')].filter(n => n.localName === 'tr' && nearestUp(n, ['tbl']) === tbl);
    for(const tr of rows){
      h += '<tr>';
      const cells = [...tr.getElementsByTagName('*')].filter(n => n.localName === 'tc' && nearestUp(n, ['tr']) === tr);
      for(const tc of cells){
        const span = [...tc.children].find(c => c.localName === 'cellSpan');
        const cs = span ? (+span.getAttribute('colSpan') || 1) : 1;
        const rs = span ? (+span.getAttribute('rowSpan') || 1) : 1;
        const ps = [...tc.getElementsByTagName('*')].filter(n => n.localName === 'p' && nearestUp(n, ['tc','tbl']) === tc);
        const txt = ps.map(p =>
          [...p.getElementsByTagName('*')].filter(n => n.localName === 't').map(t => esc(t.textContent)).join('')
        ).join('<br>');
        h += `<td${cs>1 ? ` colspan="${cs}"` : ''}${rs>1 ? ` rowspan="${rs}"` : ''}>${txt || '<br>'}</td>`;
      }
      h += '</tr>';
    }
    return h + '</table>';
  }

  /* 문단 → HTML (글·표·이미지를 원래 순서대로) */
  async function paraHtml(p){
    let out = '', text = '';
    const flush = () => { if(text !== ''){ out += '<p>' + text + '</p>'; text = ''; } };
    for(const run of [...p.children]){
      if(run.localName !== 'run') continue;
      for(const ch of [...run.children]){
        const ln = ch.localName;
        if(ln === 't'){
          for(const nd of [...ch.childNodes]){
            if(nd.nodeType === 3) text += esc(nd.nodeValue);
            else if(nd.localName === 'lineBreak') text += '<br>';
            else if(nd.textContent) text += esc(nd.textContent);
          }
        }else if(ln === 'tbl'){ flush(); out += await tblHtml(ch); }
        else if(ln === 'pic'){ flush(); const t = await imgTag(ch); if(t) out += '<p>' + t + '</p>'; }
        else{
          /* 글상자·컨테이너 등: 안쪽의 표/그림/글을 추출 */
          const inner = [...ch.getElementsByTagName('*')];
          const tb = inner.find(n => n.localName === 'tbl');
          const pc = inner.find(n => n.localName === 'pic');
          if(tb){ flush(); out += await tblHtml(tb); }
          else if(pc){ flush(); const t = await imgTag(pc); if(t) out += '<p>' + t + '</p>'; }
          else{
            const ts = inner.filter(n => n.localName === 't').map(t => esc(t.textContent)).join(' ');
            if(ts.trim()) text += (text ? ' ' : '') + ts;
          }
        }
      }
    }
    if(text !== '') out += '<p>' + text + '</p>';
    return out || '<p><br></p>';
  }

  /* 본문 섹션들을 순서대로 처리 */
  const secs = Object.keys(zip.files)
    .filter(n => /^Contents\/section\d+\.xml$/.test(n))
    .sort((a,b) => +a.match(/(\d+)\.xml/)[1] - +b.match(/(\d+)\.xml/)[1]);
  if(!secs.length) throw new Error('.hwpx');
  let html = '';
  for(const s of secs){
    const xml = parser.parseFromString(await zip.file(s).async('string'), 'application/xml');
    for(const p of [...xml.documentElement.children]){
      if(p.localName === 'p') html += await paraHtml(p);
    }
  }
  return html || '<p><br></p>';
}

$('fileOpenDoc').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const name = f.name.toLowerCase();
  const rd = new FileReader();
  if(name.endsWith('.docx')){
    if(typeof mammoth === 'undefined'){ msg(T('mDocxNoMod')); e.target.value=''; return; }

      mammoth.convertToHtml({arrayBuffer: rd.result})
        .then(res=>{ editor.innerHTML = res.value || '<p><br></p>'; editor.dataset.welcome='0'; msg(T('mDocOpened')); })
        .catch(err=> msg(T('mOpenFail') + err.message));
    };
    rd.readAsArrayBuffer(f);
  } else if(name.endsWith('.hwpx')){
    rd.onload = async ()=>{
      try{
        editor.innerHTML = await importHwpx(rd.result);
        editor.dataset.welcome='0';
        msg(T('mDocOpened') + ' ' + T('mHwpxNote'));
      }catch(err){ msg(T('mOpenFail') + (err.message || err)); }
    };
    rd.readAsArrayBuffer(f);
  } else if(name.endsWith('.txt')){
    rd.onload = ()=>{
      const esc = s=> s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const html = rd.result.split(/\r?\n/).map(line=> line.trim()==='' ? '<p><br></p>' : '<p>'+esc(line)+'</p>').join('');
      editor.innerHTML = html || '<p><br></p>'; editor.dataset.welcome='0'; msg(T('mDocOpened'));
    };
    rd.readAsText(f);
  } else {  /* .html, .htm */

    rd.readAsText(f);
  }
  e.target.value='';
};

/* ═══════════════ 그림 모드 ═══════════════ */
const cv = $('cv'), ctx = cv.getContext('2d');
const cropCv = $('cropLayer'), cropCtx = cropCv.getContext('2d');
let layers = [];          // 아래→위 순서
let selId = null, nextId = 1, zoom = 1;
let bgTransparent = true, bgColor = '#FFFFFF';

/* 체커보드 패턴 */
const checker = (()=> {
  const c = document.createElement('canvas'); c.width = c.height = 20;
  const x = c.getContext('2d');
  x.fillStyle = '#E7E9ED'; x.fillRect(0,0,20,20);
  x.fillStyle = '#F7F8FA'; x.fillRect(0,0,10,10); x.fillRect(10,10,10,10);
  return ctx.createPattern(c, 'repeat');
})();

function sel(){ return layers.find(l=>l.id===selId) || null; }

function textBox(l){
  ctx.font = `${l.fontSize}px 'Segoe UI','Malgun Gothic',sans-serif`;
  const w = ctx.measureText(l.text).width;
  return {x:l.x, y:l.y, w, h:l.fontSize*1.25};
}
function box(l){ return l.type==='text' ? textBox(l) : {x:l.x, y:l.y, w:l.w, h:l.h}; }

function render(){
  ctx.clearRect(0,0,cv.width,cv.height);
  if(bgTransparent){ ctx.fillStyle = checker; ctx.fillRect(0,0,cv.width,cv.height); }
  else { ctx.fillStyle = bgColor; ctx.fillRect(0,0,cv.width,cv.height); }
  for(const l of layers){
    if(!l.visible) continue;
    ctx.globalAlpha = l.opacity;
    if(l.type==='image') ctx.drawImage(l.img, l.x, l.y, l.w, l.h);
    else {
      ctx.font = `${l.fontSize}px 'Segoe UI','Malgun Gothic',sans-serif`;
      ctx.fillStyle = l.color; ctx.textBaseline = 'top';
      ctx.fillText(l.text, l.x, l.y);
    }
    ctx.globalAlpha = 1;
  }
  const s = sel();
  if(s && s.visible){
    const b = box(s);
    ctx.strokeStyle = '#1F4E8C'; ctx.lineWidth = 1.5; ctx.setLineDash([6,4]);
    ctx.strokeRect(b.x-1, b.y-1, b.w+2, b.h+2); ctx.setLineDash([]);
    ctx.fillStyle = '#1F4E8C';
    ctx.fillRect(b.x+b.w-6, b.y+b.h-6, 12, 12); // 크기조절 핸들
  }
}

/* 레이어 패널 */
function renderPanel(){
  const list = $('layerList'); list.innerHTML = '';
  [...layers].reverse().forEach(l=>{
    const d = document.createElement('div');
    d.className = 'layer' + (l.id===selId ? ' sel' : '');
    const th = document.createElement('div'); th.className = 'thumb';
    if(l.type==='image'){
      const t = document.createElement('canvas'); t.width=34; t.height=26;
      const r = Math.min(34/l.img.width, 26/l.img.height);
      t.getContext('2d').drawImage(l.img, (34-l.img.width*r)/2, (26-l.img.height*r)/2, l.img.width*r, l.img.height*r);
      th.appendChild(t);
    } else th.textContent = '가';
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = l.name;
    nm.title = T('layerRename');
    nm.ondblclick = ev=>{ ev.stopPropagation(); const n = prompt(T('layerRenamePrompt'), l.name); if(n){ l.name = n; renderPanel(); } };
    const eye = document.createElement('button'); eye.className = 'eye';
    eye.textContent = l.visible ? '👁' : '–';
    eye.title = '표시 / 숨김';
    eye.onclick = ev=>{ ev.stopPropagation(); l.visible = !l.visible; render(); renderPanel(); };
    d.append(th, nm, eye);
    d.onclick = ()=>{ selId = l.id; render(); renderPanel(); syncCtrl(); };
    list.appendChild(d);
  });
  syncCtrl();
}
function syncCtrl(){
  const s = sel();
  $('opRange').disabled = !s;
  if(s){ $('opRange').value = Math.round(s.opacity*100); $('opVal').textContent = Math.round(s.opacity*100)+'%'; }
}

$('lyDown').onclick = ()=>{ const i = layers.findIndex(l=>l.id===selId); if(i>0){ [layers[i],layers[i-1]]=[layers[i-1],layers[i]]; render(); renderPanel(); } };

/* 레이어 추가 */
function addImageLayer(src, name){
  const img = new Image();
  img.onload = ()=>{
    let w = img.width, h = img.height;
    const max = Math.min(cv.width*0.8, cv.height*0.8);
    if(w>max || h>max){ const r = Math.min(max/w, max/h); w*=r; h*=r; }
    const l = {id:nextId++, type:'image', name:name||(T('imgLayer')+' '+nextId), img, x:(cv.width-w)/2, y:(cv.height-h)/2, w, h, opacity:1, visible:true};
    layers.push(l); selId = l.id; render(); renderPanel();
  };
  img.src = src;
}

/* 마우스 상호작용 (이동·크기조절) */
let drag = null;
function toCanvas(e){
  const r = cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/zoom, y:(e.clientY-r.top)/zoom};
}
cv.addEventListener('mousedown', e=>{
  const p = toCanvas(e);
  const s = sel();
  if(s){ // 크기조절 핸들 체크
    const b = box(s);
    if(Math.abs(p.x-(b.x+b.w))<=9 && Math.abs(p.y-(b.y+b.h))<=9){
      drag = {mode:'resize', l:s, sx:p.x, sy:p.y, ow:b.w, oh:b.h, ofs:s.fontSize};
      return;
    }
  }
  // 위에서부터 히트 테스트
  for(let i=layers.length-1;i>=0;i--){
    const l = layers[i]; if(!l.visible) continue;
    const b = box(l);
    if(p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h){
      selId = l.id;
      drag = {mode:'move', l, dx:p.x-l.x, dy:p.y-l.y};
      render(); renderPanel();
      return;
    }
  }
  selId = null; render(); renderPanel();
});
window.addEventListener('mousemove', e=>{
  if(!drag) return;
  const p = toCanvas(e);
  if(drag.mode==='move'){ drag.l.x = p.x-drag.dx; drag.l.y = p.y-drag.dy; }
  else {
    const ratio = Math.max(0.05, (drag.ow + (p.x-drag.sx)) / drag.ow);
    if(drag.l.type==='image'){ drag.l.w = drag.ow*ratio; drag.l.h = drag.oh*ratio; }
    else drag.l.fontSize = Math.max(8, drag.ofs*ratio);
  }
  render();
});
window.addEventListener('mouseup', ()=> drag = null);

/* ── 평면화 & 내보내기 ── */
function flatten(forceBg){
  const off = document.createElement('canvas');
  off.width = cv.width; off.height = cv.height;
  const x = off.getContext('2d');
  if(!bgTransparent || forceBg){ x.fillStyle = bgTransparent?'#FFFFFF':bgColor; x.fillRect(0,0,off.width,off.height); }
  for(const l of layers){
    if(!l.visible) continue;
    x.globalAlpha = l.opacity;
    if(l.type==='image') x.drawImage(l.img, l.x, l.y, l.w, l.h);
    else {
      x.font = `${l.fontSize}px 'Segoe UI','Malgun Gothic',sans-serif`;
      x.fillStyle = l.color; x.textBaseline = 'top';
      x.fillText(l.text, l.x, l.y);
    }
    x.globalAlpha = 1;
  }
  return off;
}

/* ICO: 정사각 리사이즈 후 PNG를 ICO 컨테이너에 포장 */
async function makeIco(size){
  const flat = flatten(false);
  const off = document.createElement('canvas'); off.width = off.height = size;
  const x = off.getContext('2d');
  const r = Math.min(size/flat.width, size/flat.height);
  x.drawImage(flat, (size-flat.width*r)/2, (size-flat.height*r)/2, flat.width*r, flat.height*r);
  const blob = await new Promise(res=> off.toBlob(res, 'image/png'));
  const png = new Uint8Array(await blob.arrayBuffer());
  const head = new Uint8Array(22);
  const dv = new DataView(head.buffer);
  dv.setUint16(2, 1, true);            // 타입: 아이콘
  dv.setUint16(4, 1, true);            // 이미지 1개
  head[6] = size>=256?0:size;          // 너비 (256=0)
  head[7] = size>=256?0:size;          // 높이
  dv.setUint16(10, 1, true);           // 색상 평면
  dv.setUint16(12, 32, true);          // 비트 수
  dv.setUint32(14, png.length, true);  // 데이터 크기
  dv.setUint32(18, 22, true);          // 데이터 시작 위치
  return new Blob([head, png], {type:'image/x-icon'});
}

/* GIF: gif.js (CDN) — 워커는 Blob URL로 우회 */
let gifReady = null;
function makeGif(){
  if(!gifReady){
    gifReady = new Promise((res, rej)=>{
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js';
      s.onload = async ()=>{
        try{
          const t = await (await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js')).text();
          res(URL.createObjectURL(new Blob([t], {type:'application/javascript'})));
        } catch(e){ gifReady=null; rej(new Error(T('mGifFail'))); }
      };
      s.onerror = ()=>{ gifReady=null; rej(new Error(T('mGifFail'))); };
      document.head.appendChild(s);
    });
  }
  return gifReady.then(workerURL => new Promise((res, rej)=>{
    const flat = flatten(true);
    const g = new GIF({workers:1, quality:8, width:flat.width, height:flat.height, workerScript:workerURL});
    g.addFrame(flat, {delay:200});
    g.on('finished', b=> res(b));
    g.on('abort', ()=> rej(new Error('중단됨')));
    g.render();
  }));
}

/* ═══════════════ 표(스프레드시트) 모드 ═══════════════ */
let hf = null;                 // HyperFormula 인스턴스
let shRows = 200, shCols = 40; // 격자 크기 (스크롤하면 자동으로 늘어남)
const SH_ROWS_INIT = 200, SH_COLS_INIT = 40;
const SH_GROW_ROWS = 100, SH_GROW_COLS = 10;   // 끝에 닿으면 한 번에 늘리는 양
let shCellEls = null;          // 'r,c' → td 캐시 (querySelector 반복 방지)
let shLive = new Set();        // 값·서식이 있는 칸 목록 (빈 격자를 매번 훑지 않기 위함)
let shHeadCols = null, shHeadRows = null;   // 머리글 th 캐시
let shData = null;             // 원본 입력값(문자열/수식) 2차원 배열
let shStyle = null;            // 셀 스타일 { 'r,c': {bold,italic,under,color,bg,align,comma,pct,dec} }
let shColW = [];               // 열 너비(px)
let selR = 0, selC = 0;        // 활성 셀
let ancR = 0, ancC = 0;        // 선택 기준점(앵커) — 범위 = 앵커~활성
let sheetReady = false;
let shClip = null;             // 내부 클립보드 {mode:'copy'|'cut', r1,c1,r2,c2, tsv, styles}
let shUndo = [], shRedo = [];  // 실행 취소 스택
let shMerges = [];             // 병합 [{r,c,rs,cs}]
const SH_DEFAULT_W = 92;

const colName = i => { let s=''; i++; while(i>0){ i--; s=String.fromCharCode(65+i%26)+s; i=Math.floor(i/26); } return s; };
const colIdx = s => { let n=0; for(const ch of s) n = n*26 + (ch.charCodeAt(0)-64); return n-1; };
const sheetActive = ()=> $('modeSheet').classList.contains('active');
const cellKey = (r,c)=> r+','+c;

function selRange(){
  return { r1:Math.min(ancR,selR), c1:Math.min(ancC,selC), r2:Math.max(ancR,selR), c2:Math.max(ancC,selC) };
}
function refOf(r,c){ return colName(c)+(r+1); }
function rangeRef(r1,c1,r2,c2){ return (r1===r2&&c1===c2) ? refOf(r1,c1) : refOf(r1,c1)+':'+refOf(r2,c2); }

function ensureSheet(){
  if(sheetReady) return;
  if(typeof HyperFormula === 'undefined'){ msg(T('mSheetNoMod')); return; }
  shRows = SH_ROWS_INIT; shCols = SH_COLS_INIT;
  shData = Array.from({length:shRows}, ()=> Array(shCols).fill(''));
  shStyle = {};
  shColW = Array(shCols).fill(SH_DEFAULT_W);
  buildHF();
  renderSheet();
  sheetReady = true;
}
function buildHF(){
  if(hf){ try{ hf.destroy(); }catch(e){} }
  /* 빈 칸은 null 로 넘김 — 빈 문자열을 넣으면 계산 엔진이 수만 개의 값을 떠안아 느려집니다 */
  const arr = shData.map(row => row.map(v => (v==='' || v==null) ? null : v));
  hf = HyperFormula.buildFromArray(arr, { licenseKey:'gpl-v3' });
}
/* 계산된 원시값 (수식이면 결과, 아니면 입력값) */
function cellValue(r,c){
  const raw = shData[r][c];
  if(raw === '' || raw == null) return '';
  if(typeof raw === 'string' && raw[0] === '='){
    try{
      const v = hf.getCellValue({sheet:0, row:r, col:c});
      if(v && typeof v==='object'){ return (typeof v.value==='string' && v.value[0]==='#') ? v.value : '#ERR'; }
      return v==null ? '' : v;
    }catch(e){ return '#ERR'; }
  }
  return raw;
}
function toNum(v){
  if(typeof v==='number') return v;
  const n = parseFloat(String(v).replace(/,/g,''));
  return (!isNaN(n) && String(v).trim()!=='') ? n : null;
}
/* 숫자 표시 형식 적용 */
function fmtNum(n, st){
  let x = st.pct ? n*100 : n;
  let s;
  if(st.dec!=null){
    s = st.comma ? x.toLocaleString('en-US',{minimumFractionDigits:st.dec, maximumFractionDigits:st.dec})
                 : x.toFixed(st.dec);
  } else {
    s = st.comma ? x.toLocaleString('en-US',{maximumFractionDigits:10}) : String(x);
  }
  return st.pct ? s+'%' : s;
}
/* 화면 표시 문자열 */
function cellDisplay(r,c){
  const v = cellValue(r,c);
  if(v==='' || v==null) return '';
  if(v==='#ERR') return '#ERR';
  const st = shStyle[cellKey(r,c)] || {};
  const n = toNum(v);
  if(n!=null && (st.comma || st.pct || st.dec!=null)) return fmtNum(n, st);
  return String(v);
}
function cellStyleStr(r,c){
  const st = shStyle[cellKey(r,c)] || {};
  const disp = cellDisplay(r,c);
  const numeric = toNum(disp.replace(/%$/,''))!=null && disp!=='';
  return [
    st.bold?'font-weight:700':'',
    st.italic?'font-style:italic':'',
    st.under?'text-decoration:underline':'',
    st.color?`color:${st.color}`:'',
    st.bg?`background:${st.bg}`:'',
    `text-align:${st.align || (numeric?'right':'left')}`
  ].filter(Boolean).join(';');
}
function renderSheet(){
  const tb = $('sheetTable');
  let html = '<colgroup><col style="width:44px">';
  for(let c=0;c<shCols;c++) html += `<col style="width:${shColW[c]||SH_DEFAULT_W}px">`;
  html += '</colgroup><thead><tr><th id="shCorner"></th>';
  for(let c=0;c<shCols;c++) html += `<th data-hc="${c}">${colName(c)}</th>`;
  html += '</tr></thead><tbody>';
  const covered = {};
  const spanAt = {};
  for(const m of shMerges){
    spanAt[m.r+','+m.c] = m;
    for(let r=m.r;r<m.r+m.rs;r++) for(let c=m.c;c<m.c+m.cs;c++)
      if(r!==m.r || c!==m.c) covered[r+','+c] = true;
  }
  for(let r=0;r<shRows;r++){
    html += `<tr><th data-hr="${r}">${r+1}</th>`;
    for(let c=0;c<shCols;c++){
      if(covered[r+','+c]) continue;
      const sp = spanAt[r+','+c];
      const spanAttr = sp ? ` rowspan="${sp.rs}" colspan="${sp.cs}"` : '';
      html += `<td data-r="${r}" data-c="${c}"${spanAttr} style="${cellStyleStr(r,c)}">${escHtml(cellDisplay(r,c))}</td>`;
    }
    html += '</tr>';
  }
  html += '</tbody>';
  tb.innerHTML = html;
  /* 셀 요소 캐시 — 이후 조회는 querySelector 없이 즉시 */
  rebuildLive();
  shCellEls = {}; shHeadCols = {}; shHeadRows = {}; shPainted = null;
  const tds = tb.getElementsByTagName('td');
  for(let i=0;i<tds.length;i++){
    const td = tds[i];
    shCellEls[td.dataset.r + ',' + td.dataset.c] = td;
  }
  const ths = tb.getElementsByTagName('th');
  for(let i=0;i<ths.length;i++){
    const th = ths[i];
    if(th.dataset.hc != null) shHeadCols[th.dataset.hc] = th;
    else if(th.dataset.hr != null) shHeadRows[th.dataset.hr] = th;
  }
  paintSel();
}
/* 좌표 → td (병합으로 덮인 칸은 병합 앵커 셀을 돌려줌) */
function cellEl(r,c){
  if(!shCellEls) return null;
  let td = shCellEls[r+','+c];
  if(!td){ const mg = mergeAt(r,c); if(mg) td = shCellEls[mg.r+','+mg.c]; }
  return td || null;
}
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── 선택 표시 + 상태 통계 ── */
let shEditFinish = null;   // 편집 중인 셀의 마무리 함수 (다른 곳을 클릭할 때 확정용)
/* 편집 중이던 내용을 확정합니다 — 선택 위치는 바꾸지 않습니다.
   엑셀처럼 "입력하다가 옆 칸을 클릭하면 입력은 저장되고 그 칸으로 바로 이동" 하도록 하는 핵심입니다. */
function commitPendingEdit(){
  if(shEditFinish){ shEditFinish(true, 0, 0, true); return true; }
  const fi = $('formulaInput');
  if(document.activeElement === fi){
    const v = fi.value;
    if(String(shData[selR][selC] ?? '') !== v){ pushUndo(); setCellValue(selR, selC, v); }
    fi.blur();
    return true;
  }
  return false;
}
let shPainted = null;   // 직전에 칠한 선택 범위 (전체 스캔 대신 이것만 지움)
function clearPainted(){
  const tb = $('sheetTable');
  if(!shPainted){ return; }
  const {r1,c1,r2,c2} = shPainted;
  for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){
    const td = shCellEls && shCellEls[r+','+c];
    if(td) td.classList.remove('sel','rsel');
  }
  for(let c=c1;c<=c2;c++){ const th=shHeadCols && shHeadCols[c]; if(th) th.classList.remove('hsel'); }
  for(let r=r1;r<=r2;r++){ const th=shHeadRows && shHeadRows[r]; if(th) th.classList.remove('hsel'); }
  shPainted = null;
}
function paintSel(){
  const tb = $('sheetTable');
  clearPainted();
  const {r1,c1,r2,c2} = selRange();
  for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){
    const td = shCellEls && shCellEls[r+','+c];
    if(td) td.classList.add('rsel');
  }
  const act = cellEl(selR,selC);
  if(act) act.classList.add('sel');
  for(let c=c1;c<=c2;c++){ const th=shHeadCols && shHeadCols[c]; if(th) th.classList.add('hsel'); }
  for(let r=r1;r<=r2;r++){ const th=shHeadRows && shHeadRows[r]; if(th) th.classList.add('hsel'); }
  shPainted = {r1,c1,r2,c2};
  /* 이름 상자 / 수식 입력줄 */
  $('cellRef').textContent = rangeRef(r1,c1,r2,c2);
  if(document.activeElement !== $('formulaInput')){
    const raw = shData[selR][selC];
    $('formulaInput').value = (raw==null) ? '' : String(raw);
  }
  /* 채우기 핸들 */
  positionFillHandle();
  /* 선택 통계 (합계·평균·개수) */
  const stat = $('shStats');
  if(r1===r2 && c1===c2){ stat.textContent=''; }
  else{
    let sum=0, nCnt=0, cnt=0;
    const cells = (r2-r1+1)*(c2-c1+1);
    if(cells > 200000){ stat.textContent=''; return; }   /* 너무 큰 선택은 통계 생략 */
    for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){
      const v = cellValue(r,c);
      if(v!=='' && v!=null && v!=='#ERR'){ cnt++; const n=toNum(v); if(n!=null){ sum+=n; nCnt++; } }
    }
    if(nCnt>0){
      const f = x=> Math.round(x*1e6)/1e6;
      stat.textContent = `${T('calcSum')}: ${f(sum).toLocaleString('en-US')}   ${T('calcAvg')}: ${f(sum/nCnt).toLocaleString('en-US')}   ${T('calcCount')}: ${cnt}`;
    } else stat.textContent = cnt>0 ? `${T('calcCount')}: ${cnt}` : '';
  }
}
function positionFillHandle(){
  const fh = $('shFillHandle');
  const {r2,c2} = selRange();
  const td = cellEl(r2,c2);
  if(!td){ fh.style.display='none'; return; }
  fh.style.display='block';
  fh.style.left = (td.offsetLeft + td.offsetWidth - 4) + 'px';
  fh.style.top = (td.offsetTop + td.offsetHeight - 4) + 'px';
}
function mergeAt(r,c){
  for(const m of shMerges)
    if(r>=m.r && r<m.r+m.rs && c>=m.c && c<m.c+m.cs) return m;
  return null;
}
function setSel(r,c,extend){
  r = Math.max(0, Math.min(shRows-1, r));
  c = Math.max(0, Math.min(shCols-1, c));
  const mg = mergeAt(r,c);
  if(mg){ r=mg.r; c=mg.c; }
  selR=r; selC=c;
  if(!extend){ ancR=r; ancC=c; }
  const td = cellEl(r,c);
  if(td && td.scrollIntoView) td.scrollIntoView({block:'nearest', inline:'nearest'});
  paintSel();
}
function selectCell(r,c){ setSel(r,c,false); }  /* 하위 호환 */

/* ── 실행 취소/재실행 ── */
function snapshot(){
  return { data: shData.map(r=>r.slice()), style: JSON.parse(JSON.stringify(shStyle)),
           rows: shRows, cols: shCols, colW: shColW.slice(),
           merges: shMerges.map(m=>({...m})) };
}
function pushUndo(){ shUndo.push(snapshot()); if(shUndo.length>40) shUndo.shift(); shRedo.length=0; }
function restore(s){
  shData=s.data.map(r=>r.slice()); shStyle=JSON.parse(JSON.stringify(s.style));
  shRows=s.rows; shCols=s.cols; shColW=s.colW.slice();
  shMerges = (s.merges||[]).map(m=>({...m}));
  buildHF(); rebuildLive(); 
  selR=Math.min(selR,shRows-1); selC=Math.min(selC,shCols-1);
  ancR=Math.min(ancR,shRows-1); ancC=Math.min(ancC,shCols-1);
  renderSheet();
}
function shDoUndo(){ if(!shUndo.length){ msg(T('mNoUndo')); return; } shRedo.push(snapshot()); restore(shUndo.pop()); }
function shDoRedo(){ if(!shRedo.length){ msg(T('mNoRedo')); return; } shUndo.push(snapshot()); restore(shRedo.pop()); }
$('shUndoBtn').onclick = shDoUndo;
$('shRedoBtn').onclick = shDoRedo;

/* ── 셀 값 설정 ── */
function markLive(r,c){ shLive.add(r+','+c); }
let shBatch = false;   /* 대량 입력 중에는 셀마다 재계산하지 않고 마지막에 한 번만 */
function beginBatch(){ shBatch = true; }
function endBatch(){ shBatch = false; buildHF(); }
function setCellRaw(r,c,val){
  shData[r][c] = val;
  markLive(r,c);
  if(shBatch) return;
  try{ hf.setCellContents({sheet:0, row:r, col:c}, [[val===''?null:val]]); }catch(e){ buildHF(); }
}
function setCellValue(r,c,val){  /* 단일 셀 + 화면 갱신 (undo는 호출부에서) */
  setCellRaw(r,c,val);
  recalcRender();
}
/* 화면만 다시 그림(수식 결과 갱신) — 선택/스타일 유지 */
function recalcRender(){
  if(!shCellEls){ renderSheet(); return; }
  /* 값·서식이 있는 칸만 갱신 — 빈 격자는 건드리지 않아 큰 표에서도 빠릅니다 */
  for(const key of shLive){
    const td = shCellEls[key];
    if(!td) continue;
    const p = key.indexOf(',');
    const r = +key.slice(0,p), c = +key.slice(p+1);
    if(r>=shRows || c>=shCols) continue;
    td.textContent = cellDisplay(r,c);
    td.style.cssText = cellStyleStr(r,c);
  }
  paintSel();
}
/* 활성 목록 다시 만들기 (표 전체 교체·정렬·행열 이동 후) */
function rebuildLive(){
  shLive = new Set();
  for(let r=0;r<shRows;r++) for(let c=0;c<shCols;c++)
    if(shData[r][c]!=='' && shData[r][c]!=null) shLive.add(r+','+c);
  for(const k in shStyle) shLive.add(k);
}
/* 격자 확장 */
function growTo(rows, cols){
  let changed=false;
  if(rows>shRows){ for(let i=shRows;i<rows;i++) shData.push(Array(shCols).fill('')); shRows=rows; changed=true; }
  if(cols>shCols){ shData.forEach(r=>{ while(r.length<cols) r.push(''); }); for(let i=shColW.length;i<cols;i++) shColW.push(SH_DEFAULT_W); shCols=cols; changed=true; }
  if(changed) buildHF();
  return changed;
}

/* ── 수식 참조 이동 (채우기/붙여넣기용) ── */
function shiftFormula(f, dr, dc){
  return f.replace(/(\$?)([A-Z]{1,3})(\$?)(\d+)/g, (m, d1, col, d2, row, off, str)=>{
    const prev = str[off-1];
    if(prev && /[A-Za-z0-9_.$]/.test(prev)) return m;          /* 이름 일부 */
    if(str[off+m.length] === '(') return m;                     /* 함수 이름 (예: LOG10) */
    let c = colIdx(col), r = (+row)-1;
    if(!d1) c += dc;
    if(!d2) r += dr;
    if(c<0 || r<0) return '#REF!';
    return d1 + colName(c) + d2 + (r+1);
  });
}

/* ── 마우스 선택 (드래그·Shift·머리글) ── */
let shDragging=false, shFillDragging=false, shFillTarget=null, shRefDrag=null;
const sheetTb = $('sheetTable');

/* 수식 편집 중 셀 클릭 → 참조 삽입 */
function refEditTarget(){
  const fi = $('formulaInput');
  if(document.activeElement===fi && fi.value.startsWith('=')) return {kind:'bar', el:fi};
  const ed = sheetTb.querySelector('td.editing');
  if(ed && ed.textContent.startsWith('=')) return {kind:'cell', el:ed};
  return null;
}
function refEditText(t){ return t.kind==='bar' ? t.el.value : t.el.textContent; }
function refEditSet(t, s){
  if(t.kind==='bar'){ t.el.value=s; }
  else{
    t.el.textContent=s;
    const rg=document.createRange(); rg.selectNodeContents(t.el); rg.collapse(false);
    const sl=window.getSelection(); sl.removeAllRanges(); sl.addRange(rg);
  }
}
function tryInsertRef(t, r, c){
  let s = refEditText(t);
  const m = s.match(/(\$?[A-Z]{1,3}\$?\d+(:\$?[A-Z]{1,3}\$?\d+)?)$/);
  if(m) s = s.slice(0, s.length-m[1].length);
  else if(!/[=+\-*/^&%(,:<>]$/.test(s)) return false;
  refEditSet(t, s + refOf(r,c));
  shRefDrag = { t, base:s, r, c };
  return true;
}

sheetTb.addEventListener('mousedown', e=>{
  const td = e.target.closest('td');
  if(td){
    const r=+td.dataset.r, c=+td.dataset.c;
    if(td.classList.contains('editing')) return;   /* 편집 중인 칸 안에서의 클릭은 그대로 */
    /* 수식(=)을 입력하는 중이면 클릭한 칸을 참조로 넣습니다 */
    const t = refEditTarget();
    if(t && tryInsertRef(t, r, c)){ e.preventDefault(); return; }
    /* 그 밖에는 입력을 확정하고 클릭한 칸으로 바로 이동 (엑셀과 동일) */
    commitPendingEdit();
    shDragging = true;
    setSel(r, c, e.shiftKey);
    e.preventDefault();
    $('sheetScroll').focus();
    return;
  }
  const th = e.target.closest('th');
  if(th){
    commitPendingEdit();
    if(th.dataset.hc!=null){  /* 열 머리글: 크기조절 or 열 선택 */
      const rect = th.getBoundingClientRect();
      if(rect.right - e.clientX < 6){ startColResize(+th.dataset.hc, e); e.preventDefault(); return; }
      const c=+th.dataset.hc;
      if(e.shiftKey){ selC=c; selR=shRows-1; ancR=0; }
      else{ ancR=0; ancC=c; selR=shRows-1; selC=c; }
      paintSel(); e.preventDefault(); $('sheetScroll').focus();
    } else if(th.dataset.hr!=null){  /* 행 머리글 */
      const r=+th.dataset.hr;
      if(e.shiftKey){ selR=r; selC=shCols-1; ancC=0; }
      else{ ancR=r; ancC=0; selR=r; selC=shCols-1; }
      paintSel(); e.preventDefault(); $('sheetScroll').focus();
    } else { /* 좌상단 모서리: 전체 선택 */
      ancR=0; ancC=0; selR=shRows-1; selC=shCols-1; paintSel(); e.preventDefault(); $('sheetScroll').focus();
    }
  }
});
sheetTb.addEventListener('mouseover', e=>{
  const td = e.target.closest('td'); if(!td) return;
  const r=+td.dataset.r, c=+td.dataset.c;
  if(shRefDrag){
    const {t, base, r:ar, c:ac} = shRefDrag;
    refEditSet(t, base + rangeRef(Math.min(ar,r),Math.min(ac,c),Math.max(ar,r),Math.max(ac,c)));
    return;
  }
  if(shFillDragging){ updateFillPreview(r,c); return; }
  if(shDragging){ setSel(r, c, true); }
});
document.addEventListener('mouseup', ()=>{
  shDragging=false; shRefDrag=null;
  if(shFillDragging){ shFillDragging=false; applyFillDrag(); }
});
sheetTb.addEventListener('dblclick', e=>{
  const td = e.target.closest('td'); if(!td) return;
  startEdit(+td.dataset.r, +td.dataset.c);
});
/* 열 머리글 위 커서 표시 */
sheetTb.addEventListener('mousemove', e=>{
  const th = e.target.closest('th');
  if(th && th.dataset.hc!=null){
    const rect = th.getBoundingClientRect();
    th.style.cursor = (rect.right - e.clientX < 6) ? 'col-resize' : '';
  }
});
/* 열 너비 조절 */
function startColResize(c, ev){
  const startX = ev.clientX, startW = shColW[c]||SH_DEFAULT_W;
  const col = sheetTb.querySelectorAll('colgroup col')[c+1];
  const move = e=>{ const w = Math.max(36, startW + e.clientX - startX); shColW[c]=w; if(col) col.style.width=w+'px'; positionFillHandle(); };
  const up = ()=>{ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); };
  document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
}

/* ── 채우기 핸들 (자동 채우기) ── */
$('shFillHandle').addEventListener('mousedown', e=>{
  e.preventDefault(); e.stopPropagation();
  commitPendingEdit();
  shFillDragging = true; shFillTarget = null;
});
function updateFillPreview(r,c){
  sheetTb.querySelectorAll('td.fsel').forEach(td=>td.classList.remove('fsel'));
  const {r1,c1,r2,c2} = selRange();
  let tgt=null;
  if(r>r2 && (r-r2) >= Math.max(0,c-c2)) tgt={dir:'down', r1:r2+1, c1, r2:r, c2};
  else if(c>c2) tgt={dir:'right', r1, c1:c2+1, r2, c2:c};
  shFillTarget = tgt;
  if(!tgt) return;
  for(let rr=tgt.r1; rr<=tgt.r2; rr++) for(let cc=tgt.c1; cc<=tgt.c2; cc++){
    const td=cellEl(rr,cc); if(td) td.classList.add('fsel');
  }
}
function seriesNext(vals, k){
  /* vals: 원본 숫자 배열(2개 이상, 등차) → k번째 다음 항 */
  const step = vals.length>1 ? (vals[vals.length-1]-vals[0])/(vals.length-1) : 0;
  return vals[vals.length-1] + step*(k+1);
}
function fillCells(srcR1,srcC1,srcR2,srcC2, dir, count){
  /* dir 'down': 아래로 count행 채움 / 'right': 오른쪽으로 count열 */
  if(dir==='down'){
    for(let c=srcC1;c<=srcC2;c++){
      const vals=[]; let allNum=true;
      for(let r=srcR1;r<=srcR2;r++){ const raw=shData[r][c]; const n=toNum(raw); if(typeof raw==='string'&&raw[0]==='=') { allNum=false; break;} if(n==null&&raw!==''&&raw!=null){allNum=false;} vals.push(n); }
      const numeric = allNum && vals.length>1 && vals.every(v=>v!=null);
      for(let k=0;k<count;k++){
        const srcR = srcR1 + (k % (srcR2-srcR1+1));
        const tgtR = srcR2+1+k;
        const raw = shData[srcR][c];
        let out;
        if(typeof raw==='string' && raw[0]==='=') out = shiftFormula(raw, tgtR-srcR, 0);
        else if(numeric) out = String(seriesNext(vals, k));
        else out = raw;
        setCellRaw(tgtR, c, out);
        if(shStyle[cellKey(srcR,c)]) shStyle[cellKey(tgtR,c)] = {...shStyle[cellKey(srcR,c)]};
      }
    }
  } else {
    for(let r=srcR1;r<=srcR2;r++){
      const vals=[]; let allNum=true;
      for(let c=srcC1;c<=srcC2;c++){ const raw=shData[r][c]; const n=toNum(raw); if(typeof raw==='string'&&raw[0]==='='){allNum=false;break;} if(n==null&&raw!==''&&raw!=null){allNum=false;} vals.push(n); }
      const numeric = allNum && vals.length>1 && vals.every(v=>v!=null);
      for(let k=0;k<count;k++){
        const srcC = srcC1 + (k % (srcC2-srcC1+1));
        const tgtC = srcC2+1+k;
        const raw = shData[r][srcC];
        let out;
        if(typeof raw==='string' && raw[0]==='=') out = shiftFormula(raw, 0, tgtC-srcC);
        else if(numeric) out = String(seriesNext(vals, k));
        else out = raw;
        setCellRaw(r, tgtC, out);
        if(shStyle[cellKey(r,srcC)]) shStyle[cellKey(r,tgtC)] = {...shStyle[cellKey(r,srcC)]};
      }
    }
  }
}
function applyFillDrag(){
  sheetTb.querySelectorAll('td.fsel').forEach(td=>td.classList.remove('fsel'));
  const t = shFillTarget; shFillTarget=null;
  if(!t) return;
  const {r1,c1,r2,c2} = selRange();
  pushUndo();
  beginBatch();
  if(t.dir==='down') fillCells(r1,c1,r2,c2,'down', t.r2-r2);
  else fillCells(r1,c1,r2,c2,'right', t.c2-c2);
  endBatch();
  ancR=r1; ancC=c1; selR=t.r2; selC=t.c2;
  renderSheet();
}
/* Ctrl+D / Ctrl+R: 선택 범위 안에서 첫 행/열을 아래·오른쪽으로 채움 */
function fillDownSel(){
  const {r1,c1,r2,c2} = selRange(); if(r2===r1) return;
  pushUndo(); beginBatch(); fillCells(r1,c1,r1,c2,'down', r2-r1); endBatch(); renderSheet();
}
function fillRightSel(){
  const {r1,c1,r2,c2} = selRange(); if(c2===c1) return;
  pushUndo(); beginBatch(); fillCells(r1,c1,r2,c1,'right', c2-c1); endBatch(); renderSheet();
}

/* ── 편집 ── */
function startEdit(r,c,initChar){
  commitPendingEdit();     /* 다른 칸을 편집 중이었다면 먼저 확정 */
  setSel(r,c,false);
  const td = cellEl(r,c);
  if(!td) return;
  td.classList.add('editing');
  const raw = shData[r][c]; const orig = (raw==null)?'':String(raw);
  td.textContent = (initChar!=null) ? initChar : orig;
  td.style.textAlign='left';
  td.contentEditable = 'true'; td.focus();
  const range=document.createRange(); range.selectNodeContents(td); range.collapse(false);
  const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  const finish = (commit, mr, mc, noMove)=>{
    if(shEditFinish !== finish) return;      /* 이미 마무리됨 */
    shEditFinish = null;
    td.contentEditable='false'; td.classList.remove('editing');
    td.onblur=td.onkeydown=null;
    if(commit){
      const v = td.textContent;
      if(v !== orig){ pushUndo(); setCellValue(r,c,v); }
      else recalcRender();
    } else recalcRender();
    /* noMove: 다른 셀을 마우스로 클릭한 경우 — 입력만 확정하고 선택은 건드리지 않음 */
    if(noMove) return;
    setSel(Math.max(0,Math.min(shRows-1,r+mr)), Math.max(0,Math.min(shCols-1,c+mc)), false);
    $('sheetScroll').focus();
  };
  shEditFinish = finish;
  td.onkeydown = ev=>{
    if(ev.key==='Enter'){ ev.preventDefault(); finish(true, ev.shiftKey?-1:1, 0); }
    else if(ev.key==='Escape'){ ev.preventDefault(); finish(false,0,0); }
    else if(ev.key==='Tab'){ ev.preventDefault(); finish(true, 0, ev.shiftKey?-1:1); }
  };
  td.onblur = ()=>{ if(shRefDrag) return; finish(true,0,0); };
}

/* ── 새로 늘어난 행만 DOM 에 덧붙임 (전체를 다시 그리지 않아 빠릅니다) ── */
function appendRowsDOM(fromR){
  const tb = $('sheetTable');
  const tbody = tb.tBodies[0];
  if(!tbody || !shCellEls) { renderSheet(); return; }
  let html = '';
  for(let r=fromR;r<shRows;r++){
    html += `<tr><th data-hr="${r}">${r+1}</th>`;
    for(let c=0;c<shCols;c++) html += `<td data-r="${r}" data-c="${c}"></td>`;
    html += '</tr>';
  }
  tbody.insertAdjacentHTML('beforeend', html);
  /* 새 행만 캐시에 등록 */
  for(let r=fromR;r<shRows;r++){
    const tr = tbody.rows[r];
    if(!tr) continue;
    shHeadRows[r] = tr.cells[0];
    for(let c=0;c<shCols;c++) shCellEls[r+','+c] = tr.cells[c+1];
  }
}
/* ── 스크롤이 끝에 닿으면 격자를 자동으로 늘림 (엑셀처럼 계속 이어짐) ── */
const SH_MAX_ROWS = 5000, SH_MAX_COLS = 120;   /* 브라우저가 감당할 수 있는 상한 */
let shGrowBusy = false;
$('sheetScroll').addEventListener('scroll', ()=>{
  if(!sheetReady || shGrowBusy) return;
  const el = $('sheetScroll');
  const nearBottom = el.scrollTop + el.clientHeight > el.scrollHeight - 400;
  const nearRight  = el.scrollLeft + el.clientWidth  > el.scrollWidth  - 400;
  if(!nearBottom && !nearRight) return;
  shGrowBusy = true;
  try{
    if(nearBottom && shRows < SH_MAX_ROWS){
      const from = shRows;
      const add = Math.min(SH_GROW_ROWS, SH_MAX_ROWS - shRows);
      for(let i=0;i<add;i++) shData.push(Array(shCols).fill(''));
      shRows += add;
      appendRowsDOM(from);        /* 새 행만 추가 — 전체 재렌더 없음 */
    }
    if(nearRight && shCols < SH_MAX_COLS){
      const st = el.scrollTop, sl = el.scrollLeft;
      const add = Math.min(SH_GROW_COLS, SH_MAX_COLS - shCols);
      shData.forEach(r=>{ for(let i=0;i<add;i++) r.push(''); });
      for(let i=0;i<add;i++) shColW.push(SH_DEFAULT_W);
      shCols += add;
      renderSheet();              /* 열 추가는 전체 구조가 바뀌므로 재렌더 */
      el.scrollTop = st; el.scrollLeft = sl;
    }
  } finally { shGrowBusy = false; }
});

/* ── Ctrl+화살표: 데이터 끝으로 이동 ── */
function jumpEdge(dr,dc){
  const has = (r,c)=> r>=0&&c>=0&&r<shRows&&c<shCols && shData[r][c]!=='' && shData[r][c]!=null;
  let r=selR, c=selC;
  if(has(r,c) && has(r+dr,c+dc)){ while(has(r+dr,c+dc)){ r+=dr; c+=dc; } }
  else{
    r+=dr; c+=dc;
    while(r>=0&&c>=0&&r<shRows&&c<shCols && !has(r,c)){ r+=dr; c+=dc; }
    if(r<0||c<0||r>=shRows||c>=shCols){ r=Math.max(0,Math.min(shRows-1, dr>0?shRows-1:(dr<0?0:selR))); c=Math.max(0,Math.min(shCols-1, dc>0?shCols-1:(dc<0?0:selC))); }
  }
  return [r,c];
}

/* ── 키보드 ── */
$('sheetScroll').tabIndex = 0;
$('sheetScroll').addEventListener('keydown', e=>{
  if(sheetTb.querySelector('td.editing')) return;
  const ctrl = e.ctrlKey || e.metaKey;
  const mv = (dr,dc)=>{
    e.preventDefault();
    if(ctrl){ const [r,c]=jumpEdge(dr,dc); setSel(r,c,e.shiftKey); return; }
    const mg = mergeAt(selR,selC);
    let r=selR, c=selC;
    if(mg){ if(dr>0) r=mg.r+mg.rs-1; if(dc>0) c=mg.c+mg.cs-1; }
    setSel(r+dr, c+dc, e.shiftKey);
  };
  if(e.key==='ArrowUp') mv(-1,0);
  else if(e.key==='ArrowDown') mv(1,0);
  else if(e.key==='ArrowLeft') mv(0,-1);
  else if(e.key==='ArrowRight') mv(0,1);
  else if(e.key==='Enter'){ e.preventDefault(); setSel(selR+(e.shiftKey?-1:1), selC, false); }
  else if(e.key==='Tab'){ e.preventDefault(); setSel(selR, selC+(e.shiftKey?-1:1), false); }
  else if(e.key==='Home'){ e.preventDefault(); ctrl ? setSel(0,0,e.shiftKey) : setSel(selR,0,e.shiftKey); }
  else if(e.key==='End' && ctrl){ e.preventDefault(); let mr=0,mc=0; for(let r=0;r<shRows;r++)for(let c=0;c<shCols;c++) if(shData[r][c]!==''&&shData[r][c]!=null){mr=Math.max(mr,r);mc=Math.max(mc,c);} setSel(mr,mc,e.shiftKey); }
  else if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); clearRange(); }
  else if(e.key==='F2'){ e.preventDefault(); startEdit(selR,selC); }
  else if(ctrl && (e.key==='z'||e.key==='Z')){ e.preventDefault(); e.shiftKey?shDoRedo():shDoUndo(); }
  else if(ctrl && (e.key==='y'||e.key==='Y')){ e.preventDefault(); shDoRedo(); }
  else if(ctrl && (e.key==='a'||e.key==='A')){ e.preventDefault(); ancR=0;ancC=0;selR=shRows-1;selC=shCols-1;paintSel(); }
  else if(ctrl && (e.key==='d'||e.key==='D')){ e.preventDefault(); fillDownSel(); }
  else if(ctrl && (e.key==='r'||e.key==='R')){ e.preventDefault(); fillRightSel(); }
  else if(ctrl && (e.key==='f'||e.key==='F')){ e.preventDefault(); openFind(false); }
  else if(ctrl && (e.key==='h'||e.key==='H')){ e.preventDefault(); openFind(true); }
  else if(ctrl && (e.key==='b'||e.key==='B')){ e.preventDefault(); applyStyle('bold'); }
  else if(ctrl && (e.key==='i'||e.key==='I')){ e.preventDefault(); applyStyle('italic'); }
  else if(ctrl && (e.key==='u'||e.key==='U')){ e.preventDefault(); applyStyle('under'); }
  else if(!ctrl && e.key.length===1){ e.preventDefault(); startEdit(selR,selC,e.key); }
});
function clearRange(){
  const {r1,c1,r2,c2} = selRange();
  pushUndo();
  const many = (r2-r1+1)*(c2-c1+1) > 50;
  if(many) beginBatch();
  for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++) setCellRaw(r,c,'');
  if(many){ endBatch(); renderSheet(); } else recalcRender();
}

/* ── 복사/잘라내기/붙여넣기 (엑셀과 호환: 탭 구분 텍스트) ── */
function rangeTSV(r1,c1,r2,c2){
  const rows=[];
  for(let r=r1;r<=r2;r++){
    const row=[];
    for(let c=c1;c<=c2;c++){ const v=cellValue(r,c); row.push(v==null?'':String(v)); }
    rows.push(row.join('\t'));
  }
  return rows.join('\n');
}
function doCopy(e, cut){
  const {r1,c1,r2,c2} = selRange();
  const tsv = rangeTSV(r1,c1,r2,c2);
  const styles={};
  for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){ const st=shStyle[cellKey(r,c)]; if(st) styles[(r-r1)+','+(c-c1)]={...st}; }
  shClip = { mode: cut?'cut':'copy', r1,c1,r2,c2, tsv, styles };
  if(e && e.clipboardData){ e.clipboardData.setData('text/plain', tsv); e.preventDefault(); }
  else if(navigator.clipboard) navigator.clipboard.writeText(tsv).catch(()=>{});
  msg(cut?T('mCut'):T('mCopied'));
}
function doPasteText(text){
  const rows = text.replace(/\r\n?/g,'\n').replace(/\n$/,'').split('\n').map(r=>r.split('\t'));
  const nR=rows.length, nC=Math.max(...rows.map(r=>r.length));
  pushUndo();
  growTo(selR+nR, selC+nC);
  beginBatch();
  const internal = shClip && shClip.tsv===text;
  if(internal){
    const {r1,c1,r2,c2,mode,styles} = shClip;
    const dr=selR-r1, dc=selC-c1;
    /* 잘라내기: 원본 지움 (겹치는 경우 먼저 원본을 백업) */
    const src=[];
    for(let r=r1;r<=r2;r++){ const row=[]; for(let c=c1;c<=c2;c++) row.push(shData[r][c]); src.push(row); }
    if(mode==='cut'){
      for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){ setCellRaw(r,c,''); delete shStyle[cellKey(r,c)]; }
    }
    for(let r=0;r<src.length;r++) for(let c=0;c<src[r].length;c++){
      let v=src[r][c];
      if(mode==='copy' && typeof v==='string' && v[0]==='=') v = shiftFormula(v, dr, dc);
      setCellRaw(r1+dr+r, c1+dc+c, v==null?'':v);
      const st = styles[r+','+c];
      if(st) shStyle[cellKey(r1+dr+r, c1+dc+c)] = {...st};
      else delete shStyle[cellKey(r1+dr+r, c1+dc+c)];
    }
    if(mode==='cut') shClip=null;
    ancR=selR; ancC=selC; selR=selR+src.length-1; selC=selC+src[0].length-1;
  } else {
    for(let r=0;r<nR;r++) for(let c=0;c<rows[r].length;c++) setCellRaw(selR+r, selC+c, rows[r][c]);
    ancR=selR; ancC=selC; selR=selR+nR-1; selC=selC+nC-1;
  }
  endBatch();
  renderSheet();
  msg(T('mPasted'));
}
document.addEventListener('copy', e=>{
  if(!sheetActive() || sheetTb.querySelector('td.editing') || document.activeElement===$('formulaInput')) return;
  if(!$('sheetScroll').contains(document.activeElement) && document.activeElement!==document.body) return;
  doCopy(e,false);
});
document.addEventListener('cut', e=>{
  if(!sheetActive() || sheetTb.querySelector('td.editing') || document.activeElement===$('formulaInput')) return;
  if(!$('sheetScroll').contains(document.activeElement) && document.activeElement!==document.body) return;
  doCopy(e,true);
});
document.addEventListener('paste', e=>{
  if(!sheetActive() || sheetTb.querySelector('td.editing') || document.activeElement===$('formulaInput')) return;
  if(!$('sheetScroll').contains(document.activeElement) && document.activeElement!==document.body) return;
  const text = e.clipboardData ? e.clipboardData.getData('text/plain') : '';
  if(text){ e.preventDefault(); doPasteText(text); }
});

/* ── 수식 입력줄 ── */
$('formulaInput').addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    pushUndo(); setCellValue(selR,selC,$('formulaInput').value);
    setSel(Math.min(selR+1,shRows-1),selC,false); $('sheetScroll').focus();
  } else if(e.key==='Escape'){ e.preventDefault(); paintSel(); $('sheetScroll').focus(); }

$('formulaInput').addEventListener('blur', ()=>{
  if(shRefDrag) return;
  const v=$('formulaInput').value;
