/* 표 → 문서(글 모드)로 삽입 */
$('shToDoc').onclick = ()=>{
  const aoa=sheetToAOA(true);
  if(!aoa.length){ msg(T('mSheetEmpty')); return; }
  let html='<table>';
  aoa.forEach((r,ri)=>{ html+='<tr>'; r.forEach(v=>{ const tag=ri===0?'th':'td'; const s=(v==null||v==='')?'<br>':escHtml(String(v)); html+=`<${tag}>${s}</${tag}>`; }); html+='</tr>'; });
  html+='</table><p><br></p>';
  setMode('doc'); editor.focus();
  const sel=window.getSelection();
  if(!sel.rangeCount||!editor.contains(sel.anchorNode)) editor.appendChild(document.createRange().createContextualFragment(html));
  else document.execCommand('insertHTML',false,html);
  editor.dataset.welcome='0';
  msg(T('mSentToDoc'));
};

/* ═══════════════ PDF 모드 ═══════════════ */
let pdfDoc = null;        // pdf.js 문서 객체 (렌더링용)
let pdfBytes = null;      // 원본 바이트 (pdf-lib 편집용)
let pdfPage = 1, pdfTotal = 0, pdfScale = 1;
let pdfWorkerSet = false;

function setPdfWorker(){
  if(pdfWorkerSet || typeof pdfjsLib === 'undefined') return;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  pdfWorkerSet = true;
}
async function loadPdf(bytes){
  if(typeof pdfjsLib === 'undefined'){ msg(T('mPdfNoMod')); return; }
  setPdfWorker();
  pdfBytes = bytes.slice(0);  // 편집용 원본 보관
  pdfDoc = await pdfjsLib.getDocument({data:bytes.slice(0)}).promise;
  pdfTotal = pdfDoc.numPages; pdfPage = 1;
  $('pdfEmpty').style.display='none';
  $('pdfCanvas').style.display='block';
  await renderPdfPage();
}
async function renderPdfPage(){
  if(!pdfDoc) return;
  const page = await pdfDoc.getPage(pdfPage);
  const viewport = page.getViewport({scale: pdfScale * 1.5});  // 1.5=선명도
  const cv = $('pdfCanvas'), ctx = cv.getContext('2d');
  cv.width = viewport.width; cv.height = viewport.height;
  cv.style.width = (viewport.width/1.5)+'px';
  cv.style.height = (viewport.height/1.5)+'px';
  await page.render({canvasContext:ctx, viewport}).promise;
  $('pdfPageInfo').textContent = `${pdfPage} / ${pdfTotal}`;
}
$('pdfOpen').onclick = ()=>{
  if(typeof pdfjsLib === 'undefined'){ msg(T('mPdfNoMod')); return; }
  $('filePdfOpen').click();
};
$('filePdfOpen').onchange = e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async ()=>{ try{ await loadPdf(new Uint8Array(rd.result)); msg(f.name+T('mPdfOpened')); }catch(err){ msg(T('mPdfFail')+err.message); } };
  rd.readAsArrayBuffer(f); e.target.value='';
};
/* 페이지 이동 */
$('pdfPrev').onclick = async ()=>{ if(pdfDoc && pdfPage>1){ pdfPage--; await renderPdfPage(); } };
$('pdfNext').onclick = async ()=>{ if(pdfDoc && pdfPage<pdfTotal){ pdfPage++; await renderPdfPage(); } };
$('pdfZoom').onchange = async e=>{ pdfScale=+e.target.value; await renderPdfPage(); };
/* 이어붙이기 (pdf-lib) */
$('pdfAdd').onclick = ()=>{
  if(!pdfBytes){ msg(T('mPdfOpenFirst')); return; }
  if(typeof PDFLib === 'undefined'){ msg(T('mPdfNoMod')); return; }
  $('filePdfAdd').click();
};
$('filePdfAdd').onchange = e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async ()=>{
    try{
      const base=await PDFLib.PDFDocument.load(pdfBytes);
      const add=await PDFLib.PDFDocument.load(new Uint8Array(rd.result));
      const pages=await base.copyPages(add, add.getPageIndices());
      pages.forEach(p=>base.addPage(p));
      const merged=await base.save();
      await loadPdf(new Uint8Array(merged));
      msg(T('mPdfMerged'));
    }catch(err){ msg(T('mPdfFail')+err.message); }
  };
  rd.readAsArrayBuffer(f); e.target.value='';
};
/* 현재 페이지 → 그림 모드 */
$('pdfToImg').onclick = ()=>{
  if(!pdfDoc){ msg(T('mPdfOpenFirst')); return; }
  const dataURL = $('pdfCanvas').toDataURL('image/png');
  layers=[]; selId=null; docImgTarget=null;
  $('btnApplyDoc').style.display='none';
  setMode('img');
  addImageLayer(dataURL, T('pdfPageLayer')+' '+pdfPage);
  msg(T('mPdfToImg'));
};
/* 현재 페이지 PNG 저장 */
$('pdfExtractPng').onclick = async ()=>{
  if(!pdfDoc){ msg(T('mPdfOpenFirst')); return; }
  $('pdfCanvas').toBlob(b=> download(b, T('fnPdfPage')+pdfPage+'_'+new Date().toISOString().slice(0,10)+'.png'), 'image/png');
};
/* 현재 페이지만 PDF로 저장 (pdf-lib) */
$('pdfSavePage').onclick = async ()=>{
  if(!pdfBytes){ msg(T('mPdfOpenFirst')); return; }
  try{
    const src=await PDFLib.PDFDocument.load(pdfBytes);
    const out=await PDFLib.PDFDocument.create();
    const [pg]=await out.copyPages(src, [pdfPage-1]);
    out.addPage(pg);
    const bytes=await out.save();
    await download(new Blob([bytes],{type:'application/pdf'}), T('fnPdfPage')+pdfPage+'.pdf');
  }catch(err){ msg(T('mPdfFail')+err.message); }
};
/* 전체 PDF 저장 */
$('pdfSaveAll').onclick = async ()=>{
  if(!pdfBytes){ msg(T('mPdfOpenFirst')); return; }
  await download(new Blob([pdfBytes],{type:'application/pdf'}), T('fnPdf')+new Date().toISOString().slice(0,10)+'.pdf');
};
/* 현재 페이지 삭제 (pdf-lib) */
$('pdfDelPage').onclick = async ()=>{
  if(!pdfBytes){ msg(T('mPdfOpenFirst')); return; }
  if(pdfTotal <= 1){ msg(T('mPdfLastPage')); return; }
  if(!await askConfirm(T('cfDelPage').replace('{n}', pdfPage))) return;
  try{
    const src = await PDFLib.PDFDocument.load(pdfBytes);
    src.removePage(pdfPage - 1);
    const bytes = await src.save();
    const keepPage = Math.min(pdfPage, pdfTotal - 1);  /* 삭제 후 볼 페이지 */
    await loadPdf(new Uint8Array(bytes));
    pdfPage = keepPage; await renderPdfPage();
    msg(T('mPdfPageDeleted'));
  }catch(err){ msg(T('mPdfFail') + err.message); }
};

/* ═══════════════ PPT(프레젠테이션) 모드 ═══════════════ */
const PP_W = 960, PP_H = 540;               /* 슬라이드 내부 좌표계 (16:9, 96dpi 기준 10in × 5.625in) */
let ppSlides = [], ppCur = 0, ppSel = null; /* 슬라이드 배열 / 현재 슬라이드 / 선택 요소 id */
let ppZoomV = 'fit', ppEditingEl = null, ppIdSeq = 1;
let ppHist = [], ppHistPos = -1;            /* 실행 취소용 스냅샷 */
const ppNewId = () => 'e' + (ppIdSeq++);

function ppDefaultSlide(layout){
  const s = { bg:'#FFFFFF', notes:'', els:[] };
  if(layout === 'title'){
    s.els.push({id:ppNewId(), type:'text', x:80,  y:185, w:800, h:90,  text:T('ppTitleDefault'), size:44, color:'#22262B', bold:true,  align:'center'});
    s.els.push({id:ppNewId(), type:'text', x:160, y:300, w:640, h:50,  text:T('ppSubDefault'),   size:22, color:'#6B7482', bold:false, align:'center'});
  }else if(layout === 'body'){
    s.els.push({id:ppNewId(), type:'text', x:60, y:38,  w:840, h:70,  text:T('ppTitleDefault'), size:32, color:'#22262B', bold:true,  align:'left'});
    s.els.push({id:ppNewId(), type:'text', x:60, y:130, w:840, h:360, text:T('ppBodyDefault'),  size:20, color:'#22262B', bold:false, align:'left'});
  }
  return s;
}
function ppInit(){
  ppSlides = [ppDefaultSlide('title')];
  ppCur = 0; ppSel = null; ppHist = []; ppHistPos = -1;
  ppSnap(); ppRender();
}
function ensurePpt(){ if(!ppSlides.length) ppInit(); else ppRender(); }
function ppFind(id){ const sl = ppSlides[ppCur]; return sl && sl.els.find(e => e.id === id); }

/* ── 실행 취소 / 다시 실행 (스냅샷) ── */
function ppSnap(){
  ppHist = ppHist.slice(0, ppHistPos + 1);
  ppHist.push(JSON.stringify({s: ppSlides, c: ppCur}));
  if(ppHist.length > 60) ppHist.shift();
  ppHistPos = ppHist.length - 1;
}
function ppRestore(str){
  const o = JSON.parse(str);
  ppSlides = o.s; ppCur = Math.min(o.c, ppSlides.length - 1); ppSel = null;
  const mx = ppSlides.flatMap(s => s.els.map(e => +String(e.id).slice(1) || 0)).reduce((a,b)=>Math.max(a,b), 0);
  ppIdSeq = Math.max(ppIdSeq, mx + 1);
  ppRender();
}
function ppUndo(){ if(ppHistPos > 0){ ppHistPos--; ppRestore(ppHist[ppHistPos]); } }
function ppRedo(){ if(ppHistPos < ppHist.length - 1){ ppHistPos++; ppRestore(ppHist[ppHistPos]); } }
$('ppUndo').onclick = ppUndo;
$('ppRedo').onclick = ppRedo;

/* ── 렌더링 ── */
function ppScale(){
  if(ppZoomV !== 'fit') return +ppZoomV;
  const a = $('ppStageArea');
  const w = Math.max(120, a.clientWidth - 50), h = Math.max(90, a.clientHeight - 50);
  return Math.max(.2, Math.min(w / PP_W, h / PP_H, 1.5));
}
function ppBuildEl(el, inter){
  const d = document.createElement('div');
  if(el.type === 'image'){
    const im = document.createElement('img');
    im.src = el.src; im.draggable = false;
    im.style.cssText = 'width:100%;height:100%;object-fit:fill;pointer-events:none;display:block;';
    d.appendChild(im);
  }else if(el.type === 'shape'){
    d.style.background = el.fill;
    if(el.shape === 'ellipse') d.style.borderRadius = '50%';
  }else{
    d.textContent = el.text;
    d.style.cssText = `font-size:${el.size}px; color:${el.color}; font-weight:${el.bold?700:400}; text-align:${el.align}; line-height:1.35; white-space:pre-wrap; word-break:break-word; overflow:hidden;`;
  }
  d.classList.add('ppEl');
  if(inter && ppSel === el.id) d.classList.add('sel');
  d.dataset.id = el.id;
  d.style.position = 'absolute';
  d.style.left = el.x+'px'; d.style.top = el.y+'px';
  d.style.width = el.w+'px'; d.style.height = el.h+'px';
  if(inter && ppSel === el.id){
    const h = document.createElement('div'); h.className = 'pph'; d.appendChild(h);
  }
  return d;
}
function ppRenderStage(){
  const sc = ppScale();
  $('ppStageBox').style.width = (PP_W*sc)+'px';
  $('ppStageBox').style.height = (PP_H*sc)+'px';
  const st = $('ppStage');
  st.style.transform = `scale(${sc})`;
  st.innerHTML = '';
  const sl = ppSlides[ppCur]; if(!sl) return;
  st.style.background = sl.bg;
  sl.els.forEach(el => st.appendChild(ppBuildEl(el, true)));
}
function ppRenderList(){
  const list = $('ppList'); list.innerHTML = '';
  ppSlides.forEach((sl, i) => {
    const it = document.createElement('div');
    it.className = 'ppThumb' + (i === ppCur ? ' sel' : '');
    const num = document.createElement('div'); num.className = 'ppThumbNum'; num.textContent = i + 1;
    const box = document.createElement('div'); box.className = 'ppMiniBox';
    const mini = document.createElement('div'); mini.className = 'ppMini';
    mini.style.background = sl.bg;
    mini.style.transform = 'scale(' + (144 / PP_W) + ')';
    sl.els.forEach(el => mini.appendChild(ppBuildEl(el, false)));
    box.appendChild(mini);
    it.appendChild(num); it.appendChild(box);
    it.onclick = () => { ppCur = i; ppSel = null; ppRender(); };
    list.appendChild(it);
  });
}
function ppRenderNotes(){ const sl = ppSlides[ppCur]; $('ppNotes').value = sl ? sl.notes : ''; }
function ppSyncToolbar(){
  const el = ppSel ? ppFind(ppSel) : null;
  $('ppFontSize').value = (el && el.type === 'text') ? el.size : '';
  if(el && el.type === 'text') $('ppColor').value = el.color;
  if(el && el.type === 'shape') $('ppFill').value = el.fill;
  const sl = ppSlides[ppCur]; if(sl) $('ppBg').value = sl.bg;
}
function ppRender(){ ppRenderStage(); ppRenderList(); ppRenderNotes(); ppSyncToolbar(); }
function ppUpdateElDom(el){
  const d = $('ppStage').querySelector(`[data-id="${el.id}"]`); if(!d) return;
  d.style.left = el.x+'px'; d.style.top = el.y+'px';
  d.style.width = el.w+'px'; d.style.height = el.h+'px';
}
function ppSelect(id){ if(ppSel === id) return; ppSel = id; ppRenderStage(); ppSyncToolbar(); }
/* 편집 중인 텍스트가 있으면 내용 저장 */
function ppCommitEditing(){
  if(!ppEditingEl) return;
  const d = $('ppStage').querySelector(`[data-id="${ppEditingEl}"]`);
  if(d && d.onblur) d.onblur();
}

/* ── 무대(편집 영역) 상호작용: 이동·크기 조절·텍스트 편집 ── */
let ppDrag = null;
$('ppStage').addEventListener('mousedown', e => {
  const handle = e.target.closest('.pph');
  const elD = e.target.closest('.ppEl');
  if(!elD){ ppCommitEditing(); ppSelect(null); return; }
  const id = elD.dataset.id;
  if(ppEditingEl === id) return;                 /* 글 입력 중이면 그대로 둠 */
  if(ppEditingEl && ppEditingEl !== id) ppCommitEditing();
  ppSelect(id);
  const el = ppFind(id); if(!el) return;
  ppDrag = { el, mode: handle ? 'resize' : 'move', sx:e.clientX, sy:e.clientY,
             ox:el.x, oy:el.y, ow:el.w, oh:el.h, sc: ppScale(), moved:false };
  e.preventDefault();
});
window.addEventListener('mousemove', e => {
  if(!ppDrag) return;
  const dx = (e.clientX - ppDrag.sx) / ppDrag.sc, dy = (e.clientY - ppDrag.sy) / ppDrag.sc;
  if(Math.abs(dx) + Math.abs(dy) > 1) ppDrag.moved = true;
  const el = ppDrag.el;
  if(ppDrag.mode === 'move'){ el.x = Math.round(ppDrag.ox + dx); el.y = Math.round(ppDrag.oy + dy); }
  else { el.w = Math.max(20, Math.round(ppDrag.ow + dx)); el.h = Math.max(16, Math.round(ppDrag.oh + dy)); }
  ppUpdateElDom(el);
});
window.addEventListener('mouseup', () => {
  if(ppDrag){ if(ppDrag.moved){ ppSnap(); ppRenderList(); } ppDrag = null; }
});
$('ppStage').addEventListener('dblclick', e => {
  const d = e.target.closest('.ppEl'); if(!d) return;
  const el = ppFind(d.dataset.id);
  if(!el || el.type !== 'text') return;
  ppEditingEl = el.id;
  const hh = d.querySelector('.pph'); if(hh) hh.remove();
  d.contentEditable = 'true'; d.focus();
  document.execCommand('selectAll', false, null);
  d.onblur = () => {
    d.contentEditable = 'false'; d.onblur = null;
    el.text = d.innerText.replace(/\n$/, '');
    ppEditingEl = null;
    ppSnap(); ppRender();
  };
});
$('ppNotes').onchange = e => { const sl = ppSlides[ppCur]; if(sl){ sl.notes = e.target.value; ppSnap(); } };

/* ── 키보드: Delete 삭제 · 방향키 이동 · Ctrl+Z/Y ── */
document.addEventListener('keydown', e => {
  if(!$('modePpt').classList.contains('active')) return;
  if($('ppShow').style.display === 'flex') return;
  const ae = document.activeElement;
  if(ppEditingEl || (ae && (/INPUT|TEXTAREA|SELECT/.test(ae.tagName) || ae.isContentEditable))) return;
  if((e.key === 'Delete' || e.key === 'Backspace') && ppSel){
    const sl = ppSlides[ppCur];
    sl.els = sl.els.filter(x => x.id !== ppSel);
    ppSel = null; ppSnap(); ppRender(); e.preventDefault();
  }else if(e.key.startsWith('Arrow') && ppSel){
    const el = ppFind(ppSel); if(!el) return;
    const st = e.shiftKey ? 10 : 2;
    if(e.key === 'ArrowLeft') el.x -= st;
    if(e.key === 'ArrowRight') el.x += st;
    if(e.key === 'ArrowUp') el.y -= st;
    if(e.key === 'ArrowDown') el.y += st;
    ppUpdateElDom(el); ppSnap(); e.preventDefault();
  }else if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){
    e.shiftKey ? ppRedo() : ppUndo(); e.preventDefault();
  }else if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y'){
    ppRedo(); e.preventDefault();
  }
});

/* ── 슬라이드 관리 ── */
$('ppNew').onclick = async () => {
  if(ppSlides.length && !await askConfirm(T('cfNewPpt'))) return;
  ppInit(); msg(T('mNewPpt'));
};
$('ppAddSlide').onclick = () => {
  ppCommitEditing();
  ppSlides.splice(ppCur + 1, 0, ppDefaultSlide($('ppLayout').value));
  ppCur++; ppSel = null; ppSnap(); ppRender();
};
$('ppDupSlide').onclick = () => {
  ppCommitEditing();
  const sl = ppSlides[ppCur]; if(!sl) return;
  const copy = JSON.parse(JSON.stringify(sl));
  copy.els.forEach(el => el.id = ppNewId());
  ppSlides.splice(ppCur + 1, 0, copy);
  ppCur++; ppSel = null; ppSnap(); ppRender();
};
$('ppDelSlide').onclick = async () => {
  if(!ppSlides.length) return;
  if(!await askConfirm(T('cfDelSlide').replace('{n}', ppCur + 1))) return;
  ppSlides.splice(ppCur, 1);
  if(!ppSlides.length) ppSlides.push(ppDefaultSlide('blank'));
  ppCur = Math.min(ppCur, ppSlides.length - 1);
  ppSel = null; ppSnap(); ppRender(); msg(T('mSlideDeleted'));
};
$('ppUpSlide').onclick = () => {
  if(ppCur <= 0) return;
  [ppSlides[ppCur-1], ppSlides[ppCur]] = [ppSlides[ppCur], ppSlides[ppCur-1]];
  ppCur--; ppSnap(); ppRender();
};
$('ppDownSlide').onclick = () => {
  if(ppCur >= ppSlides.length - 1) return;
  [ppSlides[ppCur+1], ppSlides[ppCur]] = [ppSlides[ppCur], ppSlides[ppCur+1]];
  ppCur++; ppSnap(); ppRender();
};

/* ── 요소 추가 ── */
$('ppAddText').onclick = () => {
  const el = {id:ppNewId(), type:'text', x:280, y:220, w:400, h:60, text:T('txtDefault'), size:24, color:'#22262B', bold:false, align:'left'};
  ppSlides[ppCur].els.push(el); ppSel = el.id; ppSnap(); ppRender();
};
$('ppAddImg').onclick = () => $('filePptImg').click();
$('filePptImg').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const w = Math.min(420, im.width || 420);
      const h = Math.max(20, Math.round(w * (im.height || 300) / (im.width || 400)));
      const el = {id:ppNewId(), type:'image', x:Math.round((PP_W-w)/2), y:Math.max(10, Math.round((PP_H-h)/2)), w, h, src:rd.result};
      ppSlides[ppCur].els.push(el); ppSel = el.id; ppSnap(); ppRender();
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(f); e.target.value = '';
};
$('ppAddShape').onclick = () => {
  const el = {id:ppNewId(), type:'shape', shape:$('ppShapeSel').value, x:360, y:190, w:240, h:160, fill:$('ppFill').value};
  ppSlides[ppCur].els.push(el); ppSel = el.id; ppSnap(); ppRender();
};

/* ── 선택 요소 서식 ── */
$('ppFontSize').onchange = e => {
  const el = ppSel && ppFind(ppSel);
  if(el && el.type === 'text'){ el.size = Math.max(8, Math.min(200, +e.target.value || el.size)); ppSnap(); ppRender(); }
};
$('ppBold').onclick = () => {
  const el = ppSel && ppFind(ppSel);
  if(el && el.type === 'text'){ el.bold = !el.bold; ppSnap(); ppRender(); }
};
$('ppColor').onchange = e => {
  const el = ppSel && ppFind(ppSel);
  if(el && el.type === 'text'){ el.color = e.target.value; ppSnap(); ppRender(); }
};
document.querySelectorAll('#tbPpt [data-ppalign]').forEach(b => b.onclick = () => {
  const el = ppSel && ppFind(ppSel);
  if(el && el.type === 'text'){ el.align = b.dataset.ppalign; ppSnap(); ppRender(); }
});
$('ppFill').onchange = e => {
  const el = ppSel && ppFind(ppSel);
  if(el && el.type === 'shape'){ el.fill = e.target.value; ppSnap(); ppRender(); }
};
$('ppBg').onchange = e => {
  const sl = ppSlides[ppCur];
  if(sl){ sl.bg = e.target.value; ppSnap(); ppRender(); }
};
$('ppZoom').onchange = e => { ppZoomV = e.target.value; ppRenderStage(); };
window.addEventListener('resize', () => {
  if($('modePpt').classList.contains('active') && ppZoomV === 'fit') ppRenderStage();
  if($('ppShow').style.display === 'flex') ppShowRender();
});

/* ── 슬라이드쇼 ── */
let ppShowIdx = 0;
function ppShowRender(){
  const sl = ppSlides[ppShowIdx]; if(!sl) return;
  const box = $('ppShowSlide'); box.innerHTML = '';
  const sc = Math.min(window.innerWidth / PP_W, window.innerHeight / PP_H);
  box.style.width = (PP_W*sc)+'px'; box.style.height = (PP_H*sc)+'px';
  const st = document.createElement('div');
  st.style.cssText = `width:${PP_W}px; height:${PP_H}px; transform:scale(${sc}); transform-origin:top left; position:relative; background:${sl.bg}; overflow:hidden;`;
  sl.els.forEach(el => st.appendChild(ppBuildEl(el, false)));
  box.appendChild(st);
  $('ppShowNum').textContent = (ppShowIdx + 1) + ' / ' + ppSlides.length;
}
function ppStartShow(){
  if(!ppSlides.length) return;
  ppCommitEditing();
  ppShowIdx = ppCur;
  $('ppShow').style.display = 'flex';
  ppShowRender();
  msg(T('ppShowTip'));
  if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
}
function ppEndShow(){
  $('ppShow').style.display = 'none';
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}
function ppShowNext(){ if(ppShowIdx < ppSlides.length - 1){ ppShowIdx++; ppShowRender(); } else ppEndShow(); }
function ppShowPrevF(){ if(ppShowIdx > 0){ ppShowIdx--; ppShowRender(); } }
$('ppStartShow').onclick = ppStartShow;
$('ppShowExit').onclick = ppEndShow;
$('ppShowNext').onclick = ppShowNext;
$('ppShowPrev').onclick = ppShowPrevF;
$('ppShowSlide').onclick = ppShowNext;
document.addEventListener('keydown', e => {
  if($('ppShow').style.display !== 'flex') return;
  if(e.key === 'Escape'){ ppEndShow(); }
  else if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){ ppShowNext(); e.preventDefault(); }
  else if(['ArrowLeft','PageUp'].includes(e.key)){ ppShowPrevF(); e.preventDefault(); }
}, true);
document.addEventListener('fullscreenchange', () => {
  if(!document.fullscreenElement && $('ppShow').style.display === 'flex') $('ppShow').style.display = 'none';
});

/* ── 현재 슬라이드 → PNG (직접 캔버스에 그림) ── */
function ppLoadImg(src){ return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }
function ppWrap(c, text, w){
  if(text === '') return [''];
  const out = []; let cur = '';
  for(const word of text.split(' ')){
    const t = cur ? cur + ' ' + word : word;
    if(c.measureText(t).width <= w){ cur = t; continue; }
    if(cur){ out.push(cur); cur = ''; }
    if(c.measureText(word).width <= w){ cur = word; continue; }
    let seg = '';
    for(const ch of word){
      if(!seg || c.measureText(seg + ch).width <= w) seg += ch;
      else { out.push(seg); seg = ch; }
    }
    cur = seg;
  }
  out.push(cur);
  return out;
}
async function ppSlideToCanvas(sl, scale){
  const cvv = document.createElement('canvas');
  cvv.width = PP_W * scale; cvv.height = PP_H * scale;
  const c = cvv.getContext('2d'); c.scale(scale, scale);
  c.fillStyle = sl.bg; c.fillRect(0, 0, PP_W, PP_H);
  for(const el of sl.els){
    if(el.type === 'shape'){
      c.fillStyle = el.fill;
      if(el.shape === 'ellipse'){ c.beginPath(); c.ellipse(el.x + el.w/2, el.y + el.h/2, el.w/2, el.h/2, 0, 0, Math.PI*2); c.fill(); }
      else c.fillRect(el.x, el.y, el.w, el.h);
    }else if(el.type === 'image'){
      try{ const im = await ppLoadImg(el.src); c.drawImage(im, el.x, el.y, el.w, el.h); }catch(e){}
    }else{
      c.fillStyle = el.color;
      c.font = `${el.bold ? '700' : '400'} ${el.size}px 'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif`;
      c.textBaseline = 'top';
      const lh = el.size * 1.35;
      let y = el.y + (lh - el.size) / 2;
      for(const para of String(el.text).split('\n')){
        for(const ln of ppWrap(c, para, el.w)){
          let x = el.x;
          const wpx = c.measureText(ln).width;
          if(el.align === 'center') x = el.x + (el.w - wpx) / 2;
          else if(el.align === 'right') x = el.x + el.w - wpx;
          c.fillText(ln, x, y);
          y += lh;
        }
      }
    }
  }
  return cvv;
}
$('ppPng').onclick = async () => {
  const sl = ppSlides[ppCur]; if(!sl) return;
  ppCommitEditing();
  try{
    const cvv = await ppSlideToCanvas(sl, 2);
    cvv.toBlob(b => download(b, T('fnSlide') + (ppCur + 1) + '_' + new Date().toISOString().slice(0,10) + '.png'), 'image/png');
  }catch(err){ msg(T('mExportFail') + err.message); }
};

/* ── PPTX로 저장 (PptxGenJS) ── */
$('ppSave').onclick = async () => {
  if(typeof PptxGenJS === 'undefined'){ msg(T('mPptNoMod')); return; }
  if(!ppSlides.length){ msg(T('mPptNoSlides')); return; }
  ppCommitEditing();
  try{
    const pres = new PptxGenJS();
    pres.layout = 'LAYOUT_16x9';                 /* 10in × 5.625in = 960 × 540 px */
    const K = 1 / 96;                            /* px → inch */
    ppSlides.forEach(sl => {
      const s = pres.addSlide();
      s.background = { color: sl.bg.replace('#','') };
      sl.els.forEach(el => {
        const box = { x: el.x*K, y: el.y*K, w: el.w*K, h: el.h*K };
        if(el.type === 'shape'){
          s.addShape(el.shape === 'ellipse' ? 'ellipse' : 'rect',
            Object.assign({}, box, { fill:{color: el.fill.replace('#','')}, line:{type:'none'} }));
        }else if(el.type === 'image'){
          s.addImage(Object.assign({ data: el.src }, box));
        }else{
          s.addText(el.text, Object.assign({}, box, {
            fontSize: Math.max(6, Math.round(el.size * 0.75)),
            color: el.color.replace('#',''), bold: !!el.bold,
            align: el.align, valign: 'top',
            fontFace: LANG === 'ko' ? 'Malgun Gothic' : 'Segoe UI'
          }));
        }
      });
      if(sl.notes) s.addNotes(sl.notes);
    });
    const blob = await pres.write('blob');
    await download(blob, T('fnPpt') + new Date().toISOString().slice(0,10) + '.pptx');
    msg(T('mPptSaved'));
  }catch(err){ msg(T('mPptFail') + err.message); }
};

/* ── PPTX 열기 (JSZip으로 직접 해석 — 텍스트·이미지·도형·배경) ── */
function ppLoc(node, name){ return [...node.getElementsByTagName('*')].filter(n => n.localName === name); }
async function importPptx(buf){
  const zip = await JSZip.loadAsync(buf);
  const presFile = zip.file('ppt/presentation.xml');
  if(!presFile) throw new Error('presentation.xml');
  const presX = await presFile.async('string');
  const mSz = presX.match(/sldSz[^>]*cx="(\d+)"[^>]*cy="(\d+)"/);
  const cx = mSz ? +mSz[1] : 12192000, cy = mSz ? +mSz[2] : 6858000;
  const kx = PP_W / cx, ky = PP_H / cy;
  const names = Object.keys(zip.files)
    .filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a,b) => +a.match(/(\d+)\.xml/)[1] - +b.match(/(\d+)\.xml/)[1]);
  if(!names.length) throw new Error(T('mPptNoSlides'));
  const parser = new DOMParser();
  const RNS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const out = [];
  for(const nm of names){
    const num = nm.match(/(\d+)\.xml/)[1];
    const xml = parser.parseFromString(await zip.file(nm).async('string'), 'application/xml');
    /* 이미지 관계(rels) */
    const rels = {};
    const rf = zip.file(`ppt/slides/_rels/slide${num}.xml.rels`);
    if(rf){
      const rx = parser.parseFromString(await rf.async('string'), 'application/xml');
      [...rx.getElementsByTagName('Relationship')].forEach(r => rels[r.getAttribute('Id')] = r.getAttribute('Target'));
    }
    const sl = { bg:'#FFFFFF', notes:'', els:[] };
    const bg = ppLoc(xml.documentElement, 'bg')[0];
    if(bg){ const cNode = ppLoc(bg, 'srgbClr')[0]; if(cNode) sl.bg = '#' + cNode.getAttribute('val'); }
    const tree = ppLoc(xml.documentElement, 'spTree')[0];
    if(tree) for(const node of [...tree.children]){
      const ln = node.localName;
      if(ln !== 'sp' && ln !== 'pic') continue;
      const xf = ppLoc(node, 'xfrm')[0]; if(!xf) continue;
      const off = ppLoc(xf, 'off')[0], ext = ppLoc(xf, 'ext')[0];
      if(!off || !ext) continue;
      const x = Math.round(+off.getAttribute('x') * kx), y = Math.round(+off.getAttribute('y') * ky);
      const w = Math.max(10, Math.round(+ext.getAttribute('cx') * kx));
      const h = Math.max(10, Math.round(+ext.getAttribute('cy') * ky));
      if(ln === 'pic'){
        const blip = ppLoc(node, 'blip')[0]; if(!blip) continue;
        const rid = blip.getAttribute('r:embed') || blip.getAttributeNS(RNS, 'embed');
        const tgt = rels[rid]; if(!tgt) continue;
        const path = 'ppt/' + tgt.replace(/^(\.\.\/)+/, '');
        const ext2 = path.split('.').pop().toLowerCase();
        const mime = {png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', bmp:'image/bmp', webp:'image/webp', svg:'image/svg+xml'}[ext2];
        const mf = zip.file(path);
        if(!mime || !mf) continue;               /* emf·wmf 등은 건너뜀 */
        const b64 = await mf.async('base64');
        sl.els.push({id:ppNewId(), type:'image', x, y, w, h, src:`data:${mime};base64,${b64}`});
      }else{
        const txBody = ppLoc(node, 'txBody')[0];
        const paras = txBody ? ppLoc(txBody, 'p') : [];
        const text = paras.map(p => ppLoc(p, 't').map(t => t.textContent).join('')).join('\n');
        if(text.trim()){
          const rpr = ppLoc(node, 'rPr').find(r => r.getAttribute('sz')) || ppLoc(node, 'rPr')[0] || null;
          let szPt = 18, color = '#22262B', bold = false;
          if(rpr){
            if(rpr.getAttribute('sz')) szPt = +rpr.getAttribute('sz') / 100;
            bold = rpr.getAttribute('b') === '1';
            const cNode = ppLoc(rpr, 'srgbClr')[0]; if(cNode) color = '#' + cNode.getAttribute('val');
          }
          const ppr = ppLoc(node, 'pPr').find(p => p.getAttribute('algn'));
          const align = {ctr:'center', r:'right', l:'left', just:'left'}[ppr ? ppr.getAttribute('algn') : 'l'] || 'left';
          sl.els.push({id:ppNewId(), type:'text', x, y, w, h, text, size:Math.max(8, Math.round(szPt / 0.75)), color, bold, align});
        }else{
          const spPr = ppLoc(node, 'spPr')[0];
          const fillC = spPr ? ppLoc(spPr, 'srgbClr')[0] : null;
          if(fillC){
            const prst = ppLoc(node, 'prstGeom')[0];
            const shape = (prst && prst.getAttribute('prst') === 'ellipse') ? 'ellipse' : 'rect';
            sl.els.push({id:ppNewId(), type:'shape', shape, x, y, w, h, fill:'#' + fillC.getAttribute('val')});
          }
        }
      }
    }
    out.push(sl);
  }
  ppSlides = out; ppCur = 0; ppSel = null;
  ppHist = []; ppHistPos = -1; ppSnap(); ppRender();
}
$('ppOpen').onclick = () => {
  if(typeof JSZip === 'undefined'){ msg(T('mPptNoMod')); return; }
  $('filePptOpen').click();
};
$('filePptOpen').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = async () => {
    try{
      await importPptx(rd.result);
      setMode('ppt');
      msg(f.name + T('mPdfOpened') + ' ' + T('mPptImportNote'));
    }catch(err){ msg(T('mPptFail') + (err.message || err)); }
  };
  rd.readAsArrayBuffer(f); e.target.value = '';
};

/* URL의 ?lang=en / ?lang=ko를 최우선 적용하고, 없으면 브라우저 기본 언어를 따름 */
const requestedLang = new URLSearchParams(window.location.search).get('lang');
if(requestedLang === 'en' || requestedLang === 'ko') {
  LANG = requestedLang;
} else {
  const browserLang = ((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase();
  LANG = browserLang.startsWith('ko') ? 'ko' : 'en';
}
loadLetterhead();
fillWelcome();
applyLang();

/* 초기화 */
applyZoom(); render(); renderPanel();
window.addEventListener('beforeunload', e=>{ e.preventDefault(); e.returnValue=''; });
