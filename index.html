/* ── 찾기/바꾸기 (Ctrl+F / Ctrl+H) ── */
function openFind(focusRep){
  const d = $('dlgFind');
  if(!d.open) d.show();     /* 비모달: 표를 계속 보면서 사용 */
  (focusRep ? $('fRepTxt') : $('fFindTxt')).focus();
  ($('fFindTxt')).select();
}
$('shFind').onclick = ()=> openFind(false);
$('fClose').onclick = ()=> $('dlgFind').close();
function cellMatches(r,c,q){
  const raw = String(shData[r][c] ?? '');
  const disp = cellDisplay(r,c);
  return raw.toLowerCase().includes(q) || disp.toLowerCase().includes(q);
}
function findNext(){
  const q = $('fFindTxt').value.toLowerCase();
  if(!q){ msg(T('mFindEmpty')); return false; }
  const total = shRows*shCols;
  const startIdx = selR*shCols + selC;
  for(let k=1;k<=total;k++){
    const idx = (startIdx + k) % total;
    const r = Math.floor(idx/shCols), c = idx%shCols;
    if(mergeAt(r,c) && mergeAt(r,c).r!==r) continue;   /* 병합 덮인 셀 건너뜀 */
    if(cellMatches(r,c,q)){ setSel(r,c,false); return true; }
  }
  msg(T('mFindNone'));
  return false;
}
$('fNext').onclick = findNext;
$('fFindTxt').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); findNext(); } });
$('fRepTxt').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); $('fRepOne').onclick(); } });
$('fRepOne').onclick = ()=>{
  const q = $('fFindTxt').value; if(!q){ msg(T('mFindEmpty')); return; }
  const rep = $('fRepTxt').value;
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  if(cellMatches(selR,selC,q.toLowerCase())){
    pushUndo();
    setCellValue(selR, selC, String(shData[selR][selC] ?? '').replace(re, rep));
  }
  findNext();
};
$('fRepAll').onclick = ()=>{
  const q = $('fFindTxt').value; if(!q){ msg(T('mFindEmpty')); return; }
  const rep = $('fRepTxt').value;
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  let n=0;
  pushUndo();
  beginBatch();
  for(let r=0;r<shRows;r++) for(let c=0;c<shCols;c++){
    const raw = String(shData[r][c] ?? '');
    if(raw && re.test(raw)){ re.lastIndex=0; setCellRaw(r,c, raw.replace(re, rep)); n++; }
    re.lastIndex=0;
  }
  endBatch();
  if(!n) shUndo.pop();
  renderSheet();
  msg(T('mRepDone').replace('{n}', n));
};

/* ── Σ 자동 합계 ── */
$('shAutoSum').onclick = ()=>{
  const {r1,c1,r2,c2} = selRange();
  const hasNum = (r,c)=> toNum(cellValue(r,c))!=null;
  pushUndo();
  if(r1===r2 && c1===c2){
    let rs=r1-1; while(rs>=0 && hasNum(rs,c1)) rs--;
    if(rs < r1-1){ setCellRaw(r1,c1,`=SUM(${rangeRef(rs+1,c1,r1-1,c1)})`); }
    else{
      let cs=c1-1; while(cs>=0 && hasNum(r1,cs)) cs--;
      if(cs < c1-1) setCellRaw(r1,c1,`=SUM(${rangeRef(r1,cs+1,r1,c1-1)})`);
      else { shUndo.pop(); msg(T('mNoNums')); return; }
    }
    renderSheet(); setSel(r1,c1,false);
  } else if(r1===r2){
    growTo(shRows, c2+2);
    setCellRaw(r1, c2+1, `=SUM(${rangeRef(r1,c1,r1,c2)})`);
    renderSheet(); setSel(r1,c2+1,false);
  } else {
    growTo(r2+2, shCols);
    beginBatch();
    for(let c=c1;c<=c2;c++){
      let any=false; for(let r=r1;r<=r2;r++) if(hasNum(r,c)){ any=true; break; }
      if(any) setCellRaw(r2+1, c, `=SUM(${rangeRef(r1,c,r2,c)})`);
    }
    endBatch();
    renderSheet(); setSel(r2+1,c1,false);
  }
  msg(T('mAutoSum'));
};

/* ── 행/열 추가·삽입·삭제 ── */
$('shAddRow').onclick = ()=>{ pushUndo(); const from=shRows; shData.push(Array(shCols).fill('')); shRows++; appendRowsDOM(from); };
$('shAddCol').onclick = ()=>{ pushUndo(); shData.forEach(r=>r.push('')); shColW.push(SH_DEFAULT_W); shCols++; buildHF(); renderSheet(); };
function remapStyles(fn){
  const out={};
  for(const k in shStyle){
    const [r,c]=k.split(',').map(Number);
    const m=fn(r,c);
    if(m) out[m[0]+','+m[1]]=shStyle[k];
  }
  shStyle=out;
}
function adjustRefsInsertRow(at,n){ mapAllFormulas((r,cRow)=> null, f=> f.replace(/(\$?)([A-Z]{1,3})(\$?)(\d+)/g,(m,d1,col,d2,row,off,str)=>{ const prev=str[off-1]; if(prev&&/[A-Za-z0-9_.$]/.test(prev))return m; if(str[off+m.length]==='(')return m; const rr=(+row)-1; return rr>=at? d1+col+d2+(rr+1+n):m; })); }
function adjustRefsDeleteRow(at,n){ mapAllFormulas(null, f=> f.replace(/(\$?)([A-Z]{1,3})(\$?)(\d+)/g,(m,d1,col,d2,row,off,str)=>{ const prev=str[off-1]; if(prev&&/[A-Za-z0-9_.$]/.test(prev))return m; if(str[off+m.length]==='(')return m; const rr=(+row)-1; if(rr>=at&&rr<at+n)return '#REF!'; return rr>=at+n? d1+col+d2+(rr+1-n):m; })); }
function adjustRefsInsertCol(at,n){ mapAllFormulas(null, f=> f.replace(/(\$?)([A-Z]{1,3})(\$?)(\d+)/g,(m,d1,col,d2,row,off,str)=>{ const prev=str[off-1]; if(prev&&/[A-Za-z0-9_.$]/.test(prev))return m; if(str[off+m.length]==='(')return m; const cc=colIdx(col); return cc>=at? d1+colName(cc+n)+d2+row:m; })); }
function adjustRefsDeleteCol(at,n){ mapAllFormulas(null, f=> f.replace(/(\$?)([A-Z]{1,3})(\$?)(\d+)/g,(m,d1,col,d2,row,off,str)=>{ const prev=str[off-1]; if(prev&&/[A-Za-z0-9_.$]/.test(prev))return m; if(str[off+m.length]==='(')return m; const cc=colIdx(col); if(cc>=at&&cc<at+n)return '#REF!'; return cc>=at+n? d1+colName(cc-n)+d2+row:m; })); }
function mapAllFormulas(_, fn){
  for(let r=0;r<shRows;r++) for(let c=0;c<shCols;c++){
    const v=shData[r][c];
    if(typeof v==='string' && v[0]==='=') shData[r][c]=fn(v);
  }
}
$('shInsRow').onclick = ()=>{
  const {r1,r2} = selRange(); const n=r2-r1+1;
  pushUndo();
  adjustRefsInsertRow(r1,n);
  shiftMergesRow(r1, n);
  for(let i=0;i<n;i++) shData.splice(r1,0,Array(shCols).fill(''));
  shRows+=n;
  remapStyles((r,c)=> [r>=r1? r+n : r, c]);
  buildHF(); renderSheet(); setSel(r1,selC,false); msg(T('mRowIns'));
};
$('shDelRow').onclick = ()=>{
  const {r1,r2} = selRange(); const n=Math.min(r2-r1+1, shRows-1);
  if(shRows-n<1) return;
  pushUndo();
  adjustRefsDeleteRow(r1,n);
  shiftMergesRow(r1, -n);
  shData.splice(r1,n); shRows-=n;
  remapStyles((r,c)=> r>=r1&&r<r1+n ? null : [r>=r1+n? r-n : r, c]);
  buildHF(); renderSheet(); setSel(Math.min(r1,shRows-1),selC,false); msg(T('mRowDel'));
};
$('shInsCol').onclick = ()=>{
  const {c1,c2} = selRange(); const n=c2-c1+1;
  pushUndo();
  adjustRefsInsertCol(c1,n);
  shiftMergesCol(c1, n);
  shData.forEach(r=>{ for(let i=0;i<n;i++) r.splice(c1,0,''); });
  for(let i=0;i<n;i++) shColW.splice(c1,0,SH_DEFAULT_W);
  shCols+=n;
  remapStyles((r,c)=> [r, c>=c1? c+n : c]);
  buildHF(); renderSheet(); setSel(selR,c1,false); msg(T('mColIns'));
};
$('shDelCol').onclick = ()=>{
  const {c1,c2} = selRange(); const n=Math.min(c2-c1+1, shCols-1);
  if(shCols-n<1) return;
  pushUndo();
  adjustRefsDeleteCol(c1,n);
  shiftMergesCol(c1, -n);
  shData.forEach(r=>r.splice(c1,n)); shColW.splice(c1,n); shCols-=n;
  remapStyles((r,c)=> c>=c1&&c<c1+n ? null : [r, c>=c1+n? c-n : c]);
  buildHF(); renderSheet(); setSel(selR,Math.min(c1,shCols-1),false); msg(T('mColDel'));
};

/* ── 새 표 ── */
$('shNew').onclick = async ()=>{
  if(shData && shData.some(r=>r.some(c=>c!=='' && c!=null))){
    if(!await askConfirm(T('cfNewSheet'))) return;
  }
  shRows=SH_ROWS_INIT; shCols=SH_COLS_INIT; shData=Array.from({length:shRows},()=>Array(shCols).fill('')); shStyle={};
  shColW = Array(shCols).fill(SH_DEFAULT_W);
  shUndo=[]; shRedo=[]; shClip=null; shMerges=[];
  buildHF(); selR=0; selC=0; ancR=0; ancC=0; renderSheet(); msg(T('mNewSheet'));
};

/* 툴바의 어떤 버튼을 눌러도 편집 중이던 값이 먼저 저장되도록 */
document.querySelectorAll('#tbSheet button').forEach(b=>{
  b.addEventListener('mousedown', ()=>{ commitPendingEdit(); });
});

/* ── 셀 병합/해제 ── */
$('shMerge').onclick = async ()=>{
  const {r1,c1,r2,c2} = selRange();
  /* 선택이 기존 병합과 정확히 일치하면 → 해제 */
  const exact = shMerges.findIndex(m=> m.r===r1 && m.c===c1 && m.r+m.rs-1===r2 && m.c+m.cs-1===c2);
  if(exact>=0){ pushUndo(); shMerges.splice(exact,1); renderSheet(); msg(T('mUnmerged')); return; }
  if(r1===r2 && c1===c2){ msg(T('mMergeNeed')); return; }
  /* 값이 여러 개면 왼쪽 위 값만 남는다고 알림 */
  let vals=0;
  for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++)
    if(shData[r][c]!=='' && shData[r][c]!=null) vals++;
  if(vals>1 && !await askConfirm(T('cfMerge'))) return;
  pushUndo();
  /* 겹치는 기존 병합 제거 */
  shMerges = shMerges.filter(m=> m.r+m.rs-1<r1 || m.r>r2 || m.c+m.cs-1<c1 || m.c>c2);
  /* 왼쪽 위 값만 유지 */
  beginBatch();
  for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++)
    if(r!==r1 || c!==c1) setCellRaw(r,c,'');
  endBatch();
  shMerges.push({r:r1, c:c1, rs:r2-r1+1, cs:c2-c1+1});
  ancR=r1; ancC=c1; selR=r1; selC=c1;
  renderSheet(); msg(T('mMerged'));
};
/* 행·열 삽입/삭제 시 병합 이동 (걸친 병합은 해제) */
function shiftMergesRow(at, n){  /* n>0 삽입, n<0 삭제 */
  const del1=at, del2=at+Math.abs(n)-1;
  shMerges = shMerges.filter(m=>{
    if(n<0 && !(m.r+m.rs-1<del1 || m.r>del2)) return false;      /* 삭제 범위와 겹침 → 해제 */
    if(n>0 && at>m.r && at<=m.r+m.rs-1) return false;            /* 병합 중간에 삽입 → 해제 */
    return true;
  });
  shMerges.forEach(m=>{ if(m.r>=at) m.r += n; });
}
function shiftMergesCol(at, n){
  const del1=at, del2=at+Math.abs(n)-1;
  shMerges = shMerges.filter(m=>{
    if(n<0 && !(m.c+m.cs-1<del1 || m.c>del2)) return false;
    if(n>0 && at>m.c && at<=m.c+m.cs-1) return false;
    return true;
  });
  shMerges.forEach(m=>{ if(m.c>=at) m.c += n; });
}

/* ── 스타일: 선택 범위 전체에 적용 ── */

    else shStyle[k][prop] = val;

  recalcRender();
}

/* ── 정렬 (선택한 열 기준, 머리글로 보이면 1행 고정) ── */
function usedRange(){
  let mr=-1, mc=-1;
  for(let r=0;r<shRows;r++) for(let c=0;c<shCols;c++)
    if(shData[r][c]!=='' && shData[r][c]!=null){ mr=Math.max(mr,r); mc=Math.max(mc,c); }
  return mr<0 ? null : {r1:0,c1:0,r2:mr,c2:mc};
}
function sortByCol(asc){
  const u = usedRange(); if(!u){ msg(T('mSheetEmpty')); return; }
  if(shMerges.length){ msg(T('mSortMerged')); return; }
  const c = selC;
  /* 1행이 문자이고 아래에 숫자가 있으면 머리글로 간주 */
  let start = 0;
  const h = shData[0][c];
  if(h!=='' && h!=null && toNum(h)==null){
    for(let r=1;r<=u.r2;r++){ if(toNum(cellValue(r,c))!=null){ start=1; break; } }
  }
  pushUndo();
  const idx = [];
  for(let r=start;r<=u.r2;r++) idx.push(r);
  idx.sort((a,b)=>{
    const x=cellValue(a,c), y=cellValue(b,c);
    const ex=(x===''||x==null), ey=(y===''||y==null);
    if(ex&&ey) return 0;
    if(ex) return 1;              /* 빈 셀은 항상 마지막 */
    if(ey) return -1;
    const nx=toNum(x), ny=toNum(y);
    let cmp;
    if(nx!=null && ny!=null) cmp = nx-ny;
    else cmp = String(x).localeCompare(String(y));
    return asc?cmp:-cmp;
  });
  const newData = shData.map(r=>r.slice());
  const rowMap = {};
  idx.forEach((srcR,i)=>{ newData[start+i]=shData[srcR].slice(); rowMap[srcR]=start+i; });
  shData = newData;
  remapStyles((r,cc)=> [rowMap[r]!=null? rowMap[r] : r, cc]);
  buildHF(); renderSheet();
  msg(asc?T('mSortedAsc'):T('mSortedDesc'));
}
$('shSortAsc').onclick = ()=> sortByCol(true);
$('shSortDesc').onclick = ()=> sortByCol(false);

$('shPivot').onclick = ()=>{

  };
  fill($('pvRow'),false); fill($('pvCol'),true); fill($('pvVal'),false);
  $('pvCol').value='-1';
  if(heads.length>1) $('pvVal').value=String(heads.length-1);

  };

};
async function buildPivot(u, rf, cf, vf, agg){
  const rows = [];
  for(let r=u.r1+1; r<=u.r2; r++){
    const rk = String(cellValue(r, u.c1+rf) ?? '');
    const ck = cf>=0 ? String(cellValue(r, u.c1+cf) ?? '') : '';
    if(rk==='' && ck==='') continue;
    const v = toNum(cellValue(r, u.c1+vf));
    rows.push([rk, ck, v]);
  }
  if(!rows.length){ msg(T('mPivotNeed')); return; }
  const cmpKey=(a,b)=>{ const na=toNum(a), nb=toNum(b); if(na!=null&&nb!=null) return na-nb; return String(a).localeCompare(String(b)); };
  const rKeys=[...new Set(rows.map(x=>x[0]))].sort(cmpKey);
  const cKeys=cf>=0 ? [...new Set(rows.map(x=>x[1]))].sort(cmpKey) : [''];
  const cell={};
  for(const [rk,ck,v] of rows){
    const k=rk+'\u0001'+ck;
    const o = cell[k] = cell[k] || {sum:0,cnt:0,n:0,min:Infinity,max:-Infinity};
    o.cnt++;
    if(v!=null){ o.sum+=v; o.n++; o.min=Math.min(o.min,v); o.max=Math.max(o.max,v); }
  }
  const calc = o=>{
    if(!o) return '';
    if(agg==='count') return o.cnt;
    if(!o.n) return '';
    if(agg==='sum') return Math.round(o.sum*1e8)/1e8;
    if(agg==='avg') return Math.round(o.sum/o.n*1e8)/1e8;
    if(agg==='min') return o.min;
    if(agg==='max') return o.max;
    return '';
  };
  const aggName = {sum:T('pvSum'),count:T('pvCount'),avg:T('pvAvg'),min:T('pvMin'),max:T('pvMax')}[agg];
  const headRow = [ String(cellValue(u.r1,u.c1+rf)||'') + ' \\ ' + aggName ];
  if(cf>=0){ headRow.push(...cKeys.map(String)); headRow.push(T('pvTotal')); }
  else headRow.push(aggName);
  const out=[headRow];
  const colTot = cKeys.map(()=>({sum:0,cnt:0,n:0,min:Infinity,max:-Infinity}));
  for(const rk of rKeys){
    const line=[rk];
    const rTot={sum:0,cnt:0,n:0,min:Infinity,max:-Infinity};
    cKeys.forEach((ck,ci)=>{
      const o=cell[rk+'\u0001'+ck];
      line.push(calc(o));
      if(o){ rTot.sum+=o.sum; rTot.cnt+=o.cnt; rTot.n+=o.n; rTot.min=Math.min(rTot.min,o.min); rTot.max=Math.max(rTot.max,o.max);
             const t=colTot[ci]; t.sum+=o.sum; t.cnt+=o.cnt; t.n+=o.n; t.min=Math.min(t.min,o.min); t.max=Math.max(t.max,o.max); }
    });
    if(cf>=0) line.push(calc(rTot));
    out.push(line);
  }
  const totLine=[T('pvTotal')];
  const gTot={sum:0,cnt:0,n:0,min:Infinity,max:-Infinity};
  colTot.forEach(t=>{ totLine.push(calc(t)); gTot.sum+=t.sum; gTot.cnt+=t.cnt; gTot.n+=t.n; gTot.min=Math.min(gTot.min,t.min); gTot.max=Math.max(gTot.max,t.max); });
  if(cf>=0) totLine.push(calc(gTot));
  out.push(totLine);
  /* 결과를 현재 선택 셀 위치에 기록 */
  const pr=selR, pc=selC;
  let overlap=false;
  for(let r=0;r<out.length && !overlap;r++) for(let c=0;c<out[r].length;c++){
    const tr=pr+r, tc=pc+c;
    if(tr<shRows && tc<shCols && shData[tr][tc]!=='' && shData[tr][tc]!=null){ overlap=true; break; }
  }
  if(overlap && !await askConfirm(T('cfPivotOverwrite'))) return;
  pushUndo();
  growTo(pr+out.length, pc+Math.max(...out.map(r=>r.length)));
  beginBatch();
  out.forEach((line,r)=> line.forEach((v,c)=>{
    setCellRaw(pr+r, pc+c, v==null?'':String(v));
    const k=cellKey(pr+r,pc+c);
    if(r===0 || c===0 || r===out.length-1){ shStyle[k]={...(shStyle[k]||{}), bold:true, bg:(r===0?'#E8EEF7':(shStyle[k]||{}).bg)}; }
    else delete shStyle[k];
  }));
  endBatch();
  renderSheet();
  ancR=pr; ancC=pc; setSel(pr,pc,true);
  msg(T('mPivotDone'));
}

$('fileSheetOpen').onchange = e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      /* 수식 보존: raw 셀에서 f(수식) 우선, 없으면 값 */
      const ref = XLSX.utils.decode_range(ws['!ref']||'A1');
      const nR = ref.e.r+1, nC = ref.e.c+1;
      shRows = Math.max(SH_ROWS_INIT, nR + 50); shCols = Math.max(SH_COLS_INIT, nC + 5);
      shData = Array.from({length:shRows},()=>Array(shCols).fill(''));
      shStyle = {};
      shColW = Array(shCols).fill(SH_DEFAULT_W);
      shUndo=[]; shRedo=[];
      for(let r=0;r<nR;r++) for(let c=0;c<nC;c++){
        const addr = XLSX.utils.encode_cell({r,c});
        const cell = ws[addr];
        if(!cell) continue;
        shData[r][c] = cell.f ? '='+cell.f : (cell.v==null?'':cell.v);
      }
      shMerges = (ws['!merges']||[]).map(m=>({r:m.s.r, c:m.s.c, rs:m.e.r-m.s.r+1, cs:m.e.c-m.s.c+1}))
                  .filter(m=>m.rs>1||m.cs>1);
      buildHF(); selR=0; selC=0; ancR=0; ancC=0; renderSheet();
      msg(f.name + T('mXlsxImported'));

  };

};
/* 표 → 엑셀 저장 (계산된 값 + 수식 함께) */
function sheetToAOA(computed){
  const out=[];
  let maxR=0,maxC=0;
  for(let r=0;r<shRows;r++) for(let c=0;c<shCols;c++) if(shData[r][c]!==''&&shData[r][c]!=null){ maxR=Math.max(maxR,r); maxC=Math.max(maxC,c); }
  for(let r=0;r<=maxR;r++){ const row=[]; for(let c=0;c<=maxC;c++){
    const raw=shData[r][c];
    if(computed && typeof raw==='string' && raw[0]==='='){ const v=cellValue(r,c); const n=toNum(v); row.push(n!=null?n:String(v)); }
    else { const n=toNum(raw); row.push(typeof raw==='string'&&n!=null&&String(raw).trim()!==''?n:raw); }
  } out.push(row); }
  return out;
}

/* ═══════════════ 3D(STEP) 모드 ═══════════════ */
let d3Ready=false, d3Scene=null, d3Cam=null, d3Renderer=null, d3Group=null, d3Wire=false;
let d3Target=null, d3Dist=100, d3Theta=Math.PI/4, d3Phi=Math.PI/3;  /* 궤도 카메라 */
let occtPromise=null, d3FileName='model';

function ensure3d(){
  if(d3Ready) return;
  if(typeof THREE === 'undefined'){ msg(T('m3dNoMod')); return; }
  const area = $('d3Area');
  d3Scene = new THREE.Scene();
  d3Scene.background = new THREE.Color(0xEDEFF2);
  d3Cam = new THREE.PerspectiveCamera(45, 1, 0.1, 100000);
  d3Target = new THREE.Vector3(0,0,0);
  d3Renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
  d3Renderer.setPixelRatio(window.devicePixelRatio||1);
  area.appendChild(d3Renderer.domElement);
  d3Renderer.domElement.id='d3Canvas';
  /* 조명 */
  d3Scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.85));
  const dl = new THREE.DirectionalLight(0xffffff, 0.7); dl.position.set(1,2,1.5); d3Scene.add(dl);
  const dl2 = new THREE.DirectionalLight(0xffffff, 0.3); dl2.position.set(-1.5,-1,-1); d3Scene.add(dl2);
  /* 바닥 격자 */
  const grid = new THREE.GridHelper(200, 20, 0xB9C2CE, 0xD9DDE3);
  grid.name='grid'; d3Scene.add(grid);
  d3Resize();
  window.addEventListener('resize', d3Resize);
  d3Mouse();
  d3Ready = true;
  d3Render();
}
function d3Resize(){
  if(!d3Renderer) return;
  const area = $('d3Area');
  const w = area.clientWidth||800, h = area.clientHeight||500;
  d3Renderer.setSize(w,h);
  d3Cam.aspect = w/h; d3Cam.updateProjectionMatrix();
  d3Render();
}
function d3ApplyOrbit(){
  const sp = Math.sin(d3Phi), r = d3Dist;
  d3Cam.position.set(
    d3Target.x + r*sp*Math.sin(d3Theta),
    d3Target.y + r*Math.cos(d3Phi),
    d3Target.z + r*sp*Math.cos(d3Theta)
  );
  d3Cam.lookAt(d3Target);
}
function d3Render(){ if(!d3Renderer) return; d3ApplyOrbit(); d3Renderer.render(d3Scene, d3Cam); }
/* 마우스: 왼쪽 드래그 회전 / 오른쪽 또는 Shift 드래그 이동 / 휠 확대·축소 */
function d3Mouse(){
  const el = d3Renderer.domElement;
  let drag=null;
  el.addEventListener('contextmenu', e=>e.preventDefault());
  el.addEventListener('mousedown', e=>{
    drag = { x:e.clientX, y:e.clientY, pan:(e.button===2||e.shiftKey) };
    e.preventDefault();
  });
  window.addEventListener('mousemove', e=>{
    if(!drag) return;
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    drag.x=e.clientX; drag.y=e.clientY;
    if(drag.pan){
      const s = d3Dist/600;
      const right = new THREE.Vector3().subVectors(d3Cam.position, d3Target).cross(d3Cam.up).normalize();
      const up = d3Cam.up.clone().normalize();
      d3Target.addScaledVector(right, dx*s).addScaledVector(up, dy*s);
    } else {
      d3Theta -= dx*0.008;
      d3Phi = Math.max(0.05, Math.min(Math.PI-0.05, d3Phi - dy*0.008));
    }
    d3Render();
  });
  window.addEventListener('mouseup', ()=>{ drag=null; });
  el.addEventListener('wheel', e=>{
    e.preventDefault();
    d3Dist *= (e.deltaY>0 ? 1.12 : 0.9);
    d3Render();
  }, {passive:false});
}
/* STEP 파서(OpenCascade WASM) 준비 — 처음 쓸 때 한 번만 내려받음 */
function getOcct(){
  if(occtPromise) return occtPromise;
  if(typeof occtimportjs === 'undefined'){ msg(T('m3dNoOcct')); return null; }
  occtPromise = occtimportjs({
    locateFile: f => 'https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/' + f
  });
  return occtPromise;
}
$('d3Open').onclick = ()=>{
  if(typeof THREE==='undefined'){ msg(T('m3dNoMod')); return; }
  $('fileStepOpen').click();
};
$('fileStepOpen').onchange = e=>{
  const f=e.target.files[0]; if(!f) return;
  d3FileName = f.name.replace(/\.(step|stp)$/i,'');
  const rd=new FileReader();
  rd.onload = async ()=>{
    msg(T('m3dLoading'));
    try{
      const oc = getOcct(); if(!oc) return;
      const occt = await oc;
      const result = occt.ReadStepFile(new Uint8Array(rd.result), null);
      if(!result || !result.success || !result.meshes || !result.meshes.length){ msg(T('m3dFail')); return; }
      loadMeshes(result.meshes);
      msg(f.name + T('m3dOpened'));
    }catch(err){ msg(T('m3dFail') + ' ' + (err.message||'')); }
  };
  rd.readAsArrayBuffer(f); e.target.value='';
};
function loadMeshes(meshes){
  ensure3d();
  if(d3Group){ d3Scene.remove(d3Group); d3Group.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); }); }
  d3Group = new THREE.Group();
  for(const m of meshes){
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(m.attributes.position.array, 3));
    if(m.attributes.normal) g.setAttribute('normal', new THREE.Float32BufferAttribute(m.attributes.normal.array, 3));
    if(m.index) g.setIndex(new THREE.Uint32BufferAttribute(m.index.array, 1));
    if(!m.attributes.normal) g.computeVertexNormals();
    let col = 0x5B7DA6;
    if(m.color && m.color.length===3) col = new THREE.Color(m.color[0], m.color[1], m.color[2]).getHex();
    const mat = new THREE.MeshPhongMaterial({color:col, side:THREE.DoubleSide, wireframe:d3Wire, shininess:40});
    const mesh = new THREE.Mesh(g, mat);
    /* 모서리 선(형상 윤곽) */
    try{
      const edges = new THREE.EdgesGeometry(g, 25);
      mesh.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({color:0x33404F})));
    }catch(e){}
    d3Group.add(mesh);
  }
  d3Scene.add(d3Group);
  $('d3Empty').style.display='none';
  d3Fit();
}
function d3Bounds(){
  if(!d3Group) return null;
  const box = new THREE.Box3().setFromObject(d3Group);
  if(box.isEmpty()) return null;
  return box;
}
function d3Fit(){
  const box = d3Bounds(); if(!box){ d3Render(); return; }
  const c = box.getCenter(new THREE.Vector3());
  const s = box.getSize(new THREE.Vector3()).length();
  d3Target.copy(c);
  d3Dist = Math.max(s*1.4, 1);
  /* 격자를 모델 크기·바닥에 맞춤 */
  const old = d3Scene.getObjectByName('grid');
  if(old) d3Scene.remove(old);
  const gs = Math.pow(10, Math.ceil(Math.log10(Math.max(s,1))));
  const grid = new THREE.GridHelper(gs, 20, 0xB9C2CE, 0xD9DDE3);
  grid.name='grid'; grid.position.y = box.min.y; grid.position.x=c.x; grid.position.z=c.z;
  d3Scene.add(grid);
  d3Render();
}
/* 보기 방향 */
function d3View(theta, phi){ d3Theta=theta; d3Phi=phi; d3Fit(); }
$('d3Front').onclick = ()=> d3View(0, Math.PI/2);            /* 정면(+Z에서) */
$('d3Top').onclick   = ()=> d3View(0, 0.06);                 /* 윗면 */
$('d3Right').onclick = ()=> d3View(Math.PI/2, Math.PI/2);    /* 우측면(+X에서) */
$('d3Iso').onclick   = ()=> d3View(Math.PI/4, Math.PI/3);    /* 등각 */
$('d3FitBtn').onclick = ()=> d3Fit();
$('d3WireBtn').onclick = ()=>{
  d3Wire = !d3Wire;
  if(d3Group) d3Group.traverse(o=>{ if(o.isMesh) o.material.wireframe = d3Wire; });
  d3Render();
};
/* ── PDF 도면 저장: 정면·윗면·우측·등각 4면도 ── */
function d3Shot(theta, phi, w, h){
  const oldW = d3Renderer.domElement.width/(window.devicePixelRatio||1);
  const oldH = d3Renderer.domElement.height/(window.devicePixelRatio||1);
  const oT=d3Theta, oP=d3Phi;
  d3Renderer.setSize(w,h,false);
  d3Cam.aspect=w/h; d3Cam.updateProjectionMatrix();
  d3Theta=theta; d3Phi=phi; d3Render();
  const url = d3Renderer.domElement.toDataURL('image/png');
  d3Theta=oT; d3Phi=oP;
  d3Renderer.setSize(oldW,oldH,false);
  d3Cam.aspect=oldW/oldH; d3Cam.updateProjectionMatrix(); d3Render();
  return url;
}
const asciiOnly = s => String(s).replace(/[^\x20-\x7E]/g,'').trim() || 'model';
$('d3SavePdf').onclick = async ()=>{
  if(!d3Group){ msg(T('m3dOpenFirst')); return; }
  if(typeof PDFLib === 'undefined'){ msg(T('mPdfNoMod')); return; }
  try{
    const views = [
      {n:'FRONT',      t:0,          p:Math.PI/2},
      {n:'TOP',        t:0,          p:0.06},
      {n:'RIGHT SIDE', t:Math.PI/2,  p:Math.PI/2},
      {n:'ISOMETRIC',  t:Math.PI/4,  p:Math.PI/3},
    ];
    const shots = views.map(v=> d3Shot(v.t, v.p, 1000, 700));
    const pdf = await PDFLib.PDFDocument.create();
    const page = pdf.addPage([842, 595]);   /* A4 가로 */
    const font = await pdf.embedFont(PDFLib.StandardFonts.Helvetica);
    const fontB = await pdf.embedFont(PDFLib.StandardFonts.HelveticaBold);
    const M=24, TH=34;
    const cw=(842-M*2)/2, ch=(595-M*2-TH)/2;
    page.drawRectangle({x:M, y:M, width:842-M*2, height:595-M*2, borderColor:PDFLib.rgb(0.2,0.24,0.3), borderWidth:1});
    /* 제목줄 */
    page.drawLine({start:{x:M,y:595-M-TH}, end:{x:842-M,y:595-M-TH}, color:PDFLib.rgb(0.2,0.24,0.3), thickness:1});
    page.drawText(asciiOnly(d3FileName).toUpperCase(), {x:M+12, y:595-M-23, size:13, font:fontB, color:PDFLib.rgb(0.13,0.16,0.2)});
    page.drawText('SCALE: FIT   UNIT: AS MODELED   ' + new Date().toISOString().slice(0,10) + '   DeskHaus', {x:842-M-330, y:595-M-22, size:9, font, color:PDFLib.rgb(0.35,0.4,0.47)});
    /* 4분면 */
    page.drawLine({start:{x:M+cw, y:M}, end:{x:M+cw, y:595-M-TH}, color:PDFLib.rgb(0.75,0.78,0.82), thickness:0.7});
    page.drawLine({start:{x:M, y:M+ch}, end:{x:842-M, y:M+ch}, color:PDFLib.rgb(0.75,0.78,0.82), thickness:0.7});
    for(let i=0;i<4;i++){
      const png = await pdf.embedPng(shots[i]);
      const cx = M + (i%2)*cw, cy = M + (1-Math.floor(i/2))*ch;
      const pad=14, lw=cw-pad*2, lh=ch-pad*2-14;
      const sc = Math.min(lw/png.width, lh/png.height);
      const w=png.width*sc, h=png.height*sc;
      page.drawImage(png, {x:cx+(cw-w)/2, y:cy+12+(ch-12-h)/2, width:w, height:h});
      page.drawText(views[i].n, {x:cx+10, y:cy+7, size:9, font:fontB, color:PDFLib.rgb(0.25,0.3,0.38)});
    }
    const bytes = await pdf.save();
    await download(new Blob([bytes],{type:'application/pdf'}), asciiOnly(d3FileName)+'_drawing.pdf');
  }catch(err){ msg(T('mPdfFail')+(err.message||'')); }
};
/* ── DXF 저장 (삼각형 3DFACE) — AutoCAD 등에서 열어 DWG로 저장 가능 ── */
$('d3SaveDxf').onclick = async ()=>{
  if(!d3Group){ msg(T('m3dOpenFirst')); return; }
  const out = ['0','SECTION','2','HEADER','9','$ACADVER','1','AC1009','0','ENDSEC','0','SECTION','2','ENTITIES'];
  const f6 = x => (Math.round(x*1e6)/1e6).toString();
  let tri = 0;
  d3Group.traverse(o=>{
    if(!o.isMesh) return;
    const pos = o.geometry.getAttribute('position');
    const idx = o.geometry.getIndex();
    const face = (a,b,c)=>{
      out.push('0','3DFACE','8','0');
      const pts = [a,b,c,c];
      for(let k=0;k<4;k++){
        const i = pts[k];
        out.push(String(10+k), f6(pos.getX(i)), String(20+k), f6(pos.getY(i)), String(30+k), f6(pos.getZ(i)));
      }
      tri++;
    };
    if(idx){ for(let i=0;i<idx.count;i+=3) face(idx.getX(i), idx.getX(i+1), idx.getX(i+2)); }
    else{ for(let i=0;i<pos.count;i+=3) face(i,i+1,i+2); }
  });
  out.push('0','ENDSEC','0','EOF','');
  if(!tri){ msg(T('m3dFail')); return; }
  await download(new Blob([out.join('\r\n')],{type:'application/dxf'}), asciiOnly(d3FileName)+'.dxf');
  msg(T('m3dDxfDone'));
};

function openHelp(){
  try{
    const blob = new Blob([buildHelpDoc()], {type:'text/html;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const win = window.open(url, '_blank');
    if(!win){ msg(T('mHelpBlocked')); return; }
    setTimeout(()=> URL.revokeObjectURL(url), 60000);
  }catch(e){ msg(T('mHelpBlocked')); }
}

/* ═══════════════ PDF 모드 ═══════════════ */
let pdfDoc = null;        // pdf.js 문서 객체 (렌더링용)
let pdfBytes = null;      // 원본 바이트 (pdf-lib 편집용)
let pdfPage = 1, pdfTotal = 0, pdfScale = 1;
let pdfWorkerSet = false;

function setPdfWorker(){
  if(pdfWorkerSet || typeof pdfjsLib === 'undefined') return;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  pdfWorkerSet = true;
}
async function loadPdf(bytes){
  if(typeof pdfjsLib === 'undefined'){ msg(T('mPdfNoMod')); return; }
  setPdfWorker();
  pdfBytes = bytes.slice(0);  // 편집용 원본 보관
  pdfDoc = await pdfjsLib.getDocument({data:bytes.slice(0)}).promise;
  pdfTotal = pdfDoc.numPages; pdfPage = 1;
  $('pdfEmpty').style.display='none';
  $('pdfCanvas').style.display='block';
  await renderPdfPage();
}
async function renderPdfPage(){
  if(!pdfDoc) return;
  const page = await pdfDoc.getPage(pdfPage);
  const viewport = page.getViewport({scale: pdfScale * 1.5});  // 1.5=선명도
  const cv = $('pdfCanvas'), ctx = cv.getContext('2d');
  cv.width = viewport.width; cv.height = viewport.height;
  cv.style.width = (viewport.width/1.5)+'px';
  cv.style.height = (viewport.height/1.5)+'px';
  await page.render({canvasContext:ctx, viewport}).promise;
  $('pdfPageInfo').textContent = `${pdfPage} / ${pdfTotal}`;
}
$('pdfOpen').onclick = ()=>{
  if(typeof pdfjsLib === 'undefined'){ msg(T('mPdfNoMod')); return; }
  $('filePdfOpen').click();
};
$('filePdfOpen').onchange = e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async ()=>{ try{ await loadPdf(new Uint8Array(rd.result)); msg(f.name+T('mPdfOpened')); }catch(err){ msg(T('mPdfFail')+err.message); } };
  rd.readAsArrayBuffer(f); e.target.value='';
};
/* 페이지 이동 */
$('pdfPrev').onclick = async ()=>{ if(pdfDoc && pdfPage>1){ pdfPage--; await renderPdfPage(); } };
$('pdfNext').onclick = async ()=>{ if(pdfDoc && pdfPage<pdfTotal){ pdfPage++; await renderPdfPage(); } };
$('pdfZoom').onchange = async e=>{ pdfScale=+e.target.value; await renderPdfPage(); };
/* 이어붙이기 (pdf-lib) */
$('pdfAdd').onclick = ()=>{
  if(!pdfBytes){ msg(T('mPdfOpenFirst')); return; }
  if(typeof PDFLib === 'undefined'){ msg(T('mPdfNoMod')); return; }
  $('filePdfAdd').click();
};
$('filePdfAdd').onchange = e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async ()=>{
    try{
      const base=await PDFLib.PDFDocument.load(pdfBytes);
      const add=await PDFLib.PDFDocument.load(new Uint8Array(rd.result));
      const pages=await base.copyPages(add, add.getPageIndices());
      pages.forEach(p=>base.addPage(p));
      const merged=await base.save();
      await loadPdf(new Uint8Array(merged));
      msg(T('mPdfMerged'));
    }catch(err){ msg(T('mPdfFail')+err.message); }
  };
  rd.readAsArrayBuffer(f); e.target.value='';
};
/* 현재 페이지 → 그림 모드 */
$('pdfToImg').onclick = ()=>{
  if(!pdfDoc){ msg(T('mPdfOpenFirst')); return; }
  const dataURL = $('pdfCanvas').toDataURL('image/png');
  layers=[]; selId=null; docImgTarget=null;
  $('btnApplyDoc').style.display='none';
  setMode('img');
  addImageLayer(dataURL, T('pdfPageLayer')+' '+pdfPage);
  msg(T('mPdfToImg'));
};
/* 현재 페이지 PNG 저장 */
$('pdfExtractPng').onclick = async ()=>{
  if(!pdfDoc){ msg(T('mPdfOpenFirst')); return; }
  $('pdfCanvas').toBlob(b=> download(b, T('fnPdfPage')+pdfPage+'_'+new Date().toISOString().slice(0,10)+'.png'), 'image/png');
};
/* 현재 페이지만 PDF로 저장 (pdf-lib) */
$('pdfSavePage').onclick = async ()=>{
  if(!pdfBytes){ msg(T('mPdfOpenFirst')); return; }
  try{
    const src=await PDFLib.PDFDocument.load(pdfBytes);
    const out=await PDFLib.PDFDocument.create();
    const [pg]=await out.copyPages(src, [pdfPage-1]);
    out.addPage(pg);
    const bytes=await out.save();
    await download(new Blob([bytes],{type:'application/pdf'}), T('fnPdfPage')+pdfPage+'.pdf');
  }catch(err){ msg(T('mPdfFail')+err.message); }
};
/* 전체 PDF 저장 */
$('pdfSaveAll').onclick = async ()=>{
  if(!pdfBytes){ msg(T('mPdfOpenFirst')); return; }
  await download(new Blob([pdfBytes],{type:'application/pdf'}), T('fnPdf')+new Date().toISOString().slice(0,10)+'.pdf');
};
/* 현재 페이지 삭제 (pdf-lib) */
$('pdfDelPage').onclick = async ()=>{
  if(!pdfBytes){ msg(T('mPdfOpenFirst')); return; }
  if(pdfTotal <= 1){ msg(T('mPdfLastPage')); return; }
  if(!await askConfirm(T('cfDelPage').replace('{n}', pdfPage))) return;
  try{
    const src = await PDFLib.PDFDocument.load(pdfBytes);
    src.removePage(pdfPage - 1);
    const bytes = await src.save();
    const keepPage = Math.min(pdfPage, pdfTotal - 1);  /* 삭제 후 볼 페이지 */
    await loadPdf(new Uint8Array(bytes));
    pdfPage = keepPage; await renderPdfPage();
    msg(T('mPdfPageDeleted'));
  }catch(err){ msg(T('mPdfFail') + err.message); }
};

/* ═══════════════ PPT(프레젠테이션) 모드 ═══════════════ */
const PP_W = 960, PP_H = 540;               /* 슬라이드 내부 좌표계 (16:9, 96dpi 기준 10in × 5.625in) */
let ppSlides = [], ppCur = 0, ppSel = null; /* 슬라이드 배열 / 현재 슬라이드 / 선택 요소 id */
let ppZoomV = 'fit', ppEditingEl = null, ppIdSeq = 1;
let ppHist = [], ppHistPos = -1;            /* 실행 취소용 스냅샷 */
const ppNewId = () => 'e' + (ppIdSeq++);

function ppDefaultSlide(layout){
  const s = { bg:'#FFFFFF', notes:'', els:[] };
  if(layout === 'title'){
    s.els.push({id:ppNewId(), type:'text', x:80,  y:185, w:800, h:90,  text:T('ppTitleDefault'), size:44, color:'#22262B', bold:true,  align:'center'});
    s.els.push({id:ppNewId(), type:'text', x:160, y:300, w:640, h:50,  text:T('ppSubDefault'),   size:22, color:'#6B7482', bold:false, align:'center'});
  }else if(layout === 'body'){
    s.els.push({id:ppNewId(), type:'text', x:60, y:38,  w:840, h:70,  text:T('ppTitleDefault'), size:32, color:'#22262B', bold:true,  align:'left'});
    s.els.push({id:ppNewId(), type:'text', x:60, y:130, w:840, h:360, text:T('ppBodyDefault'),  size:20, color:'#22262B', bold:false, align:'left'});
  }
  return s;
}
function ppInit(){
  ppSlides = [ppDefaultSlide('title')];
  ppCur = 0; ppSel = null; ppHist = []; ppHistPos = -1;
  ppSnap(); ppRender();
}
function ensurePpt(){ if(!ppSlides.length) ppInit(); else ppRender(); }
function ppFind(id){ const sl = ppSlides[ppCur]; return sl && sl.els.find(e => e.id === id); }

/* ── 실행 취소 / 다시 실행 (스냅샷) ── */
function ppSnap(){
  ppHist = ppHist.slice(0, ppHistPos + 1);
  ppHist.push(JSON.stringify({s: ppSlides, c: ppCur}));
  if(ppHist.length > 60) ppHist.shift();
  ppHistPos = ppHist.length - 1;
}
function ppRestore(str){
  const o = JSON.parse(str);
  ppSlides = o.s; ppCur = Math.min(o.c, ppSlides.length - 1); ppSel = null;
  const mx = ppSlides.flatMap(s => s.els.map(e => +String(e.id).slice(1) || 0)).reduce((a,b)=>Math.max(a,b), 0);
  ppIdSeq = Math.max(ppIdSeq, mx + 1);
  ppRender();
}
function ppUndo(){ if(ppHistPos > 0){ ppHistPos--; ppRestore(ppHist[ppHistPos]); } }
function ppRedo(){ if(ppHistPos < ppHist.length - 1){ ppHistPos++; ppRestore(ppHist[ppHistPos]); } }
$('ppUndo').onclick = ppUndo;
$('ppRedo').onclick = ppRedo;

/* ── 렌더링 ── */
function ppScale(){
  if(ppZoomV !== 'fit') return +ppZoomV;
  const a = $('ppStageArea');
  const w = Math.max(120, a.clientWidth - 50), h = Math.max(90, a.clientHeight - 50);
  return Math.max(.2, Math.min(w / PP_W, h / PP_H, 1.5));
}
function ppBuildEl(el, inter){
  const d = document.createElement('div');
  if(el.type === 'image'){
    const im = document.createElement('img');
    im.src = el.src; im.draggable = false;
    im.style.cssText = 'width:100%;height:100%;object-fit:fill;pointer-events:none;display:block;';
    d.appendChild(im);
  }else if(el.type === 'shape'){
    d.style.background = el.fill;
    if(el.shape === 'ellipse') d.style.borderRadius = '50%';
  }else{
    d.textContent = el.text;
    d.style.cssText = `font-size:${el.size}px; color:${el.color}; font-weight:${el.bold?700:400}; text-align:${el.align}; line-height:1.35; white-space:pre-wrap; word-break:break-word; overflow:hidden;`;
  }
  d.classList.add('ppEl');
  if(inter && ppSel === el.id) d.classList.add('sel');
  d.dataset.id = el.id;
  d.style.position = 'absolute';
  d.style.left = el.x+'px'; d.style.top = el.y+'px';
  d.style.width = el.w+'px'; d.style.height = el.h+'px';
  if(inter && ppSel === el.id){
    const h = document.createElement('div'); h.className = 'pph'; d.appendChild(h);
  }
  return d;
}
function ppRenderStage(){
  const sc = ppScale();
  $('ppStageBox').style.width = (PP_W*sc)+'px';
  $('ppStageBox').style.height = (PP_H*sc)+'px';
  const st = $('ppStage');
  st.style.transform = `scale(${sc})`;
  st.innerHTML = '';
  const sl = ppSlides[ppCur]; if(!sl) return;
  st.style.background = sl.bg;
  sl.els.forEach(el => st.appendChild(ppBuildEl(el, true)));
}
function ppRenderList(){
  const list = $('ppList'); list.innerHTML = '';
  ppSlides.forEach((sl, i) => {
    const it = document.createElement('div');
    it.className = 'ppThumb' + (i === ppCur ? ' sel' : '');
    const num = document.createElement('div'); num.className = 'ppThumbNum'; num.textContent = i + 1;
    const box = document.createElement('div'); box.className = 'ppMiniBox';
    const mini = document.createElement('div'); mini.className = 'ppMini';
    mini.style.background = sl.bg;
    mini.style.transform = 'scale(' + (144 / PP_W) + ')';
    sl.els.forEach(el => mini.appendChild(ppBuildEl(el, false)));
    box.appendChild(mini);
    it.appendChild(num); it.appendChild(box);
    it.onclick = () => { ppCur = i; ppSel = null; ppRender(); };
    list.appendChild(it);
  });
}
function ppRenderNotes(){ const sl = ppSlides[ppCur]; $('ppNotes').value = sl ? sl.notes : ''; }
function ppSyncToolbar(){
  const el = ppSel ? ppFind(ppSel) : null;
  $('ppFontSize').value = (el && el.type === 'text') ? el.size : '';
  if(el && el.type === 'text') $('ppColor').value = el.color;
  if(el && el.type === 'shape') $('ppFill').value = el.fill;
  const sl = ppSlides[ppCur]; if(sl) $('ppBg').value = sl.bg;
}
function ppRender(){ ppRenderStage(); ppRenderList(); ppRenderNotes(); ppSyncToolbar(); }
function ppUpdateElDom(el){
  const d = $('ppStage').querySelector(`[data-id="${el.id}"]`); if(!d) return;
  d.style.left = el.x+'px'; d.style.top = el.y+'px';
  d.style.width = el.w+'px'; d.style.height = el.h+'px';
}
function ppSelect(id){ if(ppSel === id) return; ppSel = id; ppRenderStage(); ppSyncToolbar(); }
/* 편집 중인 텍스트가 있으면 내용 저장 */
function ppCommitEditing(){
  if(!ppEditingEl) return;
  const d = $('ppStage').querySelector(`[data-id="${ppEditingEl}"]`);
  if(d && d.onblur) d.onblur();
}

/* ── 무대(편집 영역) 상호작용: 이동·크기 조절·텍스트 편집 ── */
let ppDrag = null;
$('ppStage').addEventListener('mousedown', e => {
  const handle = e.target.closest('.pph');
  const elD = e.target.closest('.ppEl');
  if(!elD){ ppCommitEditing(); ppSelect(null); return; }
  const id = elD.dataset.id;
  if(ppEditingEl === id) return;                 /* 글 입력 중이면 그대로 둠 */
  if(ppEditingEl && ppEditingEl !== id) ppCommitEditing();
  ppSelect(id);
  const el = ppFind(id); if(!el) return;
  ppDrag = { el, mode: handle ? 'resize' : 'move', sx:e.clientX, sy:e.clientY,
             ox:el.x, oy:el.y, ow:el.w, oh:el.h, sc: ppScale(), moved:false };
  e.preventDefault();
});
window.addEventListener('mousemove', e => {
  if(!ppDrag) return;
  const dx = (e.clientX - ppDrag.sx) / ppDrag.sc, dy = (e.clientY - ppDrag.sy) / ppDrag.sc;
  if(Math.abs(dx) + Math.abs(dy) > 1) ppDrag.moved = true;
  const el = ppDrag.el;
  if(ppDrag.mode === 'move'){ el.x = Math.round(ppDrag.ox + dx); el.y = Math.round(ppDrag.oy + dy); }
  else { el.w = Math.max(20, Math.round(ppDrag.ow + dx)); el.h = Math.max(16, Math.round(ppDrag.oh + dy)); }
  ppUpdateElDom(el);
});
window.addEventListener('mouseup', () => {
  if(ppDrag){ if(ppDrag.moved){ ppSnap(); ppRenderList(); } ppDrag = null; }
});
$('ppStage').addEventListener('dblclick', e => {
  const d = e.target.closest('.ppEl'); if(!d) return;
  const el = ppFind(d.dataset.id);
  if(!el || el.type !== 'text') return;
  ppEditingEl = el.id;
  const hh = d.querySelector('.pph'); if(hh) hh.remove();
  d.contentEditable = 'true'; d.focus();
  document.execCommand('selectAll', false, null);
  d.onblur = () => {
    d.contentEditable = 'false'; d.onblur = null;
    el.text = d.innerText.replace(/\n$/, '');
    ppEditingEl = null;
    ppSnap(); ppRender();
  };
});
$('ppNotes').onchange = e => { const sl = ppSlides[ppCur]; if(sl){ sl.notes = e.target.value; ppSnap(); } };

/* ── 키보드: Delete 삭제 · 방향키 이동 · Ctrl+Z/Y ── */
document.addEventListener('keydown', e => {
  if(!$('modePpt').classList.contains('active')) return;
  if($('ppShow').style.display === 'flex') return;
  const ae = document.activeElement;
  if(ppEditingEl || (ae && (/INPUT|TEXTAREA|SELECT/.test(ae.tagName) || ae.isContentEditable))) return;
  if((e.key === 'Delete' || e.key === 'Backspace') && ppSel){
    const sl = ppSlides[ppCur];
    sl.els = sl.els.filter(x => x.id !== ppSel);
    ppSel = null; ppSnap(); ppRender(); e.preventDefault();
  }else if(e.key.startsWith('Arrow') && ppSel){
    const el = ppFind(ppSel); if(!el) return;
    const st = e.shiftKey ? 10 : 2;
    if(e.key === 'ArrowLeft') el.x -= st;
    if(e.key === 'ArrowRight') el.x += st;
    if(e.key === 'ArrowUp') el.y -= st;
    if(e.key === 'ArrowDown') el.y += st;
    ppUpdateElDom(el); ppSnap(); e.preventDefault();
  }else if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){
    e.shiftKey ? ppRedo() : ppUndo(); e.preventDefault();
  }else if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y'){
    ppRedo(); e.preventDefault();
  }
});

/* ── 슬라이드 관리 ── */
$('ppNew').onclick = async () => {
  if(ppSlides.length && !await askConfirm(T('cfNewPpt'))) return;
  ppInit(); msg(T('mNewPpt'));
};
$('ppAddSlide').onclick = () => {
  ppCommitEditing();
  ppSlides.splice(ppCur + 1, 0, ppDefaultSlide($('ppLayout').value));
  ppCur++; ppSel = null; ppSnap(); ppRender();
};
$('ppDupSlide').onclick = () => {
  ppCommitEditing();
  const sl = ppSlides[ppCur]; if(!sl) return;
  const copy = JSON.parse(JSON.stringify(sl));
  copy.els.forEach(el => el.id = ppNewId());
  ppSlides.splice(ppCur + 1, 0, copy);
  ppCur++; ppSel = null; ppSnap(); ppRender();
};
$('ppDelSlide').onclick = async () => {
  if(!ppSlides.length) return;
  if(!await askConfirm(T('cfDelSlide').replace('{n}', ppCur + 1))) return;
  ppSlides.splice(ppCur, 1);
  if(!ppSlides.length) ppSlides.push(ppDefaultSlide('blank'));
  ppCur = Math.min(ppCur, ppSlides.length - 1);
  ppSel = null; ppSnap(); ppRender(); msg(T('mSlideDeleted'));
};
$('ppUpSlide').onclick = () => {
  if(ppCur <= 0) return;
  [ppSlides[ppCur-1], ppSlides[ppCur]] = [ppSlides[ppCur], ppSlides[ppCur-1]];
  ppCur--; ppSnap(); ppRender();
};
$('ppDownSlide').onclick = () => {
  if(ppCur >= ppSlides.length - 1) return;
  [ppSlides[ppCur+1], ppSlides[ppCur]] = [ppSlides[ppCur], ppSlides[ppCur+1]];
  ppCur++; ppSnap(); ppRender();
};

/* ── 요소 추가 ── */
$('ppAddText').onclick = () => {
  const el = {id:ppNewId(), type:'text', x:280, y:220, w:400, h:60, text:T('txtDefault'), size:24, color:'#22262B', bold:false, align:'left'};
  ppSlides[ppCur].els.push(el); ppSel = el.id; ppSnap(); ppRender();
};
$('ppAddImg').onclick = () => $('filePptImg').click();
$('filePptImg').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const w = Math.min(420, im.width || 420);
      const h = Math.max(20, Math.round(w * (im.height || 300) / (im.width || 400)));
      const el = {id:ppNewId(), type:'image', x:Math.round((PP_W-w)/2), y:Math.max(10, Math.round((PP_H-h)/2)), w, h, src:rd.result};
      ppSlides[ppCur].els.push(el); ppSel = el.id; ppSnap(); ppRender();
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(f); e.target.value = '';
};
$('ppAddShape').onclick = () => {
  const el = {id:ppNewId(), type:'shape', shape:$('ppShapeSel').value, x:360, y:190, w:240, h:160, fill:$('ppFill').value};
  ppSlides[ppCur].els.push(el); ppSel = el.id; ppSnap(); ppRender();
};

/* ── 선택 요소 서식 ── */
$('ppFontSize').onchange = e => {
  const el = ppSel && ppFind(ppSel);
  if(el && el.type === 'text'){ el.size = Math.max(8, Math.min(200, +e.target.value || el.size)); ppSnap(); ppRender(); }
};
$('ppBold').onclick = () => {
  const el = ppSel && ppFind(ppSel);
  if(el && el.type === 'text'){ el.bold = !el.bold; ppSnap(); ppRender(); }
};
$('ppColor').onchange = e => {
  const el = ppSel && ppFind(ppSel);
  if(el && el.type === 'text'){ el.color = e.target.value; ppSnap(); ppRender(); }
};
document.querySelectorAll('#tbPpt [data-ppalign]').forEach(b => b.onclick = () => {
  const el = ppSel && ppFind(ppSel);
  if(el && el.type === 'text'){ el.align = b.dataset.ppalign; ppSnap(); ppRender(); }
});
$('ppFill').onchange = e => {
  const el = ppSel && ppFind(ppSel);
  if(el && el.type === 'shape'){ el.fill = e.target.value; ppSnap(); ppRender(); }
};
$('ppBg').onchange = e => {
  const sl = ppSlides[ppCur];
  if(sl){ sl.bg = e.target.value; ppSnap(); ppRender(); }
};
$('ppZoom').onchange = e => { ppZoomV = e.target.value; ppRenderStage(); };
window.addEventListener('resize', () => {
  if($('modePpt').classList.contains('active') && ppZoomV === 'fit') ppRenderStage();
  if($('ppShow').style.display === 'flex') ppShowRender();
});

/* ── 슬라이드쇼 ── */
let ppShowIdx = 0;
function ppShowRender(){
  const sl = ppSlides[ppShowIdx]; if(!sl) return;
  const box = $('ppShowSlide'); box.innerHTML = '';
  const sc = Math.min(window.innerWidth / PP_W, window.innerHeight / PP_H);
  box.style.width = (PP_W*sc)+'px'; box.style.height = (PP_H*sc)+'px';
  const st = document.createElement('div');
  st.style.cssText = `width:${PP_W}px; height:${PP_H}px; transform:scale(${sc}); transform-origin:top left; position:relative; background:${sl.bg}; overflow:hidden;`;
  sl.els.forEach(el => st.appendChild(ppBuildEl(el, false)));
  box.appendChild(st);
  $('ppShowNum').textContent = (ppShowIdx + 1) + ' / ' + ppSlides.length;
}
function ppStartShow(){
  if(!ppSlides.length) return;
  ppCommitEditing();
  ppShowIdx = ppCur;
  $('ppShow').style.display = 'flex';
  ppShowRender();
  msg(T('ppShowTip'));
  if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
}
function ppEndShow(){
  $('ppShow').style.display = 'none';
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}
function ppShowNext(){ if(ppShowIdx < ppSlides.length - 1){ ppShowIdx++; ppShowRender(); } else ppEndShow(); }
function ppShowPrevF(){ if(ppShowIdx > 0){ ppShowIdx--; ppShowRender(); } }
$('ppStartShow').onclick = ppStartShow;
$('ppShowExit').onclick = ppEndShow;
$('ppShowNext').onclick = ppShowNext;
$('ppShowPrev').onclick = ppShowPrevF;
$('ppShowSlide').onclick = ppShowNext;
document.addEventListener('keydown', e => {
  if($('ppShow').style.display !== 'flex') return;
  if(e.key === 'Escape'){ ppEndShow(); }
  else if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){ ppShowNext(); e.preventDefault(); }
  else if(['ArrowLeft','PageUp'].includes(e.key)){ ppShowPrevF(); e.preventDefault(); }
}, true);
document.addEventListener('fullscreenchange', () => {
  if(!document.fullscreenElement && $('ppShow').style.display === 'flex') $('ppShow').style.display = 'none';
});

/* ── 현재 슬라이드 → PNG (직접 캔버스에 그림) ── */
function ppLoadImg(src){ return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }
function ppWrap(c, text, w){
  if(text === '') return [''];
  const out = []; let cur = '';
  for(const word of text.split(' ')){
    const t = cur ? cur + ' ' + word : word;
    if(c.measureText(t).width <= w){ cur = t; continue; }
    if(cur){ out.push(cur); cur = ''; }
    if(c.measureText(word).width <= w){ cur = word; continue; }
    let seg = '';
    for(const ch of word){
      if(!seg || c.measureText(seg + ch).width <= w) seg += ch;
      else { out.push(seg); seg = ch; }
    }
    cur = seg;
  }
  out.push(cur);
  return out;
}
async function ppSlideToCanvas(sl, scale){
  const cvv = document.createElement('canvas');
  cvv.width = PP_W * scale; cvv.height = PP_H * scale;
  const c = cvv.getContext('2d'); c.scale(scale, scale);
  c.fillStyle = sl.bg; c.fillRect(0, 0, PP_W, PP_H);
  for(const el of sl.els){
    if(el.type === 'shape'){
      c.fillStyle = el.fill;
      if(el.shape === 'ellipse'){ c.beginPath(); c.ellipse(el.x + el.w/2, el.y + el.h/2, el.w/2, el.h/2, 0, 0, Math.PI*2); c.fill(); }
      else c.fillRect(el.x, el.y, el.w, el.h);
    }else if(el.type === 'image'){
      try{ const im = await ppLoadImg(el.src); c.drawImage(im, el.x, el.y, el.w, el.h); }catch(e){}
    }else{
      c.fillStyle = el.color;
      c.font = `${el.bold ? '700' : '400'} ${el.size}px 'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif`;
      c.textBaseline = 'top';
      const lh = el.size * 1.35;
      let y = el.y + (lh - el.size) / 2;
      for(const para of String(el.text).split('\n')){
        for(const ln of ppWrap(c, para, el.w)){
          let x = el.x;
          const wpx = c.measureText(ln).width;
          if(el.align === 'center') x = el.x + (el.w - wpx) / 2;
          else if(el.align === 'right') x = el.x + el.w - wpx;
          c.fillText(ln, x, y);
          y += lh;
        }
      }
    }
  }
  return cvv;
}
$('ppPng').onclick = async () => {
  const sl = ppSlides[ppCur]; if(!sl) return;
  ppCommitEditing();
  try{
    const cvv = await ppSlideToCanvas(sl, 2);
    cvv.toBlob(b => download(b, T('fnSlide') + (ppCur + 1) + '_' + new Date().toISOString().slice(0,10) + '.png'), 'image/png');
  }catch(err){ msg(T('mExportFail') + err.message); }
};

/* ── PPTX로 저장 (PptxGenJS) ── */
$('ppSave').onclick = async () => {
  if(typeof PptxGenJS === 'undefined'){ msg(T('mPptNoMod')); return; }
  if(!ppSlides.length){ msg(T('mPptNoSlides')); return; }
  ppCommitEditing();
  try{
    const pres = new PptxGenJS();
    pres.layout = 'LAYOUT_16x9';                 /* 10in × 5.625in = 960 × 540 px */
    const K = 1 / 96;                            /* px → inch */
    ppSlides.forEach(sl => {
      const s = pres.addSlide();
      s.background = { color: sl.bg.replace('#','') };
      sl.els.forEach(el => {
        const box = { x: el.x*K, y: el.y*K, w: el.w*K, h: el.h*K };
        if(el.type === 'shape'){
          s.addShape(el.shape === 'ellipse' ? 'ellipse' : 'rect',
            Object.assign({}, box, { fill:{color: el.fill.replace('#','')}, line:{type:'none'} }));
        }else if(el.type === 'image'){
          s.addImage(Object.assign({ data: el.src }, box));
        }else{
          s.addText(el.text, Object.assign({}, box, {
            fontSize: Math.max(6, Math.round(el.size * 0.75)),
            color: el.color.replace('#',''), bold: !!el.bold,
            align: el.align, valign: 'top',
            fontFace: LANG === 'ko' ? 'Malgun Gothic' : 'Segoe UI'
          }));
        }
      });
      if(sl.notes) s.addNotes(sl.notes);
    });
    const blob = await pres.write('blob');
    await download(blob, T('fnPpt') + new Date().toISOString().slice(0,10) + '.pptx');
    msg(T('mPptSaved'));
  }catch(err){ msg(T('mPptFail') + err.message); }
};

/* ── PPTX 열기 (JSZip으로 직접 해석 — 텍스트·이미지·도형·배경) ── */
function ppLoc(node, name){ return [...node.getElementsByTagName('*')].filter(n => n.localName === name); }
async function importPptx(buf){
  const zip = await JSZip.loadAsync(buf);
  const presFile = zip.file('ppt/presentation.xml');
  if(!presFile) throw new Error('presentation.xml');
  const presX = await presFile.async('string');
  const mSz = presX.match(/sldSz[^>]*cx="(\d+)"[^>]*cy="(\d+)"/);
  const cx = mSz ? +mSz[1] : 12192000, cy = mSz ? +mSz[2] : 6858000;
  const kx = PP_W / cx, ky = PP_H / cy;
  const names = Object.keys(zip.files)
    .filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a,b) => +a.match(/(\d+)\.xml/)[1] - +b.match(/(\d+)\.xml/)[1]);
  if(!names.length) throw new Error(T('mPptNoSlides'));
  const parser = new DOMParser();
  const RNS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const out = [];
  for(const nm of names){
    const num = nm.match(/(\d+)\.xml/)[1];
    const xml = parser.parseFromString(await zip.file(nm).async('string'), 'application/xml');
    /* 이미지 관계(rels) */
    const rels = {};
    const rf = zip.file(`ppt/slides/_rels/slide${num}.xml.rels`);
    if(rf){
      const rx = parser.parseFromString(await rf.async('string'), 'application/xml');
      [...rx.getElementsByTagName('Relationship')].forEach(r => rels[r.getAttribute('Id')] = r.getAttribute('Target'));
    }
    const sl = { bg:'#FFFFFF', notes:'', els:[] };
    const bg = ppLoc(xml.documentElement, 'bg')[0];
    if(bg){ const cNode = ppLoc(bg, 'srgbClr')[0]; if(cNode) sl.bg = '#' + cNode.getAttribute('val'); }
    const tree = ppLoc(xml.documentElement, 'spTree')[0];
    if(tree) for(const node of [...tree.children]){
      const ln = node.localName;
      if(ln !== 'sp' && ln !== 'pic') continue;
      const xf = ppLoc(node, 'xfrm')[0]; if(!xf) continue;
      const off = ppLoc(xf, 'off')[0], ext = ppLoc(xf, 'ext')[0];
      if(!off || !ext) continue;
      const x = Math.round(+off.getAttribute('x') * kx), y = Math.round(+off.getAttribute('y') * ky);
      const w = Math.max(10, Math.round(+ext.getAttribute('cx') * kx));
      const h = Math.max(10, Math.round(+ext.getAttribute('cy') * ky));
      if(ln === 'pic'){
        const blip = ppLoc(node, 'blip')[0]; if(!blip) continue;
        const rid = blip.getAttribute('r:embed') || blip.getAttributeNS(RNS, 'embed');
        const tgt = rels[rid]; if(!tgt) continue;
        const path = 'ppt/' + tgt.replace(/^(\.\.\/)+/, '');
        const ext2 = path.split('.').pop().toLowerCase();
        const mime = {png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', bmp:'image/bmp', webp:'image/webp', svg:'image/svg+xml'}[ext2];
        const mf = zip.file(path);
        if(!mime || !mf) continue;               /* emf·wmf 등은 건너뜀 */
        const b64 = await mf.async('base64');
        sl.els.push({id:ppNewId(), type:'image', x, y, w, h, src:`data:${mime};base64,${b64}`});
      }else{
        const txBody = ppLoc(node, 'txBody')[0];
        const paras = txBody ? ppLoc(txBody, 'p') : [];
        const text = paras.map(p => ppLoc(p, 't').map(t => t.textContent).join('')).join('\n');
        if(text.trim()){
          const rpr = ppLoc(node, 'rPr').find(r => r.getAttribute('sz')) || ppLoc(node, 'rPr')[0] || null;
          let szPt = 18, color = '#22262B', bold = false;
          if(rpr){
            if(rpr.getAttribute('sz')) szPt = +rpr.getAttribute('sz') / 100;
            bold = rpr.getAttribute('b') === '1';
            const cNode = ppLoc(rpr, 'srgbClr')[0]; if(cNode) color = '#' + cNode.getAttribute('val');
          }
          const ppr = ppLoc(node, 'pPr').find(p => p.getAttribute('algn'));
          const align = {ctr:'center', r:'right', l:'left', just:'left'}[ppr ? ppr.getAttribute('algn') : 'l'] || 'left';
          sl.els.push({id:ppNewId(), type:'text', x, y, w, h, text, size:Math.max(8, Math.round(szPt / 0.75)), color, bold, align});
        }else{
          const spPr = ppLoc(node, 'spPr')[0];
          const fillC = spPr ? ppLoc(spPr, 'srgbClr')[0] : null;
          if(fillC){
            const prst = ppLoc(node, 'prstGeom')[0];
            const shape = (prst && prst.getAttribute('prst') === 'ellipse') ? 'ellipse' : 'rect';
            sl.els.push({id:ppNewId(), type:'shape', shape, x, y, w, h, fill:'#' + fillC.getAttribute('val')});
          }
        }
      }
    }
    out.push(sl);
  }
  ppSlides = out; ppCur = 0; ppSel = null;
  ppHist = []; ppHistPos = -1; ppSnap(); ppRender();
}
$('ppOpen').onclick = () => {
  if(typeof JSZip === 'undefined'){ msg(T('mPptNoMod')); return; }
  $('filePptOpen').click();
};
$('filePptOpen').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = async () => {
    try{
      await importPptx(rd.result);
      setMode('ppt');
      msg(f.name + T('mPdfOpened') + ' ' + T('mPptImportNote'));
    }catch(err){ msg(T('mPptFail') + (err.message || err)); }
  };
  rd.readAsArrayBuffer(f); e.target.value = '';
};

/* URL의 ?lang=en / ?lang=ko를 최우선 적용하고, 없으면 브라우저 기본 언어를 따름 */
const requestedLang = new URLSearchParams(window.location.search).get('lang');
if(requestedLang === 'en' || requestedLang === 'ko') {
  LANG = requestedLang;
} else {
  const browserLang = ((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase();
  LANG = browserLang.startsWith('ko') ? 'ko' : 'en';
}
loadLetterhead();
fillWelcome();
applyLang();

/* 초기화 */
applyZoom(); render(); renderPanel();
