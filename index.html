<title>DeskHaus — 하나로 쓰는 사무 도구</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hyperformula/dist/hyperformula.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.11.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
<style>
  :root{
    --bg:#EDEFF2; --panel:#FFFFFF; --ink:#22262B; --muted:#6B7482;
    --line:#D9DDE3; --accent:#1F4E8C; --accent-soft:#E8EEF7; --danger:#B4402F;
    --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px;
    display:flex; flex-direction:column; overflow:hidden;
  }
  /* ── 상단 바 ── */
  header{
    display:flex; align-items:flex-end; gap:24px;
    padding:14px 20px 0; background:var(--panel); border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .brand{display:flex; align-items:center; gap:8px; padding-bottom:12px;}
  .brand .mark{
    width:26px; height:26px; border-radius:7px; background:var(--accent);
    color:#fff; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center;
  }
  .brand b{font-size:15px; letter-spacing:.2px;}
  .brand span{font-size:12px; color:var(--muted);}
  .tabs{display:flex; gap:4px;}
  .tab{
    border:1px solid var(--line); border-bottom:none; background:#F3F5F8;
    padding:9px 22px 11px; border-radius:10px 10px 0 0; cursor:pointer;
    font-size:14px; color:var(--muted); position:relative; top:1px;
  }
  .tab.active{background:var(--bg); color:var(--ink); font-weight:600; border-color:var(--line);}
  .tab .dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:7px; background:#C3C9D2;}
  .tab.active .dot{background:var(--accent);}

  /* ── 공통 툴바 ── */
  .toolbar{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .toolbar .sep{width:1px; height:22px; background:var(--line); margin:0 4px;}
  button, select, input[type=color]{
    font-family:inherit; font-size:13px; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:7px;
    padding:5px 10px; cursor:pointer;
  }
  button:hover{border-color:var(--accent); color:var(--accent);}
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  button.primary:hover{background:#173D70; color:#fff;}
  button.newbtn{background:#B22234; color:#fff; border-color:#B22234; font-weight:600;}
  button.newbtn:hover{background:#8E1B29; color:#fff; border-color:#8E1B29;}
  button.icon{min-width:32px; font-weight:600;}
  button.danger:hover{border-color:var(--danger); color:var(--danger);}
  select{padding:5px 6px;}
  input[type=color]{padding:1px 2px; width:34px; height:29px;}
  label.small{font-size:12px; color:var(--muted);}

  main{flex:1; display:flex; overflow:hidden;}
  .mode{flex:1; display:none; overflow:hidden;}
  .mode.active{display:flex;}

  /* 표(스프레드시트) 모드 */
  #sheetWrap{ flex:1; display:flex; flex-direction:column; overflow:hidden; background:#fff; }
  #formulaBar{
    display:flex; align-items:center; gap:0; border-bottom:1px solid var(--line);
    background:var(--panel); flex-shrink:0;
  }
  #cellRef{
    width:70px; text-align:center; font-weight:600; font-size:13px; color:var(--accent);
    padding:7px 0; border-right:1px solid var(--line); flex-shrink:0;
  }
  #formulaInput{
    flex:1; border:none; outline:none; padding:7px 12px; font-size:14px;
    font-family:'Segoe UI','Malgun Gothic',sans-serif; background:transparent;
  }
  #sheetScroll{ flex:1; overflow:auto; }
  #sheetTable{ border-collapse:collapse; table-layout:fixed; }
  #sheetTable th, #sheetTable td{
    border:1px solid #D5DAE1; padding:0; height:26px; overflow:hidden;
  }
  #sheetTable thead th, #sheetTable tbody th{
    background:#F0F3F7; color:var(--muted); font-weight:600; font-size:12px;
    text-align:center; user-select:none; position:sticky; z-index:1;
  }
  #sheetTable thead th{ top:0; min-width:90px; }
  #sheetTable tbody th{ left:0; width:44px; min-width:44px; }
  #sheetTable thead th:first-child{ left:0; z-index:2; width:44px; min-width:44px; }
  #sheetTable td{
    background:#fff; font-size:13px; cursor:cell; padding:2px 6px;
    white-space:nowrap; color:var(--ink);
  }
  #sheetTable td.sel{ outline:2px solid var(--accent); outline-offset:-2px; }
  #sheetTable td.editing{ background:#fff; }

  /* PDF 모드 */
  #pdfArea{ flex:1; overflow:auto; display:flex; align-items:flex-start; justify-content:center; padding:26px; background:var(--bg); }
  #pdfCanvas{ background:#fff; box-shadow:0 2px 14px rgba(30,40,60,.12); }
  #pdfEmpty{ color:var(--muted); font-size:14px; margin-top:80px; }

  /* ── 글 모드 ── */
  #docScroll{flex:1; overflow:auto; padding:28px 0 60px;}
  .page{
    width:210mm; min-height:297mm; margin:0 auto; background:#fff;
    border:1px solid var(--line); box-shadow:0 2px 14px rgba(30,40,60,.08);
    padding:25mm 20mm; outline:none; line-height:1.7;
    box-sizing:border-box;
  }
  /* 레터헤드 */
  #letterhead{
    display:flex; align-items:center; gap:20px;
    padding-bottom:18px; margin-bottom:26px; border-bottom:2px solid var(--accent);
    position:relative;
  }
  #letterhead.collapsed{ display:none; }
  #lhLogoBox{
    width:88px; height:88px; flex-shrink:0; border:1px dashed var(--line);
    border-radius:8px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; overflow:hidden; background:#FAFBFC; transition:border-color .15s;
  }
  #lhLogoBox:hover{ border-color:var(--accent); }
  #lhLogoBox img{ width:100%; height:100%; object-fit:contain; }
  #lhLogoPlaceholder{ font-size:12px; color:var(--muted); text-align:center; }
  #lhInfo{ flex:1; min-width:0; }
  #lhName{
    font-size:22px; font-weight:700; color:var(--ink); outline:none;
    padding:2px 4px; border-radius:4px; margin-bottom:4px;
  }
  #lhContact{ display:flex; flex-wrap:wrap; gap:4px 18px; font-size:13px; color:var(--muted); }
  #lhContact span{ outline:none; padding:1px 4px; border-radius:4px; }
  #lhName:focus, #lhContact span:focus{ background:var(--accent-soft); }
  /* 빈 편집영역 placeholder */
  [contenteditable][data-ph]:empty:before{
    content:attr(data-ph); color:#AEB6C2; cursor:text;
  }
  #lhToggle{
    position:absolute; top:-6px; right:-6px; width:24px; height:24px; min-width:0;
    padding:0; border-radius:50%; font-size:14px; line-height:1; color:var(--muted);
  }
  #lhShow{
    display:block; margin-bottom:20px; font-size:12px; color:var(--muted);
    padding:5px 12px; border:1px dashed var(--line); background:#FAFBFC;
  }
  #lhShow:hover{ border-color:var(--accent); color:var(--accent); }
  .page h1{font-size:26px; margin:14px 0 8px;}
  .page h2{font-size:20px; margin:12px 0 6px;}
  .page p{margin:4px 0;}
  .page ul,.page ol{margin:6px 0 6px 24px;}
  .page table{border-collapse:collapse; margin:10px 0; width:100%;}
  .page td,.page th{border:1px solid #B9C0CA; padding:6px 9px; min-width:40px; text-align:center; vertical-align:middle;}
  .page th{background:#F0F3F7; font-weight:600;}
  .page img{max-width:100%; cursor:pointer; border-radius:2px;}
  .page img.sized{max-width:none;}
  .page img:hover{outline:2px solid var(--accent); outline-offset:2px;}

  /* 상태 바 */
  footer{
    display:flex; align-items:center; gap:18px; padding:6px 16px;
    background:var(--panel); border-top:1px solid var(--line);
    font-size:12px; color:var(--muted); flex-shrink:0; min-height:30px;
  }
  footer .calc{color:var(--accent); font-weight:600;}
  footer .hint{margin-left:auto;}

  /* ── 그림 모드 ── */
  #imgWrap{flex:1; display:flex; overflow:hidden;}
  #canvasArea{flex:1; overflow:auto; display:flex; align-items:flex-start; justify-content:center; padding:26px;}
  #canvasBox{position:relative; box-shadow:0 2px 14px rgba(30,40,60,.12); flex-shrink:0;}
  #cv{display:block; background:transparent;}
  #cropLayer{position:absolute; inset:0; cursor:crosshair; display:none;}

  /* 레이어 패널 */
  aside{
    width:250px; background:var(--panel); border-left:1px solid var(--line);
    display:flex; flex-direction:column; flex-shrink:0;
  }
  aside h3{
    font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.6px;
    padding:12px 14px 8px; border-bottom:1px solid var(--line);
  }
  #layerList{flex:1; overflow:auto; padding:8px;}
  .layer{
    display:flex; align-items:center; gap:8px; padding:8px 9px; margin-bottom:5px;
    border:1px solid var(--line); border-radius:8px; cursor:pointer; background:#fff;
  }
  .layer.sel{border-color:var(--accent); background:var(--accent-soft);}
  .layer .thumb{
    width:34px; height:26px; border:1px solid var(--line); border-radius:4px;
    background:#fff center/cover no-repeat; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted); overflow:hidden;
  }
  .layer .nm{flex:1; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .layer .eye{border:none; background:none; padding:2px 4px; font-size:14px;}
  #layerCtrl{padding:10px 12px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px;}
  #layerCtrl .row{display:flex; gap:6px; align-items:center;}
  #layerCtrl input[type=range]{flex:1;}
  #layerCtrl .row button{flex:1; padding:4px 0;}

  /* 다이얼로그 */
  dialog{
    border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px;
    box-shadow:0 8px 30px rgba(20,30,50,.2); min-width:300px;
  }
  dialog::backdrop{background:rgba(30,38,50,.35);}
  dialog h4{font-size:15px; margin-bottom:14px;}
  dialog .frow{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  dialog .frow label{width:64px; font-size:13px; color:var(--muted);}
  dialog input[type=number], dialog input[type=text]{
    flex:1; border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:13px; font-family:inherit;
  }
  dialog .btns{display:flex; justify-content:flex-end; gap:8px; margin-top:14px;}

  @media print{
    @page { size: A4 portrait; margin: 20mm; }
    header,.toolbar,footer,aside{display:none !important;}
    #docScroll{overflow:visible; padding:0;}
    .page{border:none; box-shadow:none; width:auto; min-height:auto; padding:0; margin:0;}
    body{overflow:visible;}
    #modeImg,#modeSheet,#modePdf{display:none !important;}
    #modeDoc{display:block !important;}
    #lhToggle{display:none !important;}
    #lhLogoBox{border:none !important;}
    #imgSizeBar{display:none !important;}
  }
</style>
</head>
<body>

<header>
  <div class="brand"><div class="mark">DH</div><div><b>DeskHaus</b> <span data-i18n="brandSub">· 글과 그림, 한 자리에서</span></div></div>
  <div class="tabs">
    <div class="tab active" id="tabDoc"><span class="dot"></span><span data-i18n="tabDoc">글</span></div>
    <div class="tab" id="tabImg"><span class="dot"></span><span data-i18n="tabImg">그림</span></div>
    <div class="tab" id="tabSheet"><span class="dot"></span><span data-i18n="tabSheet">표</span></div>
    <div class="tab" id="tabPdf"><span class="dot"></span><span data-i18n="tabPdf">PDF</span></div>
  </div>
  <button id="langBtn" title="Language / 언어" style="margin-left:auto; margin-bottom:12px;">EN</button>
</header>

<!-- ══ 글 모드 툴바 ══ -->
<div class="toolbar" id="tbDoc">
  <select id="blockSel" title="문단 스타일">
    <option value="p">본문</option><option value="h1">제목 1</option><option value="h2">제목 2</option>
  </select>
  <div class="sep"></div>
  <button class="icon" data-cmd="bold" title="굵게 (Ctrl+B)"><b>가</b></button>
  <button class="icon" data-cmd="italic" title="기울임 (Ctrl+I)"><i>가</i></button>
  <button class="icon" data-cmd="underline" title="밑줄 (Ctrl+U)"><u>가</u></button>
  <button class="icon" data-cmd="strikeThrough" title="취소선"><s>가</s></button>
  <input type="color" id="fontColor" value="#22262B" title="글자 색">
  <div class="sep"></div>
  <button class="icon" data-cmd="justifyLeft" title="왼쪽 정렬">⟸</button>
  <button class="icon" data-cmd="justifyCenter" title="가운데 정렬">⟺</button>
  <button class="icon" data-cmd="justifyRight" title="오른쪽 정렬">⟹</button>
  <button class="icon" data-cmd="insertUnorderedList" title="글머리 기호">•≡</button>
  <button class="icon" data-cmd="insertOrderedList" title="번호 목록">1≡</button>
  <div class="sep"></div>
  <button id="btnTable" data-i18n="btnTable">표 삽입</button>
  <button id="btnDocImg" data-i18n="btnDocImg">이미지 삽입</button>
  <span id="tableTools" style="display:none; gap:5px; align-items:center;">
    <span class="sep"></span>
    <label class="small" data-i18n="lblTableEdit">표 편집</label>
    <button id="tAddRow" data-i18n-title="tAddRowT" data-i18n="tAddRow" title="현재 행 아래에 행 추가">＋행</button>
    <button id="tDelRow" data-i18n-title="tDelRowT" data-i18n="tDelRow" title="현재 행 삭제">－행</button>
    <button id="tAddCol" data-i18n-title="tAddColT" data-i18n="tAddCol" title="현재 열 오른쪽에 열 추가">＋열</button>
    <button id="tDelCol" data-i18n-title="tDelColT" data-i18n="tDelCol" title="현재 열 삭제">－열</button>
    <button id="tSumRow" data-i18n-title="tSumRowT" data-i18n="tSumRow" title="표 아래에 각 열의 합계 행 추가 (다시 누르면 재계산)">Σ 아래 합계</button>
    <button id="tSumCol" data-i18n-title="tSumColT" data-i18n="tSumCol" title="표 오른쪽에 각 행의 합계 열 추가 (다시 누르면 재계산)">Σ 우측 합계</button>
    <button id="tExportXlsx" data-i18n-title="tExportXlsxT" data-i18n="tExportXlsx" title="이 표를 엑셀 파일(.xlsx)로 저장">엑셀로 저장</button>
  </span>
  <div class="sep"></div>
  <button class="icon" data-cmd="undo" title="실행 취소">↶</button>
  <button class="icon" data-cmd="redo" title="다시 실행">↷</button>
  <div class="sep"></div>
  <button id="btnNewDoc" class="newbtn" data-i18n="btnNewDoc">새 문서</button>
  <button id="btnOpenDoc" data-i18n-title="btnOpenDocT" data-i18n="btnOpenDoc" title="HTML · 워드(.docx) · 텍스트(.txt) 파일 열기">열기</button>
  <button id="btnImportXlsx" data-i18n-title="btnImportXlsxT" data-i18n="btnImportXlsx" title="엑셀(.xlsx) 또는 CSV 파일을 표로 불러옵니다">엑셀·CSV 열기</button>
  <button id="btnSaveDoc" class="primary" data-i18n="btnSaveDoc">저장</button>
  <button id="btnPrint" data-i18n="btnPrint">인쇄 / PDF</button>
</div>

<!-- ══ 그림 모드 툴바 ══ -->
<div class="toolbar" id="tbImg" style="display:none;">
  <button id="btnNewCanvas" class="newbtn" data-i18n="btnNewCanvas">새 캔버스</button>
  <button id="btnAddImg" class="primary" data-i18n="btnAddImg">이미지 추가</button>
  <button id="btnAddText" data-i18n="btnAddText">텍스트 추가</button>
  <div class="sep"></div>
  <button id="btnCrop" data-i18n="btnCrop">자르기</button>
  <button id="btnCanvasSize" data-i18n="btnCanvasSize">캔버스 크기</button>
  <label class="small" data-i18n="lblBg">배경</label>
  <select id="bgSel"><option value="t" data-i18n="optTransparent">투명</option><option value="c" data-i18n="optColor">색상</option></select>
  <input type="color" id="bgColor" value="#FFFFFF" title="배경 색" style="display:none;">
  <div class="sep"></div>
  <label class="small" data-i18n="lblZoom">확대</label>
  <select id="zoomSel">
    <option value="0.5">50%</option><option value="0.75">75%</option>
    <option value="1" selected>100%</option><option value="1.5">150%</option><option value="2">200%</option>
  </select>
  <div class="sep"></div>
  <label class="small" data-i18n="lblFmt">저장 형식</label>
  <select id="fmtSel">
    <option value="png">PNG</option><option value="jpeg">JPG</option><option value="webp">WebP</option>
    <option value="ico">ICO</option><option value="gif">GIF</option>
  </select>
  <select id="icoSize" style="display:none;">
    <option value="16">16px</option><option value="32" selected>32px</option><option value="48">48px</option>
    <option value="64">64px</option><option value="128">128px</option><option value="256">256px</option>
  </select>
  <button id="btnExport" class="primary" data-i18n="btnExport">내보내기</button>
  <button id="btnApplyDoc" style="display:none;" data-i18n="btnApplyDoc">문서에 적용 ↩</button>
</div>

<!-- ══ 표(스프레드시트) 모드 툴바 ══ -->
<div class="toolbar" id="tbSheet" style="display:none;">
  <button id="shNew" class="newbtn" data-i18n="shNew">새 표</button>
  <button id="shOpen" class="primary" data-i18n="shOpen">엑셀·CSV 열기</button>
  <button id="shSaveXlsx" data-i18n="shSaveXlsx">엑셀로 저장</button>
  <button id="shSaveCsv" data-i18n="shSaveCsv">CSV로 저장</button>
  <div class="sep"></div>
  <button id="shAddRow" data-i18n="shAddRow" title="맨 아래에 행 추가">＋행</button>
  <button id="shAddCol" data-i18n="shAddCol" title="맨 오른쪽에 열 추가">＋열</button>
  <div class="sep"></div>
  <button id="shBold" class="icon" title="굵게"><b>B</b></button>
  <input type="color" id="shColor" value="#22262B" title="글자 색">
  <input type="color" id="shBg" value="#FFF6C2" title="셀 배경색">
  <button id="shFill" data-i18n="shFill" title="선택 셀에 배경색 적용">칠하기</button>
  <div class="sep"></div>
  <button id="shSortAsc" data-i18n="shSortAsc" title="선택한 열 기준 오름차순 정렬">↑ 정렬</button>
  <button id="shSortDesc" data-i18n="shSortDesc" title="선택한 열 기준 내림차순 정렬">↓ 정렬</button>
  <div class="sep"></div>
  <button id="shToDoc" data-i18n="shToDoc" title="현재 표를 문서(글 모드)에 삽입">문서로 보내기 →</button>
</div>

<!-- ══ PDF 모드 툴바 ══ -->
<div class="toolbar" id="tbPdf" style="display:none;">
  <button id="pdfOpen" class="primary" data-i18n="pdfOpen">PDF 열기</button>
  <button id="pdfAdd" data-i18n="pdfAdd" title="현재 PDF 뒤에 다른 PDF를 이어 붙입니다">PDF 이어붙이기</button>
  <div class="sep"></div>
  <button id="pdfPrev" class="icon" title="이전 페이지">◀</button>
  <span id="pdfPageInfo" style="font-size:13px; color:var(--muted); min-width:78px; text-align:center;">– / –</span>
  <button id="pdfNext" class="icon" title="다음 페이지">▶</button>
  <button id="pdfDelPage" class="danger" data-i18n="pdfDelPage" title="현재 페이지를 삭제합니다">이 페이지 삭제</button>
  <div class="sep"></div>
  <label class="small" data-i18n="lblZoom">확대</label>
  <select id="pdfZoom">
    <option value="0.5">50%</option><option value="0.75">75%</option>
    <option value="1" selected>100%</option><option value="1.25">125%</option>
    <option value="1.5">150%</option><option value="2">200%</option>
  </select>
  <div class="sep"></div>
  <button id="pdfToImg" data-i18n="pdfToImg" title="현재 페이지를 그림 모드로 가져와 편집">이 페이지 → 그림</button>
  <button id="pdfExtractPng" data-i18n="pdfExtractPng" title="현재 페이지를 PNG 이미지로 저장">현재 페이지 PNG 저장</button>
  <div class="sep"></div>
  <button id="pdfSavePage" data-i18n="pdfSavePage" title="현재 페이지만 새 PDF로 저장">이 페이지만 PDF 저장</button>
  <button id="pdfSaveAll" data-i18n="pdfSaveAll" title="현재 PDF 전체를 저장">전체 PDF 저장</button>
</div>

<main>
  <!-- 글 모드 -->
  <div class="mode active" id="modeDoc">
    <div id="docScroll">
      <div class="page">
        <!-- 레터헤드 (로고 왼쪽 · 정보 오른쪽) -->
        <div id="letterhead">
          <div id="lhLogoBox" data-i18n-title="lhLogoT" title="">
            <img id="lhLogo" style="display:none;">
            <span id="lhLogoPlaceholder" data-i18n="lhLogoAdd">＋ 로고</span>
          </div>
          <div id="lhInfo">
            <div id="lhName" contenteditable="true" data-ph-key="lhNamePh"></div>
            <div id="lhContact">
              <span id="lhEmail" contenteditable="true" data-ph-key="lhEmailPh"></span>
              <span id="lhPhone" contenteditable="true" data-ph-key="lhPhonePh"></span>
            </div>
          </div>
          <button id="lhToggle" data-i18n-title="lhToggleT" title="">–</button>
        </div>
        <button id="lhShow" data-i18n="lhShow" style="display:none;">＋ 레터헤드</button>
        <div id="editor" contenteditable="true" spellcheck="false"></div>
      </div>
    </div>
  </div>

  <!-- 그림 모드 -->
  <div class="mode" id="modeImg">
    <div id="imgWrap">
      <div id="canvasArea">
        <div id="canvasBox">
          <canvas id="cv" width="1000" height="700"></canvas>
          <canvas id="cropLayer" width="1000" height="700"></canvas>
        </div>
      </div>
      <aside>
        <h3 data-i18n="layerTitle">레이어 (위 = 앞)</h3>
        <div id="layerList"></div>
        <div id="layerCtrl">
          <div class="row"><label class="small" style="width:52px;" data-i18n="lblOpacity">투명도</label><input type="range" id="opRange" min="0" max="100" value="100"><span id="opVal" class="small" style="width:34px;text-align:right;">100%</span></div>
          <div class="row">
            <button id="lyUp" data-i18n-title="lyUpT" data-i18n="lyUp" title="앞으로">▲ 앞</button><button id="lyDown" data-i18n-title="lyDownT" data-i18n="lyDown" title="뒤로">▼ 뒤</button>
            <button id="lyDel" class="danger" data-i18n="lyDel">삭제</button>
          </div>
          <div class="row">
            <button id="lyRot" data-i18n-title="lyRotT" data-i18n="lyRot" title="시계 방향 90도 회전">↻ 회전</button>
            <button id="lyFlip" data-i18n-title="lyFlipT" data-i18n="lyFlip" title="좌우 반전">⇋ 반전</button>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- 표 모드 -->
  <div class="mode" id="modeSheet">
    <div id="sheetWrap">
      <div id="formulaBar">
        <span id="cellRef">A1</span>
        <input type="text" id="formulaInput" spellcheck="false" placeholder="">
      </div>
      <div id="sheetScroll">
        <table id="sheetTable"></table>
      </div>
    </div>
  </div>

  <!-- PDF 모드 -->
  <div class="mode" id="modePdf">
    <div id="pdfArea">
      <div id="pdfEmpty" data-i18n="pdfEmptyMsg">PDF 열기를 눌러 파일을 여세요.</div>
      <canvas id="pdfCanvas" style="display:none;"></canvas>
    </div>
  </div>
</main>

<footer>
  <span id="statMode" data-i18n="statModeDoc">글 모드</span>
  <span class="calc" id="statCalc"></span>
  <span id="statMsg"></span>
  <span class="hint" id="statHint" data-i18n="statHintDoc">숫자를 드래그 선택하면 합계·평균이 여기에 표시됩니다</span>
</footer>

<!-- 숨김 파일 입력 -->
<input type="file" id="fileDocImg" accept="image/*" hidden>
<input type="file" id="fileLayerImg" accept="image/*" hidden>
<input type="file" id="fileOpenDoc" accept=".html,.htm,.docx,.txt" hidden>
<input type="file" id="fileXlsx" accept=".xlsx,.xls,.csv" hidden>
<input type="file" id="fileLogo" accept="image/*" hidden>
<input type="file" id="fileSheetOpen" accept=".xlsx,.xls,.csv" hidden>
<input type="file" id="filePdfOpen" accept=".pdf" hidden>
<input type="file" id="filePdfAdd" accept=".pdf" hidden>

<!-- 확인 대화상자 -->
<dialog id="dlgConfirm">
  <h4 id="cfMsg">계속할까요?</h4>
  <div class="btns"><button id="cfNo" data-i18n="btnCancel">취소</button><button class="primary" id="cfYes" data-i18n="btnOk">확인</button></div>
</dialog>

<!-- 저장 형식 선택 대화상자 -->
<dialog id="dlgFormat">
  <h4 data-i18n="dlgFormatTitle">저장 형식 선택</h4>
  <div class="btns" style="flex-direction:column; gap:8px; align-items:stretch;">
    <button class="primary" id="fmtHtml" data-i18n="fmtHtmlBtn">HTML (레터헤드 포함, 다시 열어 편집 가능)</button>
    <button id="fmtDocx" data-i18n="fmtDocxBtn">Word 문서 (.docx)</button>
    <button id="fmtTxt" data-i18n="fmtTxtBtn">텍스트 (.txt)</button>
    <button id="fmtCancel" data-i18n="btnCancel" style="margin-top:4px;">취소</button>
  </div>
</dialog>

<!-- 파일 이름 대화상자 -->
<dialog id="dlgSave">
  <h4 data-i18n="dlgSaveTitle">저장할 파일 이름</h4>
  <div class="frow"><label>이름</label><input type="text" id="saveName"></div>
  <div class="btns"><button id="svCancel" data-i18n="btnCancel">취소</button><button class="primary" id="svOk" data-i18n="btnSave">저장</button></div>
</dialog>

<!-- 표 삽입 대화상자 -->
<dialog id="dlgTable">
  <h4 data-i18n="dlgTableTitle">표 삽입</h4>
  <div class="frow"><label data-i18n="lblRows">행</label><input type="number" id="tRows" value="3" min="1" max="50"></div>
  <div class="frow"><label data-i18n="lblCols">열</label><input type="number" id="tCols" value="3" min="1" max="20"></div>
  <div class="btns"><button onclick="dlgTable.close()" data-i18n="btnCancel">취소</button><button class="primary" id="tOk" data-i18n="btnInsert">삽입</button></div>
</dialog>

<!-- 텍스트 추가 대화상자 -->
<dialog id="dlgText">
  <h4 data-i18n="dlgTextTitle">텍스트 레이어 추가</h4>
  <div class="frow"><label data-i18n="lblContent">내용</label><input type="text" id="txContent" value="텍스트"></div>
  <div class="frow"><label data-i18n="lblSize">크기</label><input type="number" id="txSize" value="48" min="8" max="400"></div>
  <div class="frow"><label data-i18n="lblColor">색상</label><input type="color" id="txColor" value="#22262B"></div>
  <div class="btns"><button onclick="dlgText.close()" data-i18n="btnCancel">취소</button><button class="primary" id="txOk" data-i18n="btnAdd">추가</button></div>
</dialog>

<!-- 캔버스 크기 대화상자 -->
<dialog id="dlgCanvas">
  <h4 data-i18n="dlgCanvasTitle">캔버스 크기</h4>

let LANG = 'ko';
const T = k => (I18N[LANG][k] !== undefined ? I18N[LANG][k] : k);
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n'); if(I18N[LANG][k]!==undefined) el.textContent = I18N[LANG][k];
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{
    const k = el.getAttribute('data-i18n-title'); if(I18N[LANG][k]!==undefined) el.title = I18N[LANG][k];
  });
  /* 상태바 모드/힌트는 현재 모드에 맞게 */
  const doc = document.getElementById('modeDoc').classList.contains('active');
  document.getElementById('statMode').textContent = doc ? T('statModeDoc') : T('statModeImg');
  document.getElementById('statHint').textContent = doc ? T('statHintDoc') : T('statHintImg');
  /* 편집영역 placeholder */
  document.querySelectorAll('[data-ph-key]').forEach(el=>{
    const k = el.getAttribute('data-ph-key'); el.setAttribute('data-ph', T(k));
  });
  document.getElementById('langBtn').textContent = LANG==='ko' ? 'EN' : '한국어';
}

/* ═══════════════ 공통 ═══════════════ */
const $ = id => document.getElementById(id);
const msg = t => { $('statMsg').textContent = t; setTimeout(()=>{ if($('statMsg').textContent===t) $('statMsg').textContent=''; }, 4000); };
async function download(blob, name){
  /* 1) 데스크톱(exe) 버전: 네이티브 저장 대화상자 */
  if(typeof Neutralino !== 'undefined' && window.NL_TOKEN !== undefined){
    try{
      const path = await Neutralino.os.showSaveDialog('저장', {defaultPath: name});
      if(!path) return;
      await Neutralino.filesystem.writeBinaryFile(path, await blob.arrayBuffer());
      msg(T('mSaved') + path);
      return;
    }catch(e){ /* 실패 시 다음 방식으로 */ }
  }
  /* 2) 지원 브라우저(크롬·엣지 등): "다른 이름으로 저장" 창 */
  if(window.showSaveFilePicker){
    try{
      const ext = '.' + name.split('.').pop();
      const h = await showSaveFilePicker({
        suggestedName: name,
        types: [{ description: ext.slice(1).toUpperCase() + ' 파일', accept: { [blob.type || 'application/octet-stream']: [ext] } }]
      });
      const w = await h.createWritable();
      await w.write(blob); await w.close();
      msg(T('mSavedShort'));
      return;
    }catch(e){
      if(e.name === 'AbortError') return;  /* 사용자가 취소 */
      /* 그 외 오류는 다음 방식으로 */
    }
  }
  /* 3) 그 외: 이름 입력창 → 다운로드 폴더로 저장 */
  const finalName = await askName(name);
  if(finalName === null) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = finalName; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
/* 파일 이름 입력 대화상자 */
function askName(def){
  return new Promise(res=>{
    const d = $('dlgSave'), inp = $('saveName');
    inp.value = def;
    const ext = '.' + def.split('.').pop();
    const finish = v=>{
      $('svOk').onclick = $('svCancel').onclick = inp.onkeydown = d.oncancel = null;
      d.close(); res(v);
    };
    $('svOk').onclick = ()=>{
      let n = inp.value.trim() || def;
      if(!n.toLowerCase().endsWith(ext.toLowerCase())) n += ext;
      finish(n);
    };
    $('svCancel').onclick = ()=> finish(null);
    d.oncancel = ()=> finish(null);
    inp.onkeydown = e=>{ if(e.key === 'Enter'){ e.preventDefault(); $('svOk').onclick(); } };
    d.showModal();
    /* 확장자 앞부분만 선택해 두어 바로 타이핑 가능 */
    inp.setSelectionRange(0, def.length - ext.length);
    inp.focus();
  });
}

/* 확인 대화상자 */
function askConfirm(text){
  return new Promise(res=>{
    const d = $('dlgConfirm');
    $('cfMsg').textContent = text;
    const finish = v=>{ $('cfYes').onclick = $('cfNo').onclick = d.oncancel = null; d.close(); res(v); };
    $('cfYes').onclick = ()=> finish(true);
    $('cfNo').onclick = ()=> finish(false);
    d.oncancel = ()=> finish(false);
    d.showModal();
  });
}

function setMode(m){
  const modes = { doc:'modeDoc', img:'modeImg', sheet:'modeSheet', pdf:'modePdf' };
  const tabs = { doc:'tabDoc', img:'tabImg', sheet:'tabSheet', pdf:'tabPdf' };
  const bars = { doc:'tbDoc', img:'tbImg', sheet:'tbSheet', pdf:'tbPdf' };
  for(const k in modes){

/* 에디터 HTML → docx 문서 조립 */
async function buildDocx(){
  const D = docx;
  const children = [];

  /* dataURL/일반 URL → {data, w, h} (docx ImageRun용) */
  async function imgToRun(imgEl, opts){
    opts = opts || {};
    try{
      let src = imgEl.getAttribute('src'); if(!src) return null;
      let bytes;
      if(src.startsWith('data:')){
        const b64 = src.split(',')[1];
        const bin = atob(b64); const arr = new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
        bytes = arr;
      } else {
        const resp = await fetch(src); bytes = new Uint8Array(await resp.arrayBuffer());
      }
      let w = imgEl.naturalWidth || imgEl.width || 300;
      let h = imgEl.naturalHeight || imgEl.height || 200;
      const ratio = h / w;
      /* 사용자가 문서에서 크기를 조절했으면(style.width) 그 값을 우선 */
      const styleW = parseFloat(imgEl.style && imgEl.style.width);
      if(!opts.fixedWidth && styleW && styleW > 0){
        w = styleW; h = Math.round(styleW * ratio);
      }
      if(opts.fixedWidth){
        /* 원본 크기와 무관하게 지정 너비로 강제 (로고용) */
        w = opts.fixedWidth; h = Math.round(opts.fixedWidth * ratio);
      } else {
        const maxW = opts.maxWidth || 600;
        if(w > maxW){ w = maxW; h = Math.round(maxW * ratio); }
      }
      const m = /^data:image\/(\w+)/.exec(src);
      let type = m ? m[1].toLowerCase() : (/\.png/i.test(src)?'png':/\.gif/i.test(src)?'gif':'jpg');
      if(type==='jpeg') type='jpg';
      if(!['png','jpg','gif','bmp'].includes(type)) type='png';  /* webp 등은 png로 표기(대부분 브라우저가 관대하게 처리) */
      return new D.ImageRun({ data:bytes, transformation:{ width:Math.round(w), height:Math.round(h) }, type });
    }catch(e){ return null; }
  }

  /* 인라인 노드 → TextRun/ImageRun 배열 (이미지 포함) */
  async function runsFrom(node, inherit){
    inherit = inherit || {};
    const runs = [];
    for(const n of node.childNodes){
      if(n.nodeType === 3){
        if(n.textContent) runs.push(new D.TextRun({ text:n.textContent, bold:inherit.bold, italics:inherit.italic, underline:inherit.underline?{}:undefined, color:inherit.color }));
      } else if(n.nodeType === 1){
        const tag = n.tagName.toLowerCase();
        if(tag==='img'){ const ir = await imgToRun(n); if(ir) runs.push(ir); continue; }
        if(tag==='br'){ runs.push(new D.TextRun({ break:1 })); continue; }
        const inh = Object.assign({}, inherit);
        if(tag==='b'||tag==='strong') inh.bold=true;
        if(tag==='i'||tag==='em') inh.italic=true;
        if(tag==='u') inh.underline=true;
        if(n.style && n.style.color) inh.color = rgbToHex(n.style.color);
        runs.push(...await runsFrom(n, inh));
      }
    }
    return runs;
  }
  /* 표 → docx Table */
  async function tableFrom(tb){
    const rows = [];
    for(const tr of [...tb.rows]){
      const cells = [];
      for(const c of [...tr.cells]){
        const isHead = c.tagName==='TH';
        cells.push(new D.TableCell({
          children:[ new D.Paragraph({ alignment:D.AlignmentType.CENTER, children: await runsFrom(c, {bold:isHead}) }) ],
          shading: isHead ? { fill:'F0F3F7' } : (c.dataset && c.dataset.sum ? { fill:'EDF2FA' } : undefined),
        }));
      }
      rows.push(new D.TableRow({ children:cells }));
    }
    return new D.Table({ rows, width:{ size:100, type:D.WidthType.PERCENTAGE } });
  }
  /* 레터헤드 (로고 이미지 포함) */
  const lhName = $('lhName').textContent.trim();
  const lhEmail = $('lhEmail').textContent.trim();
  const lhPhone = $('lhPhone').textContent.trim();
  const lhVisible = !$('letterhead').classList.contains('collapsed');
  const lhLogoEl = $('lhLogo');
  const hasLogo = lhLogoEl && lhLogoEl.style.display!=='none' && lhLogoEl.getAttribute('src');
  if(lhVisible && (lhName || lhEmail || lhPhone || hasLogo)){
    /* 정보 칸(오른쪽): 회사명 + 연락처 */
    const infoParas = [];
    if(lhName) infoParas.push(new D.Paragraph({ children:[new D.TextRun({ text:lhName, bold:true, size:36 })] }));
    const cinfo = [lhEmail, lhPhone].filter(Boolean).join('   ');
    if(cinfo) infoParas.push(new D.Paragraph({ children:[new D.TextRun({ text:cinfo, size:20, color:'6B7482' })] }));
    if(!infoParas.length) infoParas.push(new D.Paragraph({ children:[] }));

    if(hasLogo){
      /* 로고가 있으면: 테두리 없는 2칸 표 (로고 | 정보) */
      const logoRun = await imgToRun(lhLogoEl, {fixedWidth:80});
      const logoCell = new D.TableCell({
        width:{ size:1730, type:D.WidthType.DXA },
        margins:{ right:180 },
        verticalAlign:D.VerticalAlign.CENTER,
        children:[ new D.Paragraph({ children: logoRun ? [logoRun] : [] }) ],
      });
      const infoCell = new D.TableCell({
        width:{ size:7908, type:D.WidthType.DXA },
        verticalAlign:D.VerticalAlign.CENTER,
        children: infoParas,
      });
      const noBorder = { style:D.BorderStyle.NONE, size:0, color:'FFFFFF' };
      children.push(new D.Table({
        width:{ size:100, type:D.WidthType.PERCENTAGE },
        columnWidths:[1730, 7908],   /* twip: A4 본문폭 9638 = 로고칸 + 정보칸 */
        borders:{ top:noBorder, bottom:noBorder, left:noBorder, right:noBorder, insideHorizontal:noBorder, insideVertical:noBorder },
        rows:[ new D.TableRow({ children:[logoCell, infoCell] }) ],
      }));
    } else {
      /* 로고 없으면 정보만 */
      infoParas.forEach(p=> children.push(p));
    }
    /* 파란 밑줄 구분선 */
    children.push(new D.Paragraph({ border:{ bottom:{ color:'1F4E8C', size:12, style:D.BorderStyle.SINGLE } }, children:[] }));
    children.push(new D.Paragraph({ children:[] }));
  }
  /* 본문 블록 순회 */
  for(const node of [...editor.childNodes]){
    if(node.nodeType === 3){
      if(node.textContent.trim()) children.push(new D.Paragraph({ children:[new D.TextRun(node.textContent)] }));
      continue;
    }
    if(node.nodeType !== 1) continue;
    const tag = node.tagName.toLowerCase();
    if(tag==='table'){ children.push(await tableFrom(node)); children.push(new D.Paragraph({children:[]})); continue; }
    if(tag==='img'){
      const ir=await imgToRun(node);
      if(ir){
        /* 이미지 정렬 판단: margin-left auto + margin-right auto=가운데, ml auto만=오른쪽 */
        const ml = node.style.marginLeft, mr = node.style.marginRight;
        let al;
        if(ml==='auto' && mr==='auto') al = D.AlignmentType.CENTER;
        else if(ml==='auto') al = D.AlignmentType.RIGHT;
        children.push(new D.Paragraph({ alignment:al, children:[ir] }));
      }
      continue;
    }
    if(tag==='ul'||tag==='ol'){
      for(const li of [...node.children])
        children.push(new D.Paragraph({ children:await runsFrom(li), bullet: tag==='ul'?{level:0}:undefined, numbering: tag==='ol'?{reference:'num',level:0}:undefined }));
      continue;
    }
    let heading;
    if(tag==='h1') heading = D.HeadingLevel.HEADING_1;
    else if(tag==='h2') heading = D.HeadingLevel.HEADING_2;
    else if(tag==='h3') heading = D.HeadingLevel.HEADING_3;
    const align = node.style && node.style.textAlign;
    const alignment = align==='center'?D.AlignmentType.CENTER : align==='right'?D.AlignmentType.RIGHT : undefined;
    children.push(new D.Paragraph({ heading, alignment, children: await runsFrom(node) }));
  }
  if(!children.length) children.push(new D.Paragraph({children:[]}));

  const doc = new D.Document({
    numbering:{ config:[{ reference:'num', levels:[{ level:0, format:D.LevelFormat.DECIMAL, text:'%1.', alignment:D.AlignmentType.START }] }] },
    sections:[{
      properties:{ page:{ size:{ width:11906, height:16838, orientation:D.PageOrientation.PORTRAIT }, margin:{ top:1134, bottom:1134, left:1134, right:1134 } } },
      children
    }],
  });
  return await D.Packer.toBlob(doc);
}
function rgbToHex(rgb){
  const m = (rgb||'').match(/\d+/g); if(!m || m.length<3) return undefined;
  return ((1<<24) + (+m[0]<<16) + (+m[1]<<8) + (+m[2])).toString(16).slice(1).toUpperCase();
}

const cv = $('cv'), ctx = cv.getContext('2d');
const cropCv = $('cropLayer'), cropCtx = cropCv.getContext('2d');
let layers = [];          // 아래→위 순서
let selId = null, nextId = 1, zoom = 1;
let bgTransparent = true, bgColor = '#FFFFFF';

/* 체커보드 패턴 */
const checker = (()=> {
  const c = document.createElement('canvas'); c.width = c.height = 20;
  const x = c.getContext('2d');
  x.fillStyle = '#E7E9ED'; x.fillRect(0,0,20,20);
  x.fillStyle = '#F7F8FA'; x.fillRect(0,0,10,10); x.fillRect(10,10,10,10);
  return ctx.createPattern(c, 'repeat');
})();

function sel(){ return layers.find(l=>l.id===selId) || null; }

function textBox(l){
  ctx.font = `${l.fontSize}px 'Segoe UI','Malgun Gothic',sans-serif`;
  const w = ctx.measureText(l.text).width;
  return {x:l.x, y:l.y, w, h:l.fontSize*1.25};
}
function box(l){ return l.type==='text' ? textBox(l) : {x:l.x, y:l.y, w:l.w, h:l.h}; }

function render(){
  ctx.clearRect(0,0,cv.width,cv.height);
  if(bgTransparent){ ctx.fillStyle = checker; ctx.fillRect(0,0,cv.width,cv.height); }
  else { ctx.fillStyle = bgColor; ctx.fillRect(0,0,cv.width,cv.height); }
  for(const l of layers){
    if(!l.visible) continue;
    ctx.globalAlpha = l.opacity;
    if(l.type==='image') ctx.drawImage(l.img, l.x, l.y, l.w, l.h);
    else {
      ctx.font = `${l.fontSize}px 'Segoe UI','Malgun Gothic',sans-serif`;
      ctx.fillStyle = l.color; ctx.textBaseline = 'top';
      ctx.fillText(l.text, l.x, l.y);
    }
    ctx.globalAlpha = 1;
  }
  const s = sel();
  if(s && s.visible){
    const b = box(s);
    ctx.strokeStyle = '#1F4E8C'; ctx.lineWidth = 1.5; ctx.setLineDash([6,4]);
    ctx.strokeRect(b.x-1, b.y-1, b.w+2, b.h+2); ctx.setLineDash([]);
    ctx.fillStyle = '#1F4E8C';
    ctx.fillRect(b.x+b.w-6, b.y+b.h-6, 12, 12); // 크기조절 핸들
  }
}

/* 레이어 패널 */
function renderPanel(){
  const list = $('layerList'); list.innerHTML = '';
  [...layers].reverse().forEach(l=>{
    const d = document.createElement('div');
    d.className = 'layer' + (l.id===selId ? ' sel' : '');
    const th = document.createElement('div'); th.className = 'thumb';
    if(l.type==='image'){
      const t = document.createElement('canvas'); t.width=34; t.height=26;
      const r = Math.min(34/l.img.width, 26/l.img.height);
      t.getContext('2d').drawImage(l.img, (34-l.img.width*r)/2, (26-l.img.height*r)/2, l.img.width*r, l.img.height*r);
      th.appendChild(t);
    } else th.textContent = '가';
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = l.name;
    nm.title = T('layerRename');
    nm.ondblclick = ev=>{ ev.stopPropagation(); const n = prompt(T('layerRenamePrompt'), l.name); if(n){ l.name = n; renderPanel(); } };
    const eye = document.createElement('button'); eye.className = 'eye';
    eye.textContent = l.visible ? '👁' : '–';
    eye.title = '표시 / 숨김';
    eye.onclick = ev=>{ ev.stopPropagation(); l.visible = !l.visible; render(); renderPanel(); };
    d.append(th, nm, eye);

}

function addImageLayer(src, name){
  const img = new Image();
  img.onload = ()=>{
    let w = img.width, h = img.height;

    if(w>max || h>max){ const r = Math.min(max/w, max/h); w*=r; h*=r; }
    const l = {id:nextId++, type:'image', name:name||(T('imgLayer')+' '+nextId), img, x:(cv.width-w)/2, y:(cv.height-h)/2, w, h, opacity:1, visible:true};
    layers.push(l); selId = l.id; render(); renderPanel();
  };
  img.src = src;
}

/* 마우스 상호작용 (이동·크기조절) */
let drag = null;
function toCanvas(e){
  const r = cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/zoom, y:(e.clientY-r.top)/zoom};
}
cv.addEventListener('mousedown', e=>{
  const p = toCanvas(e);
  const s = sel();
  if(s){ // 크기조절 핸들 체크
    const b = box(s);
    if(Math.abs(p.x-(b.x+b.w))<=9 && Math.abs(p.y-(b.y+b.h))<=9){
      drag = {mode:'resize', l:s, sx:p.x, sy:p.y, ow:b.w, oh:b.h, ofs:s.fontSize};
      return;
    }
  }
  // 위에서부터 히트 테스트
  for(let i=layers.length-1;i>=0;i--){
    const l = layers[i]; if(!l.visible) continue;
    const b = box(l);
    if(p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h){
      selId = l.id;
      drag = {mode:'move', l, dx:p.x-l.x, dy:p.y-l.y};
      render(); renderPanel();
      return;
    }
  }
  selId = null; render(); renderPanel();
});
window.addEventListener('mousemove', e=>{
  if(!drag) return;
  const p = toCanvas(e);
  if(drag.mode==='move'){ drag.l.x = p.x-drag.dx; drag.l.y = p.y-drag.dy; }
  else {
    const ratio = Math.max(0.05, (drag.ow + (p.x-drag.sx)) / drag.ow);
    if(drag.l.type==='image'){ drag.l.w = drag.ow*ratio; drag.l.h = drag.oh*ratio; }
    else drag.l.fontSize = Math.max(8, drag.ofs*ratio);
  }
  render();
});
window.addEventListener('mouseup', ()=> drag = null);

/* ── 평면화 & 내보내기 ── */
function flatten(forceBg){
  const off = document.createElement('canvas');
  off.width = cv.width; off.height = cv.height;
  const x = off.getContext('2d');
  if(!bgTransparent || forceBg){ x.fillStyle = bgTransparent?'#FFFFFF':bgColor; x.fillRect(0,0,off.width,off.height); }
  for(const l of layers){
    if(!l.visible) continue;
    x.globalAlpha = l.opacity;
    if(l.type==='image') x.drawImage(l.img, l.x, l.y, l.w, l.h);
    else {
      x.font = `${l.fontSize}px 'Segoe UI','Malgun Gothic',sans-serif`;
      x.fillStyle = l.color; x.textBaseline = 'top';
      x.fillText(l.text, l.x, l.y);
    }
    x.globalAlpha = 1;
  }
  return off;
}

/* ICO: 정사각 리사이즈 후 PNG를 ICO 컨테이너에 포장 */
async function makeIco(size){
  const flat = flatten(false);
  const off = document.createElement('canvas'); off.width = off.height = size;
  const x = off.getContext('2d');
  const r = Math.min(size/flat.width, size/flat.height);
  x.drawImage(flat, (size-flat.width*r)/2, (size-flat.height*r)/2, flat.width*r, flat.height*r);
  const blob = await new Promise(res=> off.toBlob(res, 'image/png'));
  const png = new Uint8Array(await blob.arrayBuffer());
  const head = new Uint8Array(22);
  const dv = new DataView(head.buffer);
  dv.setUint16(2, 1, true);            // 타입: 아이콘
  dv.setUint16(4, 1, true);            // 이미지 1개
  head[6] = size>=256?0:size;          // 너비 (256=0)
  head[7] = size>=256?0:size;          // 높이
  dv.setUint16(10, 1, true);           // 색상 평면
  dv.setUint16(12, 32, true);          // 비트 수
  dv.setUint32(14, png.length, true);  // 데이터 크기
  dv.setUint32(18, 22, true);          // 데이터 시작 위치
  return new Blob([head, png], {type:'image/x-icon'});
}

/* GIF: gif.js (CDN) — 워커는 Blob URL로 우회 */
let gifReady = null;
function makeGif(){
  if(!gifReady){
    gifReady = new Promise((res, rej)=>{
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js';
      s.onload = async ()=>{
        try{
          const t = await (await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js')).text();
          res(URL.createObjectURL(new Blob([t], {type:'application/javascript'})));
        } catch(e){ gifReady=null; rej(new Error(T('mGifFail'))); }
      };
      s.onerror = ()=>{ gifReady=null; rej(new Error(T('mGifFail'))); };
      document.head.appendChild(s);
    });
  }
  return gifReady.then(workerURL => new Promise((res, rej)=>{
    const flat = flatten(true);
    const g = new GIF({workers:1, quality:8, width:flat.width, height:flat.height, workerScript:workerURL});
    g.addFrame(flat, {delay:200});
    g.on('finished', b=> res(b));
    g.on('abort', ()=> rej(new Error('중단됨')));
    g.render();
  }));
}

const LH_KEY = 'deskhaus_letterhead';
/* 안전한 저장소 접근 (미리보기 환경에서 localStorage 막혀도 앱이 죽지 않게) */
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
};
function saveLetterhead(){
  const data = {
    name: $('lhName').innerHTML,
    email: $('lhEmail').innerHTML,
    phone: $('lhPhone').innerHTML,
    logo: $('lhLogo').getAttribute('src') || '',
    collapsed: $('letterhead').classList.contains('collapsed'),
  };
  store.set(LH_KEY, JSON.stringify(data));
}
function loadLetterhead(){
  let data = null;
  try{ data = JSON.parse(store.get(LH_KEY) || 'null'); }catch(e){}

  $('lhName').innerHTML = data.name || '';

/* ═══════════════ 표(스프레드시트) 모드 ═══════════════ */
let hf = null;                 // HyperFormula 인스턴스
let shRows = 30, shCols = 12;  // 격자 크기
let shData = null;             // 원본 입력값(문자열/수식) 2차원 배열
let shStyle = null;            // 셀 스타일 { 'r,c': {bold,color,bg} }
let selR = 0, selC = 0;        // 선택 셀
let sheetReady = false;

const colName = i => { let s=''; i++; while(i>0){ i--; s=String.fromCharCode(65+i%26)+s; i=Math.floor(i/26); } return s; };

function ensureSheet(){
  if(sheetReady) return;
  if(typeof HyperFormula === 'undefined'){ msg(T('mSheetNoMod')); return; }
  shData = Array.from({length:shRows}, ()=> Array(shCols).fill(''));
  shStyle = {};
  buildHF();
  renderSheet();
  sheetReady = true;
}
function buildHF(){
  if(hf){ try{ hf.destroy(); }catch(e){} }
  hf = HyperFormula.buildFromArray(shData, { licenseKey:'gpl-v3' });
}
/* 계산된 표시값 */
function cellDisplay(r,c){
  const raw = shData[r][c];
  if(raw === '' || raw == null) return '';
  if(typeof raw === 'string' && raw[0] === '='){
    try{
      const v = hf.getCellValue({sheet:0, row:r, col:c});
      if(v && typeof v==='object' && v.type==='ERROR') return '#ERR';
      return v==null ? '' : String(v);
    }catch(e){ return '#ERR'; }
  }
  return String(raw);
}
function renderSheet(){
  const tb = $('sheetTable');
  let html = '<thead><tr><th></th>';
  for(let c=0;c<shCols;c++) html += `<th>${colName(c)}</th>`;
  html += '</tr></thead><tbody>';
  for(let r=0;r<shRows;r++){
    html += `<tr><th>${r+1}</th>`;
    for(let c=0;c<shCols;c++){
      const st = shStyle[r+','+c] || {};
      const sty = [
        st.bold?'font-weight:700':'',
        st.color?`color:${st.color}`:'',
        st.bg?`background:${st.bg}`:''
      ].filter(Boolean).join(';');
      const cls = (r===selR&&c===selC)?'sel':'';
      html += `<td data-r="${r}" data-c="${c}" class="${cls}" style="${sty}">${escHtml(cellDisplay(r,c))}</td>`;
    }
    html += '</tr>';
  }
  html += '</tbody>';
  tb.innerHTML = html;
  updateFormulaBar();
}
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function updateFormulaBar(){
  $('cellRef').textContent = colName(selC) + (selR+1);
  const raw = shData[selR][selC];
  $('formulaInput').value = (raw==null) ? '' : String(raw);
}
function selectCell(r,c){
  if(r<0||c<0||r>=shRows||c>=shCols) return;
  document.querySelectorAll('#sheetTable td.sel').forEach(td=>td.classList.remove('sel'));
  selR=r; selC=c;
  const td = $('sheetTable').querySelector(`td[data-r="${r}"][data-c="${c}"]`);
  if(td){ td.classList.add('sel'); if(td.scrollIntoView) td.scrollIntoView({block:'nearest', inline:'nearest'}); }
  updateFormulaBar();
}
/* 셀 값 설정 후 재계산 */
function setCellValue(r,c,val){
  shData[r][c] = val;
  try{ hf.setCellContents({sheet:0, row:r, col:c}, [[val==='' ? null : val]]); }catch(e){ buildHF(); }
  recalcRender();
}
/* 화면만 다시 그림(수식 결과 갱신) — 선택/스타일 유지 */
function recalcRender(){
  for(let r=0;r<shRows;r++) for(let c=0;c<shCols;c++){
    const td = $('sheetTable').querySelector(`td[data-r="${r}"][data-c="${c}"]`);
    if(td) td.textContent = cellDisplay(r,c);
  }
}
/* 셀 클릭/더블클릭/키보드 */
$('sheetTable').addEventListener('click', e=>{
  const td = e.target.closest('td'); if(!td) return;
  selectCell(+td.dataset.r, +td.dataset.c);
});
$('sheetTable').addEventListener('dblclick', e=>{
  const td = e.target.closest('td'); if(!td) return;
  startEdit(+td.dataset.r, +td.dataset.c);
});
function startEdit(r,c){
  selectCell(r,c);
  const td = $('sheetTable').querySelector(`td[data-r="${r}"][data-c="${c}"]`);
  if(!td) return;
  td.classList.add('editing');
  const raw = shData[r][c]; const orig = (raw==null)?'':String(raw);
  td.textContent = orig;
  td.contentEditable = 'true'; td.focus();
  /* 커서 끝으로 */
  const range=document.createRange(); range.selectNodeContents(td); range.collapse(false);
  const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  const finish = (commit, move)=>{
    td.contentEditable='false'; td.classList.remove('editing');
    if(commit) setCellValue(r,c, td.textContent);
    else td.textContent = cellDisplay(r,c);
    td.onblur=td.onkeydown=null;
    if(move){ selectCell(Math.min(r+1,shRows-1), c); }
    else selectCell(r,c);
    $('sheetScroll').focus();
  };
  td.onkeydown = ev=>{
    if(ev.key==='Enter'){ ev.preventDefault(); finish(true,true); }
    else if(ev.key==='Escape'){ ev.preventDefault(); finish(false,false); }
    else if(ev.key==='Tab'){ ev.preventDefault(); td.contentEditable='false'; td.classList.remove('editing'); setCellValue(r,c,td.textContent); td.onblur=td.onkeydown=null; selectCell(r, Math.min(c+1,shCols-1)); $('sheetScroll').focus(); }
  };
  td.onblur = ()=> finish(true,false);
}
/* 격자 키보드 네비게이션 */
$('sheetScroll').tabIndex = 0;
$('sheetScroll').addEventListener('keydown', e=>{
  if($('sheetTable').querySelector('td.editing')) return;
  if(e.key==='ArrowUp'){ e.preventDefault(); selectCell(selR-1,selC); }
  else if(e.key==='ArrowDown'||e.key==='Enter'){ e.preventDefault(); selectCell(selR+1,selC); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); selectCell(selR,selC-1); }
  else if(e.key==='ArrowRight'||e.key==='Tab'){ e.preventDefault(); selectCell(selR,selC+1); }
  else if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); setCellValue(selR,selC,''); }
  else if(e.key==='F2'){ e.preventDefault(); startEdit(selR,selC); }
  else if(e.key.length===1 && !e.ctrlKey && !e.metaKey){ startEdit(selR,selC); }
});
/* 수식 입력줄 */
$('formulaInput').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); setCellValue(selR,selC,$('formulaInput').value); selectCell(Math.min(selR+1,shRows-1),selC); $('sheetScroll').focus(); }
});
$('formulaInput').addEventListener('blur', ()=>{ setCellValue(selR,selC,$('formulaInput').value); });

/* 행/열 추가 */
$('shAddRow').onclick = ()=>{ shData.push(Array(shCols).fill('')); shRows++; buildHF(); renderSheet(); };
$('shAddCol').onclick = ()=>{ shData.forEach(r=>r.push('')); shCols++; buildHF(); renderSheet(); };
/* 새 표 */
$('shNew').onclick = async ()=>{

    if(!await askConfirm(T('cfNewSheet'))) return;
  }
  shRows=30; shCols=12; shData=Array.from({length:shRows},()=>Array(shCols).fill('')); shStyle={};
  buildHF(); selR=0; selC=0; renderSheet(); msg(T('mNewSheet'));
};
/* 스타일: 굵게/색/배경 */
function applyStyle(prop, val){
  const key = selR+','+selC;
  shStyle[key] = shStyle[key] || {};
  if(prop==='bold') shStyle[key].bold = !shStyle[key].bold;
  else shStyle[key][prop] = val;
  renderSheet(); selectCell(selR,selC);
}
$('shBold').onclick = ()=> applyStyle('bold');
$('shColor').oninput = e=> applyStyle('color', e.target.value);
$('shFill').onclick = ()=> applyStyle('bg', $('shBg').value);
/* 정렬 (선택한 열 기준, 1행은 머리글로 보고 제외 옵션 없이 전체 정렬) */
function sortByCol(asc){
  const c = selC;
  const rows = shData.map(r=>r.slice());
  rows.sort((a,b)=>{
    let x=a[c], y=b[c];
    const nx=parseFloat(x), ny=parseFloat(y);
    const bothNum = !isNaN(nx)&&!isNaN(ny)&&String(x).trim()!==''&&String(y).trim()!=='';
    let cmp;
    if(bothNum) cmp = nx-ny;
    else cmp = String(x).localeCompare(String(y));
    return asc?cmp:-cmp;
  });
  shData = rows; buildHF(); renderSheet();
  msg(asc?T('mSortedAsc'):T('mSortedDesc'));
}
$('shSortAsc').onclick = ()=> sortByCol(true);
$('shSortDesc').onclick = ()=> sortByCol(false);

/* 엑셀/CSV 열기 → 스프레드시트로 */
$('shOpen').onclick = ()=>{
  if(typeof XLSX==='undefined'){ msg(T('mXlsxNoMod')); return; }
  $('fileSheetOpen').click();
};
$('fileSheetOpen').onchange = e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      /* 수식 보존: raw 셀에서 f(수식) 우선, 없으면 값 */
      const ref = XLSX.utils.decode_range(ws['!ref']||'A1');
      const nR = ref.e.r+1, nC = ref.e.c+1;
      shRows = Math.max(30, nR); shCols = Math.max(12, nC);
      shData = Array.from({length:shRows},()=>Array(shCols).fill(''));
      shStyle = {};
      for(let r=0;r<nR;r++) for(let c=0;c<nC;c++){
        const addr = XLSX.utils.encode_cell({r,c});
        const cell = ws[addr];
        if(!cell) continue;
        shData[r][c] = cell.f ? '='+cell.f : (cell.v==null?'':cell.v);
      }
      buildHF(); selR=0; selC=0; renderSheet();
      msg(f.name + T('mXlsxImported'));
    }catch(err){ msg(T('mImportFail')+err.message); }
  };
  rd.readAsArrayBuffer(f); e.target.value='';
};
/* 표 → 엑셀 저장 (계산된 값 + 수식 함께) */
function sheetToAOA(computed){
  const out=[];
  let maxR=0,maxC=0;
  for(let r=0;r<shRows;r++) for(let c=0;c<shCols;c++) if(shData[r][c]!==''&&shData[r][c]!=null){ maxR=Math.max(maxR,r); maxC=Math.max(maxC,c); }
  for(let r=0;r<=maxR;r++){ const row=[]; for(let c=0;c<=maxC;c++){
    const raw=shData[r][c];
    if(computed && typeof raw==='string' && raw[0]==='='){ const v=cellDisplay(r,c); const n=parseFloat(v); row.push(!isNaN(n)&&v.trim()!==''?n:v); }
    else { const n=parseFloat(raw); row.push(typeof raw==='string'&&!isNaN(n)&&raw.trim()!==''?n:raw); }
  } out.push(row); }
  return out;
}
$('shSaveXlsx').onclick = async ()=>{
  if(typeof XLSX==='undefined'){ msg(T('mXlsxNoMod')); return; }
  const ws=XLSX.utils.aoa_to_sheet(sheetToAOA(true));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Sheet1');
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  await download(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), T('fnTable')+new Date().toISOString().slice(0,10)+'.xlsx');
};
$('shSaveCsv').onclick = async ()=>{
  const aoa=sheetToAOA(true);
  const csv=aoa.map(r=>r.map(x=>{ const s=(x==null?'':String(x)); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(',')).join('\n');
  await download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}), T('fnTable')+new Date().toISOString().slice(0,10)+'.csv');
};
/* 표 → 문서(글 모드)로 삽입 */
$('shToDoc').onclick = ()=>{
  const aoa=sheetToAOA(true);
  if(!aoa.length){ msg(T('mSheetEmpty')); return; }
  let html='<table>';
  aoa.forEach((r,ri)=>{ html+='<tr>'; r.forEach(v=>{ const tag=ri===0?'th':'td'; const s=(v==null||v==='')?'<br>':escHtml(String(v)); html+=`<${tag}>${s}</${tag}>`; }); html+='</tr>'; });
  html+='</table><p><br></p>';
  setMode('doc'); editor.focus();
  const sel=window.getSelection();
  if(!sel.rangeCount||!editor.contains(sel.anchorNode)) editor.appendChild(document.createRange().createContextualFragment(html));
  else document.execCommand('insertHTML',false,html);
  editor.dataset.welcome='0';
  msg(T('mSentToDoc'));
};

/* ═══════════════ PDF 모드 ═══════════════ */
let pdfDoc = null;        // pdf.js 문서 객체 (렌더링용)
let pdfBytes = null;      // 원본 바이트 (pdf-lib 편집용)
let pdfPage = 1, pdfTotal = 0, pdfScale = 1;
let pdfWorkerSet = false;

function setPdfWorker(){
  if(pdfWorkerSet || typeof pdfjsLib === 'undefined') return;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  pdfWorkerSet = true;
}
async function loadPdf(bytes){
  if(typeof pdfjsLib === 'undefined'){ msg(T('mPdfNoMod')); return; }
  setPdfWorker();
  pdfBytes = bytes.slice(0);  // 편집용 원본 보관
  pdfDoc = await pdfjsLib.getDocument({data:bytes.slice(0)}).promise;
  pdfTotal = pdfDoc.numPages; pdfPage = 1;
  $('pdfEmpty').style.display='none';
  $('pdfCanvas').style.display='block';
  await renderPdfPage();
}
async function renderPdfPage(){
  if(!pdfDoc) return;
  const page = await pdfDoc.getPage(pdfPage);
  const viewport = page.getViewport({scale: pdfScale * 1.5});  // 1.5=선명도
  const cv = $('pdfCanvas'), ctx = cv.getContext('2d');
  cv.width = viewport.width; cv.height = viewport.height;
  cv.style.width = (viewport.width/1.5)+'px';
  cv.style.height = (viewport.height/1.5)+'px';
  await page.render({canvasContext:ctx, viewport}).promise;
  $('pdfPageInfo').textContent = `${pdfPage} / ${pdfTotal}`;
}
$('pdfOpen').onclick = ()=>{
  if(typeof pdfjsLib === 'undefined'){ msg(T('mPdfNoMod')); return; }
  $('filePdfOpen').click();
};
$('filePdfOpen').onchange = e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async ()=>{ try{ await loadPdf(new Uint8Array(rd.result)); msg(f.name+T('mPdfOpened')); }catch(err){ msg(T('mPdfFail')+err.message); } };
  rd.readAsArrayBuffer(f); e.target.value='';
};
/* 페이지 이동 */
$('pdfPrev').onclick = async ()=>{ if(pdfDoc && pdfPage>1){ pdfPage--; await renderPdfPage(); } };
$('pdfNext').onclick = async ()=>{ if(pdfDoc && pdfPage<pdfTotal){ pdfPage++; await renderPdfPage(); } };
$('pdfZoom').onchange = async e=>{ pdfScale=+e.target.value; await renderPdfPage(); };
/* 이어붙이기 (pdf-lib) */
$('pdfAdd').onclick = ()=>{
  if(!pdfBytes){ msg(T('mPdfOpenFirst')); return; }
  if(typeof PDFLib === 'undefined'){ msg(T('mPdfNoMod')); return; }
  $('filePdfAdd').click();
};
$('filePdfAdd').onchange = e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async ()=>{
    try{
      const base=await PDFLib.PDFDocument.load(pdfBytes);
      const add=await PDFLib.PDFDocument.load(new Uint8Array(rd.result));
      const pages=await base.copyPages(add, add.getPageIndices());
      pages.forEach(p=>base.addPage(p));
      const merged=await base.save();
      await loadPdf(new Uint8Array(merged));
      msg(T('mPdfMerged'));
    }catch(err){ msg(T('mPdfFail')+err.message); }
  };
  rd.readAsArrayBuffer(f); e.target.value='';
};
/* 현재 페이지 → 그림 모드 */
$('pdfToImg').onclick = ()=>{
  if(!pdfDoc){ msg(T('mPdfOpenFirst')); return; }
  const dataURL = $('pdfCanvas').toDataURL('image/png');

/* 현재 페이지 PNG 저장 */
$('pdfExtractPng').onclick = async ()=>{
  if(!pdfDoc){ msg(T('mPdfOpenFirst')); return; }
  $('pdfCanvas').toBlob(b=> download(b, T('fnPdfPage')+pdfPage+'_'+new Date().toISOString().slice(0,10)+'.png'), 'image/png');

/* 현재 페이지만 PDF로 저장 (pdf-lib) */
$('pdfSavePage').onclick = async ()=>{
  if(!pdfBytes){ msg(T('mPdfOpenFirst')); return; }
  try{
    const src=await PDFLib.PDFDocument.load(pdfBytes);
    const out=await PDFLib.PDFDocument.create();
    const [pg]=await out.copyPages(src, [pdfPage-1]);
    out.addPage(pg);
    const bytes=await out.save();
    await download(new Blob([bytes],{type:'application/pdf'}), T('fnPdfPage')+pdfPage+'.pdf');
  }catch(err){ msg(T('mPdfFail')+err.message); }
};
/* 전체 PDF 저장 */
$('pdfSaveAll').onclick = async ()=>{
  if(!pdfBytes){ msg(T('mPdfOpenFirst')); return; }
  await download(new Blob([pdfBytes],{type:'application/pdf'}), T('fnPdf')+new Date().toISOString().slice(0,10)+'.pdf');
};
/* 현재 페이지 삭제 (pdf-lib) */
$('pdfDelPage').onclick = async ()=>{
  if(!pdfBytes){ msg(T('mPdfOpenFirst')); return; }
  if(pdfTotal <= 1){ msg(T('mPdfLastPage')); return; }
  if(!await askConfirm(T('cfDelPage').replace('{n}', pdfPage))) return;
  try{
    const src = await PDFLib.PDFDocument.load(pdfBytes);
    src.removePage(pdfPage - 1);
    const bytes = await src.save();
    const keepPage = Math.min(pdfPage, pdfTotal - 1);  /* 삭제 후 볼 페이지 */
    await loadPdf(new Uint8Array(bytes));
    pdfPage = keepPage; await renderPdfPage();
    msg(T('mPdfPageDeleted'));
  }catch(err){ msg(T('mPdfFail') + err.message); }
};

/* URL의 ?lang=en / ?lang=ko를 최우선 적용하고, 없으면 브라우저 기본 언어를 따름 */
const requestedLang = new URLSearchParams(window.location.search).get('lang');
if(requestedLang === 'en' || requestedLang === 'ko') {
  LANG = requestedLang;
} else {
  const browserLang = ((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase();
  LANG = browserLang.startsWith('ko') ? 'ko' : 'en';
}
loadLetterhead();
fillWelcome();
applyLang();

/* 초기화 */
applyZoom(); render(); renderPanel();
window.addEventListener('beforeunload', e=>{ e.preventDefault(); e.returnValue=''; });
</script>
</body>
</html>
